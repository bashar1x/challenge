            align-items: center;
            gap: 0.7rem;
        }

        .header-title i {

            color: #1e1b1a;
            position: relative;
            padding-right: 1.5rem;
        }

        .question-text::before {

            right: -0.2rem;
            top: -0.3rem;
            font-weight: 700;
            font-size: 2.9rem;
            color: #b8731a;
            opacity: 0.25;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin: 1.8rem 0 1.5rem;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            border: 1.5px solid rgba(0,0,0,0.04);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);

            align-items: center;
            gap: 1rem;
            font-weight: 500;
            color: #3a3533;
            transition: all 0.25s;
            cursor: default;
            border-right: 5px solid transparent;
        }

        .option-item.correct-option {
            background: #fef9f2;
            border-right: 5px solid #b8731a;
            border-color: rgba(184, 115, 26, 0.4);
            box-shadow: 0 8px 18px rgba(184, 115, 26, 0.1);
            color: #3a2c1a;
        }

        .option-letter {

            align-items: center;
            justify-content: center;
            background: #f7f3ef;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            color: #b8731a;
            flex-shrink: 0;
            font-size: 1rem;
            border: 1px solid rgba(184,115,26,0.2);
        }

            border-radius: 1.5rem;

            margin: 2rem 0 1rem;

            align-items: flex-start;
            gap: 1rem;
            border: 1px dashed #b8731a50;
            box-shadow: 0 5px 12px rgba(184, 115, 26, 0.05);

            font-size: 1.3rem;
            margin-top: 0.2rem;
        }

            font-weight: 500;
            color: #3e2e1e;
            line-height: 1.5;
        }

            border-radius: 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #8a5a2a;
            display: inline-block;
        }

        .button-group {

            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin: 2rem 0 1rem;
        }

        .btn {
            padding: 0.9rem 2.2rem;
            border-radius: 2.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.25s;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            color: #2c2a2e;
            letter-spacing: -0.2px;
        }

        .btn-primary {
            width: 100%;
            background: #ffffff;
            color: #b8731a;
            border: 1.5px solid rgba(184, 115, 26, 0.3);
        }

        .btn-primary:hover {
            background: #fffaf3;
            box-shadow: 0 10px 22px rgba(184, 115, 26, 0.12);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #d9cfc5;
            color: #4e4540;
        }

        .btn-outline:hover {
            background: #ffffffd0;
            border-color: #b8731a;
            transform: translateY(-2px);
        }

        /* نافذة الشك */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 46, 0.3);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #fefcf9;
            border-radius: 2.5rem;
            max-width: 520px;
            width: 100%;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transform: scale(0.96);
            transition: 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c2a2e;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
        }

        .modal-title i {
            color: #b8731a;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            color: #4f4640;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;

            font-family: inherit;
            font-size: 1rem;
            color: #2c2a2e;
            outline: none;
            transition: 0.2s;
            resize: vertical;
        }

            border-color: #b8731a;
            box-shadow: 0 0 0 4px rgba(184, 115, 26, 0.1);

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;

            padding: 0.9rem 2rem;

            font-weight: 600;
            cursor: pointer;

            box-shadow: 0 8px 18px rgba(184, 115, 26, 0.3);

        .btn-submit:hover {
            background: #9e5f14;

        }

        .btn-cancel {
            background: transparent;
            border: 1.5px solid #ccc1b6;
            color: #4e4540;
            padding: 0.9rem 1.8rem;
            border-radius: 2.5rem;
            font-weight: 500;
            cursor: pointer;
        }

        .warning-badge {
            background: #c0392b10;
            color: #c0392b;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .footer-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #8d7f74;
        }

        .highlight {
            background: #fef3e5;
            padding: 0.1rem 0.5rem;
            border-radius: 0.5rem;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 0.7rem;
                border-radius: 2rem;
            }
            .question-text {
                font-size: 1.2rem;
            }
        }
        .truing{
            font-size: 0.8rem;
        }
    </style>
</head>

      "A - لخضوع الفرد لضغط الجماعة",
      "B - لتلاحم الفرد مع الجماعة",
      "C - لاستقلال الفرد عن الجماعة",
      "D - كل ما ذكر خاطئ"
    ],
    "correct": 0,
    "note": "الإجابة A؛ يُتخذ التكيف أو التوافق والمسايرة معياراً لمدى خضوع الفرد لضغط الجماعة والامتثال لقواعدها (المحاضرة الأولى: مفهوم السلوك الاجتماعي وفستنجر، والفصل التاسع: المعيار القيمي والمسايرة)."
  }
]



            // رقم الواتساب (بصيغة دولية بدون + أو 00)
            const WHATSAPP_NUMBER = '963985780023'; // قم بتعديل الرقم إذا لزم (بدون مسافات أو رموز)
            
            // حالة التطبيق
            let currentIndex = 0;
            const totalQuestions = questionsData.length;
            
            // عناصر DOM
            const quizArea = document.getElementById('quizArea');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const doubtBtn = document.getElementById('doubtBtn');
            const shareBtn = document.getElementById('shareBtn');
            const counterDisplay = document.getElementById('counterDisplay');
            
            const modalOverlay = document.getElementById('doubtModal');
            const cancelDoubt = document.getElementById('cancelDoubt');
            const submitDoubt = document.getElementById('submitDoubt');
            const studentNameInput = document.getElementById('studentName');
            const correctAnswerSelect = document.getElementById('correctAnswerSelect');
            const doubtReasonInput = document.getElementById('doubtReason');

            // دوال مساعدة
            function renderQuestion(index) {
                if (index < 0 || index >= totalQuestions) return;
                const q = questionsData[index];
                const correctIdx = q.correct;
                const optionLetters = ['أ', 'ب', 'ج', 'د'];
                
                let optionsHtml = '';
                q.options.forEach((opt, i) => {
                    const isCorrect = (i === correctIdx);
                    const letter = optionLetters[i] || String.fromCharCode(65+i);
                    optionsHtml += `
                        <div class="option-item ${isCorrect ? 'correct-option' : ''}">
                            <span class="option-letter">${letter}</span>
                            <span>${opt}</span>
                            ${isCorrect ? '<i class="fas fa-check-circle" style="color:#b8731a; margin-right:auto; font-size:1.2rem;"></i>' : ''}
                        </div>
                    `;
                });

                const noteHtml = `
                    <div class="solution-note">
                       
                        <div>
                            <p><strong> <i class="fas fa-lightbulb"></i> لماذا هذا الحل؟</strong><br>${q.note || 'الشرح غير متوفر'}</p>
                        
                        </div>
                    </div>
                `;

                const fullHtml = `
                    <div class="question-text">${q.quiz}</div>
                    <div class="options-grid">${optionsHtml}</div>
                    ${noteHtml}
                    <div style="margin-top:1rem; display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; color:#7f6e60;">
                        <span><i class="fas fa-hashtag"></i> سؤال رقم ${q.id}</span>
                        <span><i class="fas fa-check-double"></i> الإجابة الصحيحة: ${optionLetters[correctIdx]}</span>
                    </div>
                `;
                quizArea.innerHTML = fullHtml;
                updateCounter();
            }

            function updateCounter() {
                counterDisplay.innerHTML = `<i class="fas fa-question-circle"></i> سؤال ${currentIndex + 1} من ${totalQuestions}`;
            }

            // التنقل
            function goPrev() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion(currentIndex);
                }
            }

            function goNext() {
                if (currentIndex < totalQuestions - 1) {
                    currentIndex++;
                    renderQuestion(currentIndex);
                }
            }

            // فتح وإغلاق المودال
            function openModal() {
                const currentQ = questionsData[currentIndex];
                correctAnswerSelect.value = currentQ.correct.toString();
                studentNameInput.value = '';
                doubtReasonInput.value = '';
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            // الحصول على رابط السؤال الحالي
            function getQuestionUrl(questionId) {
                const baseUrl = window.location.href.split('?')[0];
                return `${baseUrl}?question=${questionId}`;
            }

            // مشاركة السؤال
            function shareQuestion() {
                const currentQ = questionsData[currentIndex];
                const questionUrl = getQuestionUrl(currentQ.id);
                const shareText = `ساعدني في حل هذا السؤال:\n\n${currentQ.quiz}\n\n${questionUrl}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'ساعدني في حل هذا السؤال',
                        text: shareText,
                    }).catch(err => {
                        console.log('Error sharing:', err);
                    });
                } else {
                    // Fallback للواتساب
                    const encodedText = encodeURIComponent(shareText);
                    const whatsappUrl = `https://wa.me/?text=${encodedText}`;
                    window.open(whatsappUrl, '_blank');
                }
            }

            // إرسال الشك عبر واتساب
            function handleSubmitDoubt() {
                const name = studentNameInput.value.trim();
                const correctAnswer = correctAnswerSelect.value;
                const reason = doubtReasonInput.value.trim();

                if (!name) {
                    alert('⚠️ يرجى إدخال اسمك للمشاركة في التصحيح');
                    return;
                }
                if (!correctAnswer) {
                    alert('⚠️ يرجى تحديد الإجابة الصحيحة من وجهة نظرك');
                    return;
                }
                if (!reason) {
                    alert('⚠️ يرجى كتابة سبب الاعتراض');
                    return;
                }

                const currentQuestion = questionsData[currentIndex];
                const optionLetters = ['أ', 'ب', 'ج', 'د'];
                const selectedCorrectText = currentQuestion.options[parseInt(correctAnswer)];
                const questionUrl = getQuestionUrl(currentQuestion.id);
                
                // بناء رسالة نصية منسقة
                const message = 
                    `📢 *تقرير مراجعة حل*\n\n` +
                    `👤 *الاسم:* ${name}\n` +
                    `📄 *السؤال رقم:* ${currentQuestion.id}\n` +
                    `❓ *نص السؤال:* ${currentQuestion.quiz}\n` +
                    `✅ *الإجابة الصحيحة المقترحة:* ${optionLetters[parseInt(correctAnswer)]} - ${selectedCorrectText}\n` +
                    `💬 *سبب الاعتراض:* ${reason}\n\n` +
                    `🔗 *رابط السؤال:* ${questionUrl}`;

                // إنشاء رابط واتساب
                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
                
                // فتح الرابط في نافذة جديدة
                window.open(whatsappUrl, '_blank');
                
                // إغلاق المودال بعد الإرسال
                closeModal();
                
                // عرض رسالة تأكيد
                alert('✓ تم فتح واتساب لإرسال التصحيح. إذا لم يفتح تلقائياً، تحقق من اتصالك بالإنترنت.');
                
                console.log('رسالة واتساب:', message);
            }

            // قراءة الـ query parameter عند تحميل الصفحة
            function loadQuestionFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const questionParam = urlParams.get('question');
                
                if (questionParam) {
                    const questionId = parseInt(questionParam);
                    const questionIndex = questionsData.findIndex(q => q.id === questionId);
                    
                    if (questionIndex !== -1) {
                        currentIndex = questionIndex;
                        renderQuestion(currentIndex);
                        
                        // تحديث الرابط بدون إعادة تحميل الصفحة
                        const baseUrl = window.location.href.split('?')[0];
                        window.history.replaceState({}, document.title, baseUrl);
                        
                        // إظهار تنبيه
                        setTimeout(() => {
                            alert(`✓ تم فتح السؤال رقم ${questionId} من الرابط المشترك`);
                        }, 300);
                    }
                }
            }

            // ربط الأحداث
            prevBtn.addEventListener('click', goPrev);
            nextBtn.addEventListener('click', goNext);
            doubtBtn.addEventListener('click', openModal);
            shareBtn.addEventListener('click', shareQuestion);
            cancelDoubt.addEventListener('click', closeModal);
            submitDoubt.addEventListener('click', handleSubmitDoubt);
            
            // إغلاق المودال عند النقر خارج المحتوى
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // التهيئة
            renderQuestion(currentIndex);
            
            // تحميل السؤال من الرابط إذا وجد
            loadQuestionFromUrl();
        })();
    </script>
</body>
</html>

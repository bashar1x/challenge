    <style>
        /* ==============================================================
           التصميم النهاري الدافئ
           ============================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #fcf9f7 0%, #f0edea 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: all 0.4s ease;
        }

        /* ====== وضع ملء الشاشة النقي - إخفاء البدي بالكامل ====== */
        body.fullscreen-pure-mode {
            padding: 0 !important;
            margin: 0 !important;
            background: #fcf9f7 !important;
            overflow: hidden !important;
            /* إزالة السكرول من البدي */
        }

        /* إخفاء شريط التمرير في وضع ملء الشاشة */
        body.fullscreen-pure-mode::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body.fullscreen-pure-mode {
            -ms-overflow-style: none !important;
            /* IE و Edge */
            scrollbar-width: none !important;
            /* Firefox */
        }

        .app-container {
            background: rgba(255, 252, 250, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 30px;
            max-width: 1100px;
            width: 100%;
            border: 1px solid rgba(184, 115, 26, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        /* ====== إخفاء التطبيق بالكامل في وضع ملء الشاشة ====== */
        body.fullscreen-pure-mode .app-container {
            display: none !important;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background:
                radial-gradient(circle at 20% 30%, rgba(184, 115, 26, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(184, 115, 26, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.02) 0%, transparent 60%);
            animation: float-bg 20s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float-bg {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(20px, -20px) rotate(3deg);
            }
        }

        .app-container>* {
            position: relative;
            z-index: 1;
        }

        .app-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(184, 115, 26, 0.10);
            margin-bottom: 25px;
        }

        .app-header h1 {
            font-size: 2.5rem;
            color: #2c2a2e;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .app-header h1 .highlight {
            background: linear-gradient(135deg, #b8731a, #d4a04a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .subtitle {
            color: #6b5f55;
            font-size: 0.95rem;
            margin-top: 5px;
            font-weight: 400;
        }

        .progress-bar-container {
            background: rgba(255, 252, 250, 0.6);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .progress-bar-container .label {
            color: #4a4038;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .progress-bar-container .label .emoji {
            font-size: 1.2rem;
        }

        .progress-track {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: rgba(184, 115, 26, 0.08);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        .progress-track .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b8731a, #d4a04a, #e8c77a);
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-track .fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .progress-text {
            color: #b8731a;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 60px;
            text-align: left;
        }

        .map-container {
            position: relative;
            padding: 30px 10px 40px 10px;
            min-height: 350px;
            background: rgba(255, 252, 250, 0.25);
            border-radius: 28px;
            border: 1px solid rgba(184, 115, 26, 0.04);
        }

        .map-grid {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 8px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .map-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 80px;
            max-width: 130px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .map-node .node-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 252, 250, 0.5);
            border: 2.5px solid rgba(44, 42, 46, 0.08);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .map-node .node-circle .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .map-node .node-circle .number {
            font-size: 0.6rem;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 600;
        }

        .map-node .node-circle .lock-icon {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 0.9rem;
            background: rgba(255, 252, 250, 0.85);
            border-radius: 50%;
            padding: 2px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .map-node.locked .node-circle {
            opacity: 0.5;
            filter: grayscale(0.6);
            cursor: not-allowed;
            border-color: rgba(44, 42, 46, 0.04);
        }

        .map-node.locked .node-label {
            color: #b0a89e;
        }

        .map-node.available .node-circle {
            border-color: #b8731a;
            background: rgba(184, 115, 26, 0.06);
            box-shadow: 0 4px 20px rgba(184, 115, 26, 0.08);
            cursor: pointer;
        }

        .map-node.available .node-circle:hover {
            transform: scale(1.1) translateY(-6px);
            box-shadow: 0 8px 35px rgba(184, 115, 26, 0.15);
            background: rgba(184, 115, 26, 0.10);
        }

        .map-node.completed .node-circle {
            border-color: #2d8f5c;
            background: rgba(45, 143, 92, 0.06);
            box-shadow: 0 4px 20px rgba(45, 143, 92, 0.06);
        }

        .map-node.completed .node-circle:hover {
            transform: scale(1.05);
        }

        .map-node.current .node-circle {
            border-color: #d4a04a;
            background: rgba(212, 160, 74, 0.08);
            box-shadow: 0 0 0 4px rgba(212, 160, 74, 0.08), 0 8px 30px rgba(212, 160, 74, 0.10);
            animation: pulse-node 1.8s ease-in-out infinite;
        }

        @keyframes pulse-node {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(212, 160, 74, 0.08), 0 8px 30px rgba(212, 160, 74, 0.10);
            }

            50% {
                transform: scale(1.06);
                box-shadow: 0 0 0 8px rgba(212, 160, 74, 0.02), 0 8px 40px rgba(212, 160, 74, 0.15);
            }
        }

        .map-node .node-label {
            color: #4a4038;
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
            line-height: 1.3;
        }

        .map-node .node-keys {
            font-size: 0.6rem;
            color: #8a7a6a;
            margin-top: 3px;
        }

        .map-node .node-keys .gold {
            color: #b8731a;
            font-weight: 700;
        }

        .map-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: rgba(44, 42, 46, 0.08);
            flex-shrink: 0;
            padding: 0 5px;
            min-width: 30px;
            transition: all 0.5s ease;
        }

        .map-arrow.active {
            color: #b8731a;
        }

        .map-arrow.completed {
            color: #2d8f5c;
        }

        /* ====== نافذة المحاضرة ====== */
        .lecture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 46, 0.20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.4s ease;
        }

        .lecture-modal.active {
            display: flex;
        }

        .lecture-modal .modal-content {
            background: rgba(255, 252, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            animation: modal-slide 0.4s ease;
            transition: all 0.4s ease;
        }

        .modal-content::-webkit-scrollbar {
            display: none;
        }

        @keyframes modal-slide {
            from {
                transform: translateY(30px) scale(0.97);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .lecture-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header h2 {
            color: #2c2a2e;
            font-size: 1.3rem;
            font-weight: 700;
            flex: 1;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header .header-actions button {
            background: rgba(44, 42, 46, 0.04);
            border: 1px solid rgba(44, 42, 46, 0.04);
            color: #6b5f55;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .lecture-modal .modal-header .header-actions button:hover {
            background: rgba(184, 115, 26, 0.06);
            border-color: rgba(184, 115, 26, 0.15);
            color: #b8731a;
        }

        .lecture-modal .modal-header .header-actions .close-btn:hover {
            background: rgba(192, 57, 43, 0.06);
            border-color: rgba(192, 57, 43, 0.15);
            color: #c0392b;
        }

        .lecture-modal .modal-body {
            color: #3a3538;
            line-height: 1.8;
            font-size: 0.95rem;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 5px;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-body::-webkit-scrollbar {
            width: 5px;
        }

        .lecture-modal .modal-body::-webkit-scrollbar-thumb {
            background: #b8731a;
            border-radius: 10px;
        }

        .lecture-modal .modal-body::-webkit-scrollbar-track {
            background: rgba(184, 115, 26, 0.04);
            border-radius: 10px;
        }

        .lecture-modal .modal-body h3 {
            color: #b8731a;
            margin: 20px 0 10px 0;
            font-weight: 700;
        }

        .lecture-modal .modal-body h4 {
            color: #8a6a3a;
            margin: 15px 0 8px 0;
            font-weight: 600;
        }

        .lecture-modal .modal-body p {
            color: #3a3538;
        }

        .lecture-modal .modal-body ul {
            padding-right: 25px;
            margin: 8px 0;
        }

        .lecture-modal .modal-body ul li {
            margin: 4px 0;
            color: #3a3538;
        }

        /* ====== المفاتيح ====== */
        .keys-section-modal {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(184, 115, 26, 0.06);
            transition: all 0.4s ease;
        }

        .keys-section-modal .keys-title {
            color: #4a4038;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .keys-section-modal .keys-title .count {
            color: #b8731a;
            font-weight: 700;
        }

        .keys-grid-modal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            max-width: 500px;
        }

        .key-item-modal {
            aspect-ratio: 1/1;
            border-radius: 12px;
            border: 2px solid rgba(44, 42, 46, 0.04);
            background: rgba(255, 252, 250, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: #8a7a6a;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .key-item-modal.unlocked {
            background: rgba(45, 143, 92, 0.06);
            border-color: #2d8f5c;
            color: #2d8f5c;
            cursor: default;
        }

        .key-item-modal.locked-key {
            cursor: pointer;
            color: #4a4038;
        }

        .key-item-modal.locked-key:hover {
            background: rgba(184, 115, 26, 0.06);
            border-color: #b8731a;
            transform: scale(1.05);
        }

        /* ================================================================
           وضع ملء الشاشة النقي 100% - إخفاء كل شيء
           ================================================================ */

        /* إخفاء نافذة المحاضرة بالكامل ونظهر فقط المحتوى */
        body.fullscreen-pure-mode .lecture-modal {
            background: #fcf9f7 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 9999 !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-content {
            max-width: 100% !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            padding: 40px 60px !important;
            background: #fcf9f7 !important;
            animation: none !important;
            border: none !important;
            box-shadow: none !important;
            max-height: 100vh !important;
            overflow-y: auto !important;
            margin: 0 !important;
        }

        /* إخفاء الهيدر والمفاتيح */
        body.fullscreen-pure-mode .lecture-modal .modal-header {
            display: none !important;
        }

        body.fullscreen-pure-mode .lecture-modal .keys-section-modal {
            display: none !important;
        }

        /* تكبير المحتوى وتحسين القراءة */
        body.fullscreen-pure-mode .lecture-modal .modal-body {
            max-height: 100vh !important;
            font-size: 1.2rem !important;
            line-height: 2.2 !important;
            padding: 0 !important;
            overflow-y: auto !important;
        }

        /* إخفاء شريط التمرير في المحتوى أثناء ملء الشاشة */
        body.fullscreen-pure-mode .lecture-modal .modal-body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body h3 {
            font-size: 1.8rem !important;
            color: #b8731a !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body h4 {
            font-size: 1.4rem !important;
            color: #8a6a3a !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body p {
            font-size: 1.15rem !important;
            color: #2c2a2e !important;
            font-weight: 500;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body ul li {
            font-size: 1.15rem !important;
            color: #2c2a2e !important;
            margin: 6px 0 !important;
        }

        /* ====== زر الخروج من ملء الشاشة (عائم) ====== */
        .exit-fullscreen-float {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999 !important;
            background: rgba(44, 42, 46, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .exit-fullscreen-float:hover {
            background: rgba(184, 115, 26, 0.95);
            transform: translateX(-50%) scale(1.05);
        }

        .exit-fullscreen-float.show {
            
            
        }

        @keyframes float-up {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ====== نافذة السؤال ====== */
        .question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 46, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .question-modal.active {
            display: flex;
        }

        .question-box {
            background: rgba(255, 252, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            animation: modal-slide 0.3s ease;
        }

        .question-box .q-number {
            color: #b8731a;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .question-box .q-text {
            color: #2c2a2e;
            font-size: 1.1rem;
            margin: 15px 0 20px 0;
            line-height: 1.6;
            font-weight: 500;
        }

        .question-box .q-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-box .q-options button {
            background: rgba(255, 252, 250, 0.3);
            border: 1.5px solid rgba(44, 42, 46, 0.04);
            border-radius: 12px;
            padding: 12px 18px;
            color: #2c2a2e;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-weight: 500;
        }

        .question-box .q-options button:hover:not(:disabled) {
            background: rgba(184, 115, 26, 0.06);
            border-color: #b8731a;
        }

        .question-box .q-options button.correct {
            background: rgba(45, 143, 92, 0.08);
            border-color: #2d8f5c;
            color: #2d8f5c;
        }

        .question-box .q-options button.wrong {
            background: rgba(192, 57, 43, 0.08);
            border-color: #c0392b;
            color: #c0392b;
        }

        .question-box .q-options button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .question-box .q-feedback {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 12px;

    {
        "id": 0,
        "title": "📘 الأنثروبولوجيا الأخلاقية وعلم العادات",
        "content": "<h3>الانثروبولوجيا الأخلاقية _ علم العادات الأخلاقية:</h3>\n<p>يشير مصطلح العادات الأخلاقية إلى إيضاح نشأة القواعد والمعايير السلوكية وتحولها إلى أوامر ملزمة حقوقية واقتصادية وفي إطارها ظهرت المؤسسات التي يمثل مجموعها حضارة الإنسان ومصيرها.</p>\n<h4>من هذه العادات الأخلاقية الانثروبولوجيا التي ظهرت لدى الإنسان منذ القدم:</h4>\n<h4>1. القربان البشري والقتل:</h4>\n<p>مثل هذه العادات لا تحترم الكرامة الإنسانية، ولا تقيم وزناً للإنسان وتقضي على حقه في الحياة البيولوجية وكذلك في الحياة المعنوية كالقتل والإكراه والتعذيب والحرب والاستعمار والاستعباد، وقتل الآباء أبنائهم والأبناء آبائهم.</p>\n<p>فالقربان البشري والتضحية بالإنسان استرضاء لكائنات خارقة للطبيعة هي الآلهة وهو أساس العبادة في المجتمعات البدائية، والقربان هدية أسمى والذبيحة سواء كان بشر أم حيوانات كانت تختار بعناية لتقديمها للآلهة ويؤكد ذلك طقوس معينة تعبر عن مشاعر الإنسان للآلهة أو ليعرف بنعمها وفضلها أو ليكفر عن ذنوب اقترفت بحقها أو لاسترضاء غضبها.</p>\n<ul>\n<li>انتشر ذلك عند الهنود القدامى واليونان القديمة والإغريق وروما، كما كان الأطفال الصغار يذبحون في شمال أفريقيا قرباناً (لكوكب زحل).</li>\n<li>في الحرب كان القربان البشري لسيف المعركة كي يهب الآلهة النصر أو بعد المعركة يتم ذبح أحد الأسرى عندما يعود بهم المحاربون فيعم السلام بالبلاد واليمن.</li>\n<li>وقد يهدف القربان إلى دفع الأوبئة أو الوقاية منها فالفينيقيون كانوا يضحون بأعز الأصدقاء خلال الحرب وعند انتشار الطاعون كذلك يفعل اليونان.</li>\n<li>وفي إيطاليا كانوا يضحون بكل ولد يولد في الربيع لرد المجاعات وإنهاء النوازل.</li>\n</ul>\n<p>وكثيرا ما تراق الدماء البشرية لأغراض دنيوية، زراعية، طبيعية، صحية أو لتهدئة الأعاصير. وكان (الفيمون) يغسلون سطح المركب الجديد الذي يملكه الرئيس الأعظم بدم 10 رجال يذبحونهم لهذا الغرض، كما أن الأم في أستراليا تقتل ابنها البكر وتلتهم لحمه لتقوى على ولادات أخرى متتالية.</p>\n<p>لكن لما مضى الإنسان في درب الحضارة استعاضوا عن قتل الإنسان بفدية يسمونها (البديل) وبات يقربون القربان البشري عادة همجية لا تحترم حق الإنسان في الحياة مثل (البراجمتية، الرومانية، المستنيرون، شيشرون ....) فباتوا يقدمون مثلاً ثوراً ثميناً تتم تغذيته بشكل جيد ويفتدى به دم الإنسان، وربما تم اكتفاء بجرح الإنسان وسكب بعض دمه دون أن يؤدي ذلك لفقدانه حياته.</p>\n<p><strong>*الكتاب المقدس*</strong>: أشار كذلك إلى قرابين كثيرة كتقديم (هابيل) أبكار غنمه وافتداء إبراهيم ابنه إسماعيل عليه السلام بكبش سمين، كما أن الإيمان بصلب المسيح عليه السلام إيمان بفدية قدمها (ابن الإنسان) أي بذل نفسه فدية عن كثيرين ..... .</p>\n<p>القربان البشري قتل يكتنفه أريج القداسة، ولكن القتل اللاديني عدوان إلا في حالات الإعدام أو القصاص المشروع أو الجهاد.</p>\n<p>لكن القتل بوجه عام يبين القيمة الأخلاقية ملازمة لمعنى الكرامة الإنسانية وينفيها بالقضاء على أول مظهر من مظاهرها وهو المظهر الحيوي أو العضوي الطبيعي.</p>\n<p>فالصينيون القدامى يعاقبون من يقتل والديه أو أحدهما بأشد عقوبة (السجن) وفي كوريا يحرق قاتل أبيه حرقاً ويحكم المصريون القدامى القاتل بالجلد قبل الحرق.</p>\n<p>فقال أفلاطون أن من يقتل أحد والديه يجب أن يعدم عدة مرات لا مرة واحدة.</p>\n<p>وكان الرومان يضعون القاتل في كيس من الجلد المخيط وفي صحبته كلب وديك وأفعى وقرد ويرمى به إما في بحراً أو نهراً.</p>\n<p>كان المجتمع البدائي يأمر بقتل الطفل الغير شرعي أو يتيم الأم أو ولد مشوهاً أو عليلاً وكانوا يعتقدون أن التوأم كذلك الطفل الذي يولد بأسنان هم نذير شؤم يجب أن يقتلوهم، كما أمر أفلاطون بقتل الأطفال المشوهين وكذلك أرسطو أمر بضرورة أن لا يجاوز عدد السكان حداً معيناً لاجتناب الفقر والشرور.</p>\n<p>بالإضافة إلى قتل الجنين (الإجهاض) من قبل النساء إما لإخفاء علاقات غير شرعية أو للحفاظ على الجمال ولكن أفلاطون وأرسطو رفضا ذلك ما لم يكن لسبب حقيقي لأن ذلك يحرم الآباء الأزواج من أبنائهم.</p>\n<h4>2. الرضوخ:</h4>\n<p>للعدوان على الشخص الإنساني وجهان:</p>\n<ul>\n<li>وجه بيولوجي (عضوي)</li>\n<li>وجه معنوي</li>\n</ul>\n<p>الوجه البيولوجي وهو قتل الإنسان قرباناً أو قتله إنسان غريب أو قريب سواء كان هذا القتل ثأر أو أذى، أم إنقاذ لفضيحة أو عار.</p>\n<p>والوجه الآخر هو العدوان المعنوي أو الروحي، وهو ينال من الكرامة الإنسانية التي تمكن الإنسان من الحرية في الاختيار والتقرير والتصرف وتقضي على قناعته الذاتية التي تسمح له بتحقيق أهدافه بدون قسر أو إكراه أو إرغام.</p>\n<p>والرضوخ يسيء لكرامة الفرد والجماعة فالعدوان على الإنسان بالرق والنحاسة والاستعمار فالاستعانة على ذلك بالقهر أو الإغراء أو بالكيد المادي والثقافي و ...... .</p>\n<p>في الأسرة حسب الناس أن في وسع الأب أن يتدخل في حرية أبنائه وأن له حرية التصرف بزوجته أو زوجاته أو عبيده إن وجدوا وذلك باعتبارهم قاصرين من حيث القيمة ومن هنا نشأ واجب خضوع الأبناء للآباء والمرأة للرجل والعبد لسيده خضوعاً تاماً مطلقاً.</p>\n<p>كان يزوج الأب ابنته من غير أن يستشيرها وهي تظل تحت سلطته حتى بعد أن تتزوج وخاصة عندما يعيش الزوج والزوجة في بيت أهلها أو عشيرتها، وسلطة الأب على ابنه والتي تستمر إلى بلوغ الابن لسن البلوغ (الرشد) دون أن يسمح له بالاستقلال.</p>\n<p>فالأبناء في فلورس يرتدون زي العبيد في الحفلات العامة والمآتم طالما أبوهم على قيد الحياة.</p>\n<p>كما يترعرع الطفل الصيني على احترام الوالدين لدرجة تصل إلى عبادة الأجداد، والفتاة اليابانية متأهبة لأعمال البغاء إذا أمرها أبوها.</p>\n<p>فمن واجب المسيحي أن يطيع والديه ولكن هذه الطاعة تعد مقدمة لطاعة الله.</p>\n<p>وفي أمريكا الشمالية إن التقدم بالسن يمنح صاحبه الجاه والسلطة وأن أعلى الأشخاص منزلة وأعظمهم كرامه هم أكبرهم سناً ثم يليهم من دونهم بالسن على وجه الترتيب وعلى الأبناء أن يخضعوا لوالديهم والصغار للكبار خضوع إذعان ورضوخ.</p>\n<p>لقد أعلن أفلاطون أن النساء أدنى منزلة من الرجال في ميدان عمل الرجال ومشاغلهم ويرى أوربيد أن النساء (قاصرات على الخير بارعات في الشر) ويقول الشاعر (الفيدي) إن من العسير توجه روح المرأة في الصراط المستقيم لأن عقلها صغير.</p>\n<p>ويمثل العبرانيون المرأة على أنها ينبوع الشر ومصدر الموت والبلاء في الأرض، وكتب الرسول بولس ولست أبيح للمرأة أن تعلم ولا أن تتسلط على رجلها بل عليها أن تكون ساكنة فقد جبل آدم أولاً ثم حواء ولم يكن آدم الذي أغوي المرأة، المرأة أغوت آدم، فوقعت في التعدي، إلا أنها ستخلص بوالدة الأولاد إن استمرت على الإيمان والمحبة والقداسة مع العقل.</p>\n<p>يؤكد دوركهايم أن المرأة ذات عضوية مختلفة وذلك يتصل بالدم وخاصة دم الحيض والولادة فالرجال ليسوا وحدهم هم الذين يهربون من النساء في تلك الأحوال بل الآلهة أيضاً.</p>\n<p>فقد منعت الكنيسة النساء من الوقوف أو الجلوس مع الرجال وجعلت لهن باباً خاصاً يدخلن الكنيسة منه وطبعاً أبعدتهن عن الوظائف الدينية.</p>\n<p>لكن بدأ وضع المرأة يتغير في القرن الثامن عشر وبدأت تحصل على حقوقها في مختلف المجالات.</p>\n<h4>3. الاستغلال والرق:</h4>\n<p>ويعني ذلك استغلال فريق من الناس فريقاً آخر، استغلال السيد عبده والنحاس بضاعته الحرام بالاتجار بالرقيق الأبيض وغير الأبيض ثم استغلال شعب شعباً آخر أو شعوباً، وهذا الأخير يتدرج من التبعية العنصرية إلى الحماية السياسية فالانتداب والوصاية والاستعمار بوجهيه القديم والمعاصر.</p>\n<p>الرق: وضع الاجتماعي يلزم الرقيق بذل نشاط يفرض عليه بدون مشيئته ولعل أبرز أسبابه الحرب أو الغزو قديماً لجأ إليه البدائيون بدل قتل الأسرى أو عندما يقترف أحد جرماً أو يعجز عن الوفاء بدين ما كما كان عند الهنود وعند البابو كل من يوقد ناراً في متاع غيره يصبح هو وأسرته عبداً لصاحب ذلك المتاع وحين يسرق شخص من طبقة دنيا شخص من طبقة عليا القوم يصبح عبده وربما دفع الإملاق الشديد المرء إلى بيع نفسه بيع العبد.</p>\n<p>في الصين القديمة طبقة من العبيد وأسرى الحرب باعوا أنفسهم أو باعهم غيرهم والأطفال العبيد الذين باعهم آبائهم وقت العواص والفاقة كما أن اختطاف الأطفال يشكل ينبوعاً يغذي سوق النخاسة باستمرار.</p>\n<p>كما ملأ فراعنة الأسرتين الثامنة والتاسعة معبد آمون بالعبيد من الجنسين.</p>\n<p>كان العبد اليهودي يسترد حريته إذا دفع ثمنها.</p>\n<p>بالمقابل كان أفلاطون يحذر سامعيه من ظلم العبيد وكان أرسطو يرى بأن الصداقة أمر محال بين السيد والعبد وعنده العبيد برابرة جعلتهم الطبيعة أدنى من اليونان وليس لهم من الإنسانية إلا الشكل الخارجي.</p>\n<p>سعى البراقيون أيضاً كما أفلاطون للاعتراف بإنسانية العبيد ومحو نظام الرق كما شجعت الكنيسة على تحرير العبيد المسيحيين لتحاكي المسيح عليه السلام الذي جاء ليكسر قيد عبودية أتباعه.</p>\n<p>كان العبد في مملكة بابل الأولى يدفع بعلامة فارقة، ويباع ويشترى في عهد حمورابي بقيمة حمار.</p>\n<p>هناك من يرى بأن للمجاعات الكبرى وانتشار الأوبئة في أوروبا في القرن العاشر والحادي عشر أثر في زوال الرق ويرى آخرون أن السبب هو تحول الرق إلى خدم.</p>\n<p>أما الرق في العالم المعاصر فقد أخذ شكلاً آخر، مثال في جنوب أفريقيا اتخذ شكل تمايز عنصري يقوم على كره الملونين خاصة الزنوج الذين يحرمون من جميع حقوقهم وينظر لهم كأنهم حيوانات شرسة لا بد من ترويضها وهذه النظر تنتشر حتى اليوم في أوروبا وأمريكا.</p>\n<p>لا بد أن أي شكل من أشكال الاستغلال والرق والعبودية هي مظهر غير حضاري ويعكس العدوان على الكرامة البشرية ولا بد من العمل للتخلص منه.</p>\n<h4>4. الاستعمار:</h4>\n<p>يعتبر الاستعمار حالة خاصة من أحوال العلاقات الدولية بقوامها أن يمارس شعب على شعب آخر سلطة تستذل الشعب الأخير وتستغله والأغلب في الاستعمار أن يتم بالقوة أو بالحيلة بل بهما معاً في كثير من الأحيان.</p>\n<p>وقد تنوعت أهداف الاستعمار وطرائقه وهذا التنوع يتعلق بالفارق بين الشعب المستعمِر المتفوق في الميادين التقنية والثقافية وبين الشعب المستعمَر وهو شعب متخلف عن مقتضيات العصر.</p>\n<p>وربما قلب المستعمرون الاحتلال إلى استيطان وصار عددهم يزداد على قدر إبادتهم السكان الأصليين إن لم يستكن هؤلاء السكان لإدارة استقلال المستعمرين إياهم ولم يرضوا بأن يصبحوا عبيداً مستقرين.</p>\n\n<p>برغم المستعمرون أنهم يريدون تحقيق (المدنيّة) لهذه الشعوب التي يستعمرونها لكن نهضة الشعوب تتم فقط بوعيها وحقها تقرير مصيرها بنفسها.</p>\n<h4>5. الحرب:</h4>\n<p>تأخذ الحرب صور شتى وأشكال متفاوتة فالحرب داخل القبيلة أو الدولة الواحدة هي حرب أهلية لكنها بين القبائل والأمم والدول وتكتل الدول هي الحرب بالمعنى الحديث.</p>\n<p>للحروب في وقائعها أنواع وأهداف مختلفة فقد تهدف الدولة المحاربة إلى الاستقلال أو تهدف إلى العدوان أو الحصول على مزايا كاقتطاع إقليم أو احتلال أرض أو إملاء سياسة معينة أو فرض عقيدة دينية أو مذهب سياسي.</p>\n<p>إذا نشبت الحرب من أجل الدفاع عن حق الدولة أو الأمة إلى الدفاع عن النفس سميت حرباً دفاعية، وإذا نشبت على أرض أجنبية سميت حرباً عدوانياً أو غزواً.</p>\n<p>وقد اخترعت الحرب الوقائية التي تهاجم فيها دولة قوية دولة أخرى أو شعباً آخر آمناً بذريعة أن هذا الأخير قد يشن هجوماً عليها ذات يوم.</p>\n<p>أصبحت الحرب فاعلية شاملة تستقطب نشاط العوامل الاقتصادية والقومية والدينية والمذهبية والسياسية وصارت اليد والفكر التقنية، والعلم، الإمكانات والأهداف، كل ذلك صار يلقى لخدمة الحرب في شكل ووحشية متمدنية.</p>\n<p>امتدح الحرب كثيرون وذمها كثيرون فهناك من بذل جهود أخلاقية لمنع الحروب بين الدول فهي لا يجب أن تكون سبيلاً للعلاقات البشرية الجماعية بين تلك الدول لأن هذه الحروب القاسية تطحن الضعفاء والمغلوبين فقط أما الأقوياء فهي تضع لهم مزيداً من النقود والقوة حتى وصل الأمر بالبعض إلى القول بأن الحرب هي مؤسسة ربانية وأنها حكم الله (الملوك ممثلو الله والله هو الذي يضرب أمماً بأسرها ويبيد المدن والقرى وما الحرب إلا عصا الله بيد الأمراء).</p>\n<p>والأمثلة كثيرة على الحروب مثل الحرب العالمية الأولى والثانية، والحرب التي يمارسها العدوان الإسرائيلي على الشعب الفلسطيني.</p>\n<p>الحروب تشكل عدواناً حقيقياً على كرامة الشعوب وحقوق الإنسان لذلك حاولت العديد من المنظمات الدولية سد تشريعات وعقد اتفاقات لإيقاف الحروب واعتبرتها جرائم بحق البشرية لا بد من إنهائها وإحلال السلام والأمن بدلاً منها.</p>",

        "content": "<h3>الإقناع والحضارة</h3>\n<h4>مغامرة الأفكار وتهذيب العادات (ألفرد نورث وايتهيد):</h4>\n<ul>\n<li>حاول في كتابه (مغامرة الأفكار) أن يرسم التطور التدريجي لعوامل الإقناع في حياة البشر الاجتماعية.</li>\n<li>فالحضارة هي الحفاظ على النظام الاجتماعي بواسطة الإقناع الفطري الذي يتجسد بالاختيار الأفضل.</li>\n<li>أما استخدام القوة مهما يكن ذلك حتمياً فإنه يكشف عن إخفاق الحضارة سواء كان ذلك بالنسبة للمجتمع العام أم بالنسبة للأفراد.</li>\n<li>إن القدرة على إدراك جوانب النقص في النظام الاجتماعي وبعث قلق، والقلق دافع يسوق إلى حب الاستطلاع وإلى المغامرة (مغامرة الفكر) التي تحفز على طلب أنماط جديدة من الحضارة وقيم جديدة لتحقيق احترام الإنسان للإنسان وبهذه المغامرات الفكرية وحدها تكون الحضارة نامية ومتطورة.</li>\n<li>فالمغامرة هي البحث عن كمال جديد وهي المبادرة الخلاقة التي يجب أن تبرز في كل مجالات النشاط الإنساني وإلا زالت الحضارة واندثرت.</li>\n<li>إن الصلة بين الأفراد والجماعات تأخذ شكلين شكل القوة وشكل الإقناع وعنده تعد التجارة هي المثل العظيم على الإقناع أما الحرب والعبودية والقسر الحكومي فإنها تمثل القوة.</li>\n<li>إن الانتقال الحضاري من القوة إلى الإقناع يشترط احترام الإنسان للإنسان وهذا الاحترام احترام للأعمال والأفكار. فالحضارة لا يمكن أن تقوم على القوة الغاشمة وإنما تعتمد على الإقناع وتسعى لتحقيق المثل العليا.</li>\n</ul>\n<h4>(غاستون ريشار):</h4>\n<ul>\n<li>إن بناء وتطور الحضارة يتم وفق الانتقال من القوة إلى الإقناع ومن القوة والوحشية والعنف إلى التهذيب والإرهاف واللطف وهذا يجب أن يشمل أخلاق الأسرة والمجتمع معا.</li>\n<li>يضرب ريشار أمثلة عن ذلك سواء أكان في مضمار المجتمع المنزلي ولا سيما في مجال كرامه المرأة أم في الرق وتلاشيه أو تطور أحوال السلوك والفضائل المختلفة كذلك آداب المجاملة وقواعد التصرف المهذب. فالتهذيب بوجه عام هو الذي يتيح للبشر التعامل على المستوى الإنساني وهو الذي يجعل المناقشة والحوار ممكنين.</li>\n<li>إن العنف نقيض التهذيب والعنف يضيف عائقاً أمام تقوية التعاون الإنساني ومع أن للعنف أنصار حتى اليوم إلا أن الجهود في المجتمع لا يمكن أن تتفاعل إلا في جو من الإصغاء والمناقشة والحوار واحترام البعض للبعض الآخر حتى لو كان هذا الاحترام بالشكل فقط هذا هو التهذيب أو آداب المجاملة.</li>\n<li>للتهذيب صفة مشتركة مع أصول الاحتفال والمراسم وهي صفة الاهتمام والشكليات.</li>\n</ul>\n<h4>(هربرت سبنسر):</h4>\n<ul>\n<li>أكد سبنسر أن أصل المراسم الاجتماعية (المناسبات والاحتفالات) هو فعل الاستسلام للغالب فالناس تجلون الأقوياء ويركعون لهم ثم أخذوا بإجلال الأموات. فظهرت عبادة الأزواج التي تحولت إلى عبادة الآلهة وإلى مراسم الاحتفالات الدينية التي تكرر شعائر الإجلال تجاه ما هو أسمى وأعلى.</li>\n<li>اتسم مذهبه بالسمة الإحيائية مثل واجب مراعاة المراسم في فرنسا، كمراسم العزاء والجنازة والدفن والحداد تفرضها أصول المجاملة فالرأي العام شديد في أحكامه في مثل هذه المواقف وهو لا يرحم من يخالف الأصول.</li>\n<li>إن واجب التهذيب تجاه الأموات وأقاربهم أشد صرامة من واجب تهذيب خيال الأحياء في الظروف اليومية فما زال الموت وتصور الموت موضع الاحترام والجد.</li>\n<li>إن مراسم عبادة الأموات والأجداد تعتبر مثالاً على الخوف والاحترام ورمزاً نلجأ إليه لمداراة قوة قاهرة ذات بأس وسلطان، بما في ذلك قوة الرأي العام.</li>\n</ul>\n<h4>النمط الإنساني العام: جان رومين (Romein J.):</h4>\n<p>يبرز جان رومين أربعة أفكار رئيسية على أنها النزعة الإنسانية الجديدة:</p>\n<p><strong>1. فكرة الكرامة الإنسانية:</strong> جعل المفكرون هذه الفكرة عبر العصور نصب أعينهم وحاولوا توسيع معنى الكرامة الإنسانية على المستوى الشخصي وعلى بلدهم فجعلوه شاملاً شعوباً قاصرة مختلفة من الناحية الاجتماعية.</p>\n<p><strong>2. فكرة نسبية الحقيقة وذاتيتها:</strong> ذهب العقليون إلى أن النتيجة التي يتوصل إليها الإنسان في استدلالاته ومحاكمته هي الدليل على أن في وسعه أن يرفض كل ما لا يتفق معها ويؤكد (ليسنغ Lessing) إن فكرة السلطة قد انهارت وأن سلطة (العقل) ذاتها ليست سلطة مطلقة ولا موضوعية وإنما هي سلطة نسبية ذاتية فيقول: لا تحدد قيمة الإنسان بالحقيقة التي يملكها بل تحدد بالجد الصادق الذي يسعى إلى إدراكها. وإن التي يبلغ بها الإنسان كماله النامي لا تنمو بامتلاك الحقيقة بل (بطلبها) ويقول: لو أمسك الله بالحقيقة كلها بيده اليمنى، وأمسك بيده اليسرى بالبحث اللانهائي عنها، وقال لي اختر، لاخترت بجرأة اليد اليسرى وقلت: أعطني البحث اللانهائي لأن الحقيقة الصرف ليست لأحد سواك. وينجم عن القول بنسبية الحقيقة وذاتيتها مبدأ التسامح.</p>\n<p><strong>3. فكرة الكمال الجائز للإنسان:</strong> إن فكرة تكامل البشر انتشرت من القرن السادس عشر وانتشرت أكثر في القرن الثامن عشر وقد امتدت من المطلب الأخلاقي إلى الواقع الاجتماعي وصار الناس يؤمنون بإمكان تكامل الطبقية البشرية الفردية والاجتماعية على حد سواء.</p>\n<p><strong>4. فكرة التقدم:</strong> سادت في القرن الثامن عشر على يد (كوندرسيه) على الإنسان أن يملأ مصيره بيده وأن كرامته تحفزه على أداء رسالة جديدة هي رسالة الحضارة أو الكرامة الإنسانية رسالة المدنية الحقة وهي لا تتحقق إلا بالإيمان والنضال ضد العقائديات التي قد تعرقل حرية إبداعها وإنجازاتها.</p>\n<p>حذر (رومين) من الفوضى الذهبية أي قد لا تعترف الدولة بالنمو الإنساني الجديد لأن الماضي بعاداته وتقاليده يقف عائقاً وحائلاً دون ذلك. كما في بعض مناطق أفريقيا وآسيا وأمريكا الجنوبية والوسطى، لذلك لا بد من الواجب الإحاطة بتعقده والاستعداد لتجاوزه إذا كنا نريد تحقيق حضارة متقدمة هدفها تحقيق كرامة الإنسان في الوقت الحاضر.</p>",

        "content": "<h3>أخلاق وحضارة</h3>\n<h4>المحاضرة السابعة والثامنة: علاقات الشرف</h4>\n<p><strong>1. الشرف في المجالات الفردية:</strong> هو يعني الشرف في المجالات الفردية ما يتصل بسلوك المرء حيال نفسه جسداً و روحاً. فهناك سلوك شرف يتوخى تسقيف الجسد أو تسقيف الروح، أي التكامل الجسدي والتكامل المعنوي أو الأخلاقي، حيث ترتبط بالجسد خصال فيزيائية جسدية مثل الصحة والبنية السليمة والقوة و المهارة والجمال والرشاقة، أما الروح فترتبط بالإرادة و الوعي والتصميم. الشرف الفردي متصل بسعي المرء إلى تحسين ذاته وتكاملها بطريقة محاسبة النفس أي ما يسمى اليوم بالنقد الذاتي. وهذه المحاسبة يجب ان تكون صادقة ويجب الاحتراس من النرجسية ومن أوهام حب الذات. أخذاً بعين الاعتبار حكم الوجدان بالإضافة إلى مراقبة وتقدير الآخرين ورقابة الله تعالى.</p>\n<p><strong>2. الشرف في المجالات الاجتماعية:</strong> أي أن المرء عندما يحاسب نفسه يجب أن يعنى برأي الآخرين وبالحرص على تقديرهم ومراعاة ما يعرف بالسمة الطيبة فلا يمكن عزل الفرد عن المجتمع بل الجانب الاجتماعي لا يقل اهمية عن الجانب الفردي في التأثير بالأخلاق الفردية لهذا الفرد، ففي الأخلاق الإجتماعية يسود رأي الآخرين فينا ويوجه وجداننا، إلا في حالات قليلة يخرج الانسان عن الرأي الاجتماعي ولكن بشكل عام من شأن الآخرين أن يحكم على سلوكنا تجاههم وعلى قيامنا بواجباتنا الأسرية والمهنية أو الإنسانية ولهم أن يظهر رضاهم أو عدم رضاهم عنا فيما يتصل بهم.</p>\n<p><strong>3. الشرف في المجالات الاسرية:</strong> فالشرف الفردي يتحد بالشرف الأسري فالأسرة هي وسيلة تكامل متبادل كما انها وسيلة ارتقاء اجتماعي. فمثلاً إن التمجيد المثالي للجد يخلق لدى العاسقين (الأنتَ) المثالية التي تصبح في نظر الآخرين (المثل الأعلى للأنا) وكل واحد منهما يجهد ليكون جديراً بهذا الاعجاب ويصبح أهلاً بأن يكون المثل الأعلى لمن يحبه. وغير خافٍ مدى تأثير الاتفاق الزوجي والانسجام المعنوي بين الوالدين على الأطفال ما يوقع عليها مسؤولية كبرى، وهنالك أسر زائفة لا يربط الحب افرادها مع بعضهم ولكن يحترم كل من الزوجين مسؤولياته لأنه أختار الرباط المقدس (الزواج) برضاه. وتعتبر الخيانه مثلاً اختراماً لعهد الشرف الأسري سواء من قبل الزوج أو الزوجة وتشكل خطراً على استقرار الأسرة قد ينتهي بالانفصال أو الهجر أو         "title": "📗 الاغتراب مفهوماً وأبعاداً أخلاقية وفلسفية",
        "content": "<h3>أخلاق وحضارة</h3>\n<h4>المحاضرة التاسعة والعاشرة: الاغتراب</h4>\n<p><strong>*الاغتراب*</strong></p>\n<p>للإغتراب معاني كثيرة منها المعنى الحقوقي وهو (نقل ملكية شيء أو حق أو بيع شيء من الأشياء) والمعنى النفسي (جنون، اختلال) والمعنى الاجتماعي (انحلال الرابطة التي تشد الفرد إلى الآخرين) والمعنى الديني (انحلال ارتباط الفرد بأي إله).</p>\n<h4>الاغتراب لدى جان جاك روسو:</h4>\n<p>كان له دور إبراز المعنى الحديث لمفهوم الاغتراب حيث رأى أن تنازل المرء عن حريته الطبيعية هو فعل اغتراب قد يرضى به بقدر ما يستبدل به منافع الحرية المدنية. أي التنازل عن خير لقاء خير آخر.</p>\n<p>ـ كما تم تعريفه على أنه: انعدام السلطه والانخلاع والانفصام عن الذات والالمعيارية ولذلك اعتبر الاغتراب من أخطر الظواهر التي تواجه إنسان هذا العصر فقد بات يشكل مظهراً فيه من العناصر السلبية التخريبية.</p>\n<h4>الاغتراب لدى هيغل Hegel:</h4>\n<p>استعمل هيغل الاغتراب للدلالة على اختفاء الصفة الخارجية والموضوعية أي طريقة خلق الآخر (مثلاً عندما يبيع شخص بالتنازل عن عقاره تصبح ادارته ذاتية بالإضافة اليه، ولكنها تبدو في الوقت ذاته على أنها موضوعية \"أي يوجد في المعادلة هو نفسه + الآخر\")</p>\n<p>ورأى هيغل بأن الاغتراب يدل على غرابة الأمر، الاحتقار، انقسام الكائن على نفسه والبعد والانفصال وفقدان الذات في الكائن الآخر، وذلك لأن الكيان الاجتماعي يتجاوز خصوصية الأفراد والعالم الذي يعيش فيه الإنسان هو إلى حد كبير من ابتکار أو اختراع الإنسان نفسه وأن النظم السياسية والحضارية والاجتماعية تمثل الجوهر الإجتماعي الذي تمخض عنه هذا الدور الإنساني.</p>\n<p>ويستعمل هيغل مصطلح الاغتراب للدلالة المزدوجة على معنى التخلي أو التنازل من جهة ، وعلى معنى الانفصال عن النفس لعجز الفرد عن الاتحاد بالجوهر الاجتماعي من جهة أخرى.</p>\n<h4>الاغتراب عند كارل ماركس:</h4>\n<p>ينظر ماركس للاغتراب من زاوية الأشياء التي يتم انتاجها ، ويرى بأن العامل غريب أو مغترب عما صنع لأنه أصبح معزولاً عن امكاناته الخالقة وعن الأواصر الاجتماعية التي تهدد انسانيته من خلالها ، وانتقد ماركس الملكية الخاصة وما يواكبها من تقسيم العمل ومن النمو الحضاري الذي يزيد من اغتراب العامل ، وانخلاع الإنسان فكل ما يتصل بالملكية هو ضياع ينال من كون الكائن.</p>\n<p>ـ يقول ماركس في كتابه (الرأسمال): إن طريقة الإنتاج الرأسمالي تحدث من تلقاء ذاتها انفصال العامل عن شروط العمل ، وهي بذلك تكرر وتدين الشروط التي ترغم العامل على أن يبيع ذاته ليعيش ، كما تجعل الراسماليه في وضع شرائه حتى تغنى.</p>\n<h4>الاغتراب لدى فيورباخ Feurbach:</h4>\n<p>اهتم بإظهار أن المسيحية خاصة ، والدين بشكل عام قد حولا الإنسان عن نشاطه الحقيقي وجعاله يسقط أهدافه الشخصية على أسطورة الآمال المجردة. وهو يدعو إلى عودة الإنسان إلى ممارسة يومية عادية بمراعاة الآخرين والحياة الاجتماعية. فالإنسان في نظر فيورباخ كائن نوعي وجوهره الإعتراف بالإنسانية في ذاته ، ومن شأن الاغتراب الديني أن يكشف النقاب عن ذات الإنسان ويخفيها عن ناظريه في وقت واحد إذ ينقلها إلى مكان آخر إلى عالم الإلوهية. فالبشر تطفي ذاتها في إله تصنعه وتستسلم لهذا العرش الذي يضطهدها.</p>\n<h4>الاغتراب لدى موزيس هس Hess Moses:</h4>\n<p>وهو يطبق الصورة ذاتها على الحياة الاقتصادية قائلاً: إن الاغتراب هو (إضفاء الفعالية الإنسانية إلى خارجها وفي شيء يسترقها بالخضوع إليه ألا وهو المال. لأن المال في الحياة العملية في عالمنا المقلوب كالله في الحياة النظرية ، المال هو القيمة الإنسانية معبراً عنها بالأرقام إنه علاقة عبوديتنا)</p>\n<p>وفي قلب هذا الاغتراب يضطر الناس إلى أن يعارض بعضهم بعضاً. بل إن حالة هذا التمزق تتجلى بصفة ضرورة نسبية: ضرورة أي (حيلة عقلية) تتيح للأفراد الخروج عن عزلتهم والدخول إلى مجال العلاقات المبادلة.</p>\n<h4>الاغتراب لدى ايرك فروم Fromm:</h4>\n<p>يذهب إلى أن المجتمع الرأسمالي يجعل الفرد مغترباً بقدر ما يجعل من الصعب أن يحقق الفرد حاجاته الأساسية مثل حاجة الإبداع وإقامة علاقات اجتماعية مع الآخرين ، وحاجة الاستقرار ، وحاجة التميز ، وحاجة توجيه نفسه بنفسه.</p>\n<h4>الاغتراب لدى سيمان seeman:</h4>\n<p>حاول إضفاء الصفة الإجرائية على الاغتراب في محاولة لقياسه وتمييز أنواع و مقاديرها فوجد بأن له رأي الاغتراب خمسة أبعاد يمكن قياسها بعداً بعداً:</p>\n<ul>\n<li>شعور الذي يعيشه الفرد بعجز سلوكه عن احداث النتائج المبتغاة.</li>\n<li>الشعور الذي يعيشه الفرد بأنه لا يملك دليلاً يستطيع اعتماده في تثبيت سلوكه واعتقاده.</li>\n<li>السلوك الذي يعيشه الفرد بأنه مرغم على استعمال وسائل لا شرعية لتحقيق اغراضه.</li>\n<li>الشعور الذي يعيشه الفرد بأنه غريب عن أهداف المجتمع الثقافية.</li>\n<li>الشعور الذي يعيشه الفرد بأنه عاجز عن العثور عن أنشطة يستطيع أن يقدر بها قيمته الذاتية.</li>\n</ul>\n<h4>الاغتراب لدى فوير:</h4>\n<p>يقول فوير أن الإقتراب يظهر في جميع مناحي التجربة الإنسانية حيثما تصاب رغبة أساسية عاطفية بالحرمان ، ويكون الشخص مرغماً بسبب أوضاع إجتماعية على مخالفة طبيعته الخاصة ، فاالاغتراب هو الطنين العاطفي المواكب لكل سلوك يضطر المرء فيه لهدم ذاته.</p>\n<h4>الاغتراب بالمعنى العام:</h4>\n<p>لقد شاع مفهوم الاغتراب ليعبر عن ظاهرات يستطيع كل إنسان أن يلاحظها مثل: (تفتيت العمل ـ شعور الفرد بالعجز أمام تعقد النظم الاجتماعية ـ الاضطرابات النفسية والجسدية الناتجة عن الحياة الحديثة ـ صبر المضطهدين ـ شعور الإنسان بالعجز السياسي الذي قد يستولي على المواطن ـ ضجر العامل حيث يعمل بشكل روتيني. كذلك يستخدم مفهوم الاغتراب لوصف حال الأجير الذي يترتب عليه أن يبيع قوة عمله أو وصف بؤس شروط العمل .......) وغيرها من الأمور أو الظواهر التي تقع كلها تحت مفهوم الاغتراب.</p>\n<h4>الاغتراب أخلاقياً:</h4>\n<p>بعد أن وضحنا المعاني والدلالات المختلفة للاغتراب يجب أن نشير أن للاغتراب حكما دلالة أو جانباً أخلاقياً ، وفي هذا الجانب تحدث (دوركهايم) وهو من علماء الإجتماع المعاصرين وأبرز أفكاره في هذا المجال ما يلي:</p>\n<p><strong>1. الانتحار الأناني:</strong> وهو ينجم عن انعدام تكامل الفرد من حيث هو فرد مع المجتمع بحيث يجد المرء نفسه عاجزاً عن الاستجابة أو الخضوع لأية سلطة غير السلطة التي يصدرها هو بنفسه ، فيؤدي به الأمر إلى الانعزال عن المجتمع وفقده تأييد الجماعة له وتعذر الحياة وسط تلك الجماعة فيندفع للانتحار.</p>\n<p><strong>2. الانتحار الايثاري:</strong> الناجم عن ازدياد سطوة المجتمع المتمثلة في قوة العادات والتقاليد والأعراف وخضوع الفرد لها على نحو تنمحي فيه شخصيته فلا يكاد يتمتع بكيان مستقل متمايز و منفصل عن الجماعة التي ينتمي إليها و التي يستمد منها مقوماته. وهنا تتضاءل أهمية المرء بالنسبة لنفسه وغيره ، وربما أدى به إلى الانتحار تحت وطأة هذا الضغط.</p>\n<p><strong>3. الانتحار اللامعياري (الأنومي):</strong> هو نتيجة إخفاق الفرد في التكيف مع المجتمع ولا سيما حين يختل التكيف التقليدي بنتيجة ظروف جديدة طارئة فيصعب على المرء أحكام التكيف والملاءمة ولا يهيء المجتمع له ظروف التجاوب مع المعايير الجديدة ، فيغدوا للمجتمع في نظر الفرد مجتمعاً منحل المعايير ، او لا معيارياً ، يغدو مجتمعاً متهافتاً يتحبط فيه المرء فلا يجد للحياة معنى ، وقد ينتهي به الأمر إلى الانتحار.</p>\n<p>ـ فمن الوجهة الأخلاقية تبرز مشكلة الاغتراب في الاستغلال ، ولكن العلاج لا يكون في العزلة ولا في الجنون ولا في الانتحار ، ولكن يجب أن يثير الاغتراب في نفوس المصابين به على كسرتهم ارتكاسات أخرى وهي ارتكاسات ناشطة ايجابية هادفة تتمثل في التحرر وطلب العدل.</p>\n<h4>ريمون رويه:</h4>\n<p>يتفق مع دوركهايم بأن النمو الإجتماعي المتقدم يزيد من وعي الفرد باعتماده على المجتمع. وهذا الوعي يولد قوي ويبقي الفرد خاضع للمجتمع ، حيث يتم تربية الفرد ليكون مستعداً ذهنياً لقبول الأعباء والمجالات المحددة ، لأن الفرد في المجتمع المتمدن يولد ليواجه حقيقة تنتظره وهي أن يؤدي وظيفة في التركيب العضوي الاجتماعي. ولذلك فهو مطالب بأن يتعلم مسبقاً كيفية أداء أدواؤه. فتقسيم العمل في نظره لا يخفض من قيمة الفرد بحد ذاته في الظروف الاعتيادية عندما يحوله إلى آلة أو إدارة ما دام يسمح للفرد بأن يشعر من خلال أدائه لوظائفه بأن يخدم شيئاً ما ، هو ذلك على العكس إذ اتقود الفرد على الآفاق الواسعة والآراء الطموحة سيصعب عليه أن يقيد بعمل محدد دون أن يصير ذلك استيائه.</p>\n<p>يرى ريمون رويه بأن الاغتراب فكرة أدبية وفلسفية كثيراً ما تعلق بها المفكرون ، أما العمال فيجدون أن الاغتراب يتمثل في الاستغلال ، ففي حين أن الرأسمالي أو رب العمل لا ينتج سلعاً ناقصة إلا من أجل مصلحته ، ولكن العامل لا يعمل من أجل ذاته ولا يعمل من أجل الشيء النافع الذي يصنعه ، إنه يعمل لمصلحة الرأسمالي الذي يستغله وكأنه سلعة تشترط لوجود سلعة. والعامل مشدود من جهة أولى إلى اقتصاد الربح ، ومن جهة ثانية نجده مقيد بهذا الاقتصاد بوصفه شيئاً منتجاً ، والاغتراب عند العامل أساس مزدوج وهو لا يدخل دائرة المبادلة على أنه فاعل بل على أنه موضوع أو سلعة متبادلة.</p>\n<p>- وبما أن الاغتراب مفهوم كله دلالات اجتماعية واقتصادية وسياسية ونفسية يرى معظم المفكرين بأنه البد من إزالة النتائج السلبية له وذلك من خلال بذل الجهد للتحرر وتحقيق مطلب العدل على الصعيد الأخلاقي أو الأخلاقي الحقوقي وذلك ليس فقط من أجل رفض الظلم ومحو الاغتراب وإنما يستهدف تحقيق إنسانية الإنسان.</p>\n<p>نهاية المحاضرة</p>",

        "content": "<h3>أخلاق وحضارة</h3>\n<h4>المحاضرة الحادية عشر: تعريف الحضارة ـ عناصرها ـ عوامل قيامها</h4>\n<p><strong>* تعريف الحضارة:</strong></p>\n<p>الحضارة في اللغة هي الإقامة في الحضر ، وهي خلاف البادية ، وهي المدن والقرى والريف ، حيث تذكر الحضارة في اللغة ، فإنه يقصد بالحضر ما هو عكس البادية أي سكن المدن والقرى.</p>\n<p>أما الحضارة اصطلاحاً فيزاد منها التعبير عن طراز العيش الذي يسود مجتمعاً من المجتمعات ، أي هوية ذلك المجتمع ، فالمجتمع عبارة عن مجموعة منظمة من الأفراد ، والحضارة مجموعة منظمة من الاستجابات التي تعلمها الأفراد واصبحت ميزة المجتمع. أما صموئيل هنتنغتون فيرى بأن الحضارة هي أعلى تجمع ثقافي للناس وأوسع مستوى للهوية الثقافية للشعب وهي تحدد بالعناصر الموضوعية المشتركة مثل اللغة والتاريخ والعادات والمؤسسات كما تحدد بالعناصر الذاتية التي يقوم الشعب نفسه بها.</p>\n<p><strong>* عناصر الحضارة:</strong></p>\n<p>لما كانت الحضارة هي ثمرة التفاعل بين الإنسان والكون والحياة فعناصر الحضارة تتمثل في هذه الكليات الثلاث: الإنسان ، الحياة ، الكون.</p>\n<p><strong>1. الإنسان:</strong> يعتبر هذا المكون هو أهم عناصر الحضارة فهو العنصر المؤثر والفاعل فوظيفة الإنسان التي خلق من أجلها هي إعمار الأرض بالمعنى الشامل. وإقامة مجتمع إنساني سليم ، و إشادة حضارة إنسانية شاملة ويمكن تصنيف التقدم الذي يحققه الإنسان إلى ثلاثة أصناف:</p>\n<p><strong>الصنف الأول:</strong> ما يخدم الجسد ويمنعه من وسائل العيش وأسباب الرفاهية والتعميم ، وأنواع التقدم العمراني والزراعي والصناعي والصحي والأدبي والفني والتقدم في الإنتاج الحيواني.</p>\n<p><strong>الصنف الثاني:</strong> ما يخدم المجتمع الإنساني ويكون من الوسائل التي تمنحه سعادة التعاون والإخاء والأمن والطمأنينة والرخاء ويشمل ذلك تقدم النظم الاجتماعية كافة كالنظم الادارية والحقوقية و المالية والأحوال الشخصية والأخلاق والعادات والتقاليد الفاضلة.</p>\n<p><strong>الصنف الثالث:</strong> ما يأخذ بيد الإنسان فرداً كان أو جماعة إلى السعادة الخالدة والوجود الأبدي الذي ينتقل من حياة جسدية عادية يكون فيها الابتلاء إلى حياة نفسية روحية ويدخل في هذا الصنف أنواع التقدم الفكري والقائم على التأملات التي تحمل اسم المعتقدات والواجبات الدينية.</p>\n<p><strong>2. الحياة:</strong> بالإضافة إلى الإنسان ، فالحياة التي نعيشها تعتبر عنصراً أساسياً من عناصر الحضارة. فمن الضروري أن تكون الحضارة التي يضعها الإنسان حضارة متطورة تستطيع أن تسع كل تطورات الحياة الإنسانية ، وتحقق ما يخدم المجتمع الإنساني ، بحيث تواجه ما يجد من حياة البشر من تطورات في شتى المجالات ولا تقف جامدة أمام متغيرات الحياة البشرية في واقعها الفردي والإجتماعي.</p>\n<p><strong>3. الكون:</strong> وهو من عناصر الحضارة فنحن نعيش في الكون ونشاهد كل ما فيه من خلق. ولا سيما أن كل ما نراه في الكون ومظاهره مسخر لخدمتنا وتدبير أسباب عيشنا وتحقيق شروط رفاهيتنا.</p>\n<p>لكن بالمقابل على الإنسان أن يمارس دنياه وأسباب عيشه وتقدمه وبناء حضارته بدافع وظيفي وبروح استشعار المسؤولية لا بدافع التعلق النفسي. أي أن يدرج حقيقة وهي أن وجوده في هذه الدنيا غير أبدي وإنما هنالك إنتقال لوجود آخر في الحياة الآخرة.</p>\n<p><strong>* أهم عوامل قيام الحضارات:</strong></p>\n<p><strong>1. الطعام والاقتصاد:</strong> فلا بد من تأمين مصدر موثوق ومستقر من الطعام مثل الإعتماد على الزراعة أو تربية الحيوانات ، .....</p>\n<p><strong>2. العمارة والتقدم التقني:</strong> أي البناء الإجتماعي والمادي المحسوس الذي يدعم نمو السكان.</p>\n<p><strong>3. السياسة و ضبط المجتمع:</strong> وجود حكومة مركزية وظهور طبقات إجتماعية كلها ميزات لمجتمع متطور وحضاري.</p>\n<p><strong>4. العوامل الجغرافية:</strong> مثل تضاريس الأرض وتوفير الحماية الطبيعية والمصادر المائية والمناخ المناسب كلها عوامل جذب للحضارات أي عندما تتوافر يسهل على الإنسان الإستقرار والتطوير للوصول إلى مستوى متقدم وحضاري.</p>\n<p><strong>5. العوامل الاقتصادية:</strong> لقيام الحضارة أولها (الزراعة) والتي تساعد على استيطان البشر وتطويرهم للبنى التحتية في مجتمعاتهم. وثانيها (التجارة) لطالما اعتمد سكان الحضارات على التجاره التي توفر السلع والموارد التي يحتاجها ولا يستطيعون انتاجها فالتجارة حلقة وصل بين الحضارات المختلفة ، ثالثها (الموارد الطبيعية) فهي المواد الخام لإنتاج السلع ومن هذه الموارد النفط ، الفحم ، المعادن ، التربة ، الماء ، الرمل وضوء الشمس.</p>\n<p><strong>6. العوامل الاجتماعية:</strong> ومنها (التقسيم الطبقي) فهو ينظم دور كل فرد في المجتمع ويحدد وظيفته ، (الاستقرار الاجتماعي) ويكون بوجود منظومة أمنية تحافظ على استقرار الأنظمة والقوانين ، (الحكومة المنظمة) فهي تحافظ على أمن المجتمعات داخلياً وخارجياً وحماية المواطنين وإدارة المدن والتجارة.</p>\n<p><strong>7. العوامل الدينية:</strong> منها (الوحدة الدينية) فالدين يؤسس أرضية مشتركة بين الأفراد الذين يتشاركون نفس المعتقدات ويوحد المجتمع. (النفوذ الديني) فقد ارتبطت السياسة بالدين وساعدت تنظيم السياسي والديني على نشأة تسلسلات السلطة في المجتمعات. وشكل القادة الدينيون مصدر تأييد للقادة السياسيين ودعموا سلطتهم في الحضارات.</p>\n<p><strong>8. العوامل الفكرية:</strong> منها (العمارة) فقد عبرت الحضارات القديمة عن معتقداتها وتطورها عن طريق العمارة والبناء وما يزال بعضها موجود حتى الان ، (الفن) فاستخدمت الفن لتوثيق ثقافة وقيم الحضارات وتسجيل الأحداث المهمة والإنجازات البشرية لأن الناس عموماً لم يكونوا يجيدوا القراءة والكتابة فاعتمدوا بشكل أساسي على الفن كالرسم والنحت ، ..... ، (الكتابة) استخدمها سكان الحضارات لتوثيق السجلات الخاصة بالأعمال التجارية والضرائب ، بالاضافه إلى المعرفة والأدب وأشكالهما.</p>\n<p>نهاية المحاضرة</p>",

        // ================================================================
        // حالة اللعبة
        // ================================================================

        let gameState = {
            unlockedKeys: lecturesData.map(() => Array(10).fill(false)),
            completedLectures: lecturesData.map(() => false),
            currentLecture: 0,
        };

        let isFullscreen = false;

        // ================================================================
        // دوال مساعدة
        // ================================================================

        function isLectureUnlocked(lectureId) {
            if (lectureId === 0) return true;
            return gameState.completedLectures[lectureId - 1] === true;
        }

        function isLectureCompleted(lectureId) {
            return gameState.completedLectures[lectureId] === true;
        }

        function getKeysCount(lectureId) {
            return gameState.unlockedKeys[lectureId].filter(v => v === true).length;
        }

        function isLectureFullyCompleted(lectureId) {
            return getKeysCount(lectureId) === 10;
        }

        function updateCompletionStatus(lectureId) {
            if (isLectureFullyCompleted(lectureId)) {
                gameState.completedLectures[lectureId] = true;
                saveProgress();
            }
        }

        // ================================================================
        // حفظ وتحميل التقدم
        // ================================================================

        function saveProgress() {
            try {
                localStorage.setItem('EthicsCivilization1', JSON.stringify(gameState));
            } catch (e) { }
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('EthicsCivilization1');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.unlockedKeys && parsed.unlockedKeys.length === lecturesData.length) {
                        gameState = parsed;
                        return true;
                    }
                }
            } catch (e) { }
            return false;
        }

        // ================================================================
        // رسم الخريطة
        // ================================================================

        function renderMap() {
            const mapGrid = document.getElementById('mapGrid');
            mapGrid.innerHTML = '';

            lecturesData.forEach((lecture, index) => {
                const unlocked = isLectureUnlocked(index);
                const completed = isLectureCompleted(index);
                const keysCount = getKeysCount(index);
                const isCurrent = (index === gameState.currentLecture);

                const node = document.createElement('div');
                node.className = 'map-node';

                if (!unlocked) {
                    node.classList.add('locked');
                } else if (completed) {
                    node.classList.add('completed');
                } else if (isCurrent) {
                    node.classList.add('current');
                } else {
                    node.classList.add('available');
                }

                const circle = document.createElement('div');
                circle.className = 'node-circle';

                const icon = completed ? '✓' : (unlocked ? '📖' : '🔒');
                circle.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="number">${index + 1}</span>
                    ${!unlocked ? '<span class="lock-icon">🔒</span>' : ''}
                `;

                const label = document.createElement('div');
                label.className = 'node-label';
                const titleParts = lecture.title.split(':');
                label.textContent = titleParts.length > 1 ? titleParts[0].trim() : `محاضرة ${index + 1}`;

                const keysInfo = document.createElement('div');
                keysInfo.className = 'node-keys';
                keysInfo.innerHTML = `🔑 <span class="gold">${keysCount}</span>/10`;

                node.appendChild(circle);
                node.appendChild(label);
                node.appendChild(keysInfo);

                if (unlocked) {
                    node.addEventListener('click', () => {
                        openLectureModal(index);
                    });
                }

                mapGrid.appendChild(node);

                if (index < lecturesData.length - 1) {
                    const arrowWrapper = document.createElement('div');
                    arrowWrapper.style.cssText = 'display:flex;align-items:center;flex-shrink:0;';
                    const arrow = document.createElement('div');
                    arrow.className = 'map-arrow';
                    const nextUnlocked = isLectureUnlocked(index + 1);
                    const currentCompleted = isLectureCompleted(index);

                    

                    arrowWrapper.appendChild(arrow);
                    mapGrid.appendChild(arrowWrapper);
                }
            });

            updateGlobalProgress();
        }

        // ================================================================
        // تحديث التقدم الكلي
        // ================================================================

        function updateGlobalProgress() {
            const totalKeys = lecturesData.length * 10;
            let unlockedTotal = 0;
            gameState.unlockedKeys.forEach(arr => {
                unlockedTotal += arr.filter(v => v === true).length;
            });
            const percent = Math.round((unlockedTotal / totalKeys) * 100);
            document.getElementById('globalProgressFill').style.width = percent + '%';
            document.getElementById('globalProgressText').textContent = percent + '%';
        }

        // ================================================================
        // نافذة المحاضرة
        // ================================================================

        function openLectureModal(lectureId) {
            if (!isLectureUnlocked(lectureId)) return;

            gameState.currentLecture = lectureId;
            const lecture = lecturesData[lectureId];

            document.getElementById('modalTitle').textContent = lecture.title;
            document.getElementById('modalBody').innerHTML = lecture.content;

            renderModalKeys(lectureId);

            // إعادة تعيين حالة ملء الشاشة إذا كانت مفعلة
            if (isFullscreen) {
                toggleFullscreen();
            }

            document.getElementById('lectureModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function renderModalKeys(lectureId) {
            const grid = document.getElementById('modalKeysGrid');
            grid.innerHTML = '';
            const keys = gameState.unlockedKeys[lectureId];

            const count = keys.filter(v => v).length;
            document.getElementById('modalKeysCount').textContent = `${count} / 10`;

            for (let i = 0; i < 10; i++) {
                const key = document.createElement('div');
                key.className = 'key-item-modal';
                if (keys[i]) {
                    key.classList.add('unlocked');
                    key.textContent = '🔓';
                } else {
                    key.classList.add('locked-key');
                    key.textContent = `${i + 1}`;
                    key.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openQuestion(lectureId, i);
                    });
                }
                grid.appendChild(key);
            }
        }

        // ================================================================
        // وظيفة ملء الشاشة النقي 100%
        // ================================================================

        function toggleFullscreen() {
            const exitBtn = document.getElementById('exitFullscreenFloat');
            const fsText = document.getElementById('fsText');
            const fsIcon = document.querySelector('.fs-icon');
            const body = document.body;

            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                // إضافة كلاس ملء الشاشة للبدي - يخفي كل شيء
                body.classList.add('fullscreen-pure-mode');

                // إخفاء زر ملء الشاشة في الهيدر وإظهار الزر العائم
                document.getElementById('fullscreenBtn').style.display = 'none';
                exitBtn.classList.add('show');
                fsText.textContent = 'خروج من ملء الشاشة';
                fsIcon.textContent = '⛶';

                // محاولة استخدام Fullscreen API الحقيقي للمتصفح
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => { });
                    }
                } catch (e) { }

            } else {
                // إزالة كلاس ملء الشاشة
                body.classList.remove('fullscreen-pure-mode');

                document.getElementById('fullscreenBtn').style.display = 'flex';
                exitBtn.classList.remove('show');
                fsText.textContent = 'ملء الشاشة';
                fsIcon.textContent = '⛶';

                try {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => { });
                    }
                } catch (e) { }

                // إعادة التمرير للخلفية
                if (!document.getElementById('lectureModal').classList.contains('active')) {
                    document.body.style.overflow = '';
                }
            }
        }

        // زر ملء الشاشة
        document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        // زر الخروج العائم
        document.getElementById('exitFullscreenFloat').addEventListener('click', () => {
            toggleFullscreen();
        });

        // مراقبة تغيير ملء الشاشة من المتصفح (ESC)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isFullscreen) {
                // المستخدم خرج من ملء الشاشة عبر Esc
                isFullscreen = false;
                document.body.classList.remove('fullscreen-pure-mode');
                document.getElementById('fullscreenBtn').style.display = 'flex';
                document.getElementById('exitFullscreenFloat').classList.remove('show');
                document.getElementById('fsText').textContent = 'ملء الشاشة';
                document.querySelector('.fs-icon').textContent = '⛶';
                if (!document.getElementById('lectureModal').classList.contains('active')) {
                    document.body.style.overflow = '';
                }
            }
        });

        // ================================================================
        // إغلاق نافذة المحاضرة
        // ================================================================

        document.getElementById('closeLectureModal').addEventListener('click', () => {
            if (isFullscreen) {
                toggleFullscreen();
            }
            document.getElementById('lectureModal').classList.remove('active');
            document.body.style.overflow = '';
            renderMap();
        });

        document.getElementById('lectureModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                if (isFullscreen) {
                    toggleFullscreen();
                }
                document.getElementById('lectureModal').classList.remove('active');
                document.body.style.overflow = '';
                renderMap();
            }
        });

        // ================================================================
        // نظام الأسئلة
        // ================================================================

        let currentQuestionLecture = null;
        let currentQuestionIndex = null;
        let questionAnswered = false;

        function openQuestion(lectureId, questionIndex) {
            if (gameState.unlockedKeys[lectureId][questionIndex]) return;

            const lecture = lecturesData[lectureId];
            const q = lecture.questions[questionIndex];
            if (!q) return;

            currentQuestionLecture = lectureId;
            currentQuestionIndex = questionIndex;
            questionAnswered = false;

            const modal = document.getElementById('questionModal');
            document.getElementById('qNumber').textContent = `🔑 المفتاح ${questionIndex + 1} من 10`;
            document.getElementById('qText').textContent = q.q;

            const optionsContainer = document.getElementById('qOptions');
            optionsContainer.innerHTML = '';

            const feedback = document.getElementById('qFeedback');
            feedback.className = 'q-feedback';
            feedback.textContent = '';

            const closeBtn = document.getElementById('closeQuestionBtn');
            closeBtn.className = 'close-modal-btn';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    if (questionAnswered) return;
                    handleQuestionAnswer(lectureId, questionIndex, idx, btn);
                });
                optionsContainer.appendChild(btn);
            });

            modal.classList.add('active');
        }

        function handleQuestionAnswer(lectureId, questionIndex, selectedIdx, clickedBtn) {
            if (questionAnswered) return;
            const q = lecturesData[lectureId].questions[questionIndex];
            const isCorrect = (selectedIdx === q.correct);

            const allBtns = document.querySelectorAll('#qOptions button');
            allBtns.forEach(btn => btn.disabled = true);

            allBtns.forEach((btn, idx) => {
                if (idx === q.correct) btn.classList.add('correct');
                if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
            });

            const feedback = document.getElementById('qFeedback');
            if (isCorrect) {
                feedback.className = 'q-feedback show success';
                feedback.textContent = '✅ إجابة صحيحة! تم فتح المفتاح 🎉';
                gameState.unlockedKeys[lectureId][questionIndex] = true;
                renderModalKeys(lectureId);
                updateCompletionStatus(lectureId);
                saveProgress();
            } else {
                feedback.className = 'q-feedback show error';
                feedback.textContent = '❌ إجابة خاطئة. حاول مرة أخرى!';
                setTimeout(() => {
                    allBtns.forEach(btn => {
                        btn.disabled = false;
                        btn.classList.remove('correct', 'wrong');
                    });
                    feedback.className = 'q-feedback';
                    feedback.textContent = '';
                    questionAnswered = false;
                }, 1500);
                return;
            }

            questionAnswered = true;
            document.getElementById('closeQuestionBtn').className = 'close-modal-btn show';
        }

        document.getElementById('closeQuestionBtn').addEventListener('click', () => {
            document.getElementById('questionModal').classList.remove('active');
        });

        document.getElementById('questionModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('questionModal').classList.remove('active');
            }
        });

        // ================================================================
        // تهيئة اللعبة
        // ================================================================

        function initGame() {
            const hasSaved = loadProgress();
            if (!hasSaved) {
                gameState.completedLectures = lecturesData.map(() => false);
                gameState.unlockedKeys = lecturesData.map(() => Array(10).fill(false));
                gameState.currentLecture = 0;
                saveProgress();
            }

            renderMap();
        }

        document.addEventListener('DOMContentLoaded', initGame);

        console.log('☀️ رحلة المعرفة العربية - ملء شاشة نقي 100%');
        console.log(`📚 ${lecturesData.length} محاضرة · 🔑 10 مفاتيح لكل محاضرة`);
        console.log('📖 اضغط على ⛶ ملء الشاشة للقراءة المركزة');
        console.log('🔄 اضغط ESC للخروج من ملء الشاشة');
    </script>

    <title>رحلة دراسة مجتمع عربي ومشكلاته • baash.dev</title>
    <style>
        /* ==============================================================
           التصميم النهاري الدافئ
           ============================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #fcf9f7 0%, #f0edea 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: all 0.4s ease;
        }

        /* ====== وضع ملء الشاشة النقي - إخفاء البدي بالكامل ====== */
        body.fullscreen-pure-mode {
            padding: 0 !important;
            margin: 0 !important;
            background: #fcf9f7 !important;
            overflow: hidden !important;
            /* إزالة السكرول من البدي */
        }

        /* إخفاء شريط التمرير في وضع ملء الشاشة */
        body.fullscreen-pure-mode::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body.fullscreen-pure-mode {
            -ms-overflow-style: none !important;
            /* IE و Edge */
            scrollbar-width: none !important;
            /* Firefox */
        }

        .app-container {
            background: rgba(255, 252, 250, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 30px;
            max-width: 1100px;
            width: 100%;
            border: 1px solid rgba(184, 115, 26, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        /* ====== إخفاء التطبيق بالكامل في وضع ملء الشاشة ====== */
        body.fullscreen-pure-mode .app-container {
            display: none !important;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background:
                radial-gradient(circle at 20% 30%, rgba(184, 115, 26, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(184, 115, 26, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.02) 0%, transparent 60%);
            animation: float-bg 20s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float-bg {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(20px, -20px) rotate(3deg);
            }
        }

        .app-container>* {
            position: relative;
            z-index: 1;
        }

        .app-header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(184, 115, 26, 0.10);
            margin-bottom: 25px;
        }

        .app-header h1 {
            font-size: 2.5rem;
            color: #2c2a2e;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .app-header h1 .highlight {
            background: linear-gradient(135deg, #b8731a, #d4a04a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .subtitle {
            color: #6b5f55;
            font-size: 0.95rem;
            margin-top: 5px;
            font-weight: 400;
        }

        .progress-bar-container {
            background: rgba(255, 252, 250, 0.6);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .progress-bar-container .label {
            color: #4a4038;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .progress-bar-container .label .emoji {
            font-size: 1.2rem;
        }

        .progress-track {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: rgba(184, 115, 26, 0.08);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        .progress-track .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b8731a, #d4a04a, #e8c77a);
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-track .fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .progress-text {
            color: #b8731a;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 60px;
            text-align: left;
        }

        .map-container {
            position: relative;
            padding: 30px 10px 40px 10px;
            min-height: 350px;
            background: rgba(255, 252, 250, 0.25);
            border-radius: 28px;
            border: 1px solid rgba(184, 115, 26, 0.04);
        }

        .map-grid {
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            gap: 8px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .map-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 80px;
            max-width: 130px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .map-node .node-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 252, 250, 0.5);
            border: 2.5px solid rgba(44, 42, 46, 0.08);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }

        .map-node .node-circle .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .map-node .node-circle .number {
            font-size: 0.6rem;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 600;
        }

        .map-node .node-circle .lock-icon {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 0.9rem;
            background: rgba(255, 252, 250, 0.85);
            border-radius: 50%;
            padding: 2px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .map-node.locked .node-circle {
            opacity: 0.5;
            filter: grayscale(0.6);
            cursor: not-allowed;
            border-color: rgba(44, 42, 46, 0.04);
        }

        .map-node.locked .node-label {
            color: #b0a89e;
        }

        .map-node.available .node-circle {
            border-color: #b8731a;
            background: rgba(184, 115, 26, 0.06);
            box-shadow: 0 4px 20px rgba(184, 115, 26, 0.08);
            cursor: pointer;
        }

        .map-node.available .node-circle:hover {
            transform: scale(1.1) translateY(-6px);
            box-shadow: 0 8px 35px rgba(184, 115, 26, 0.15);
            background: rgba(184, 115, 26, 0.10);
        }

        .map-node.completed .node-circle {
            border-color: #2d8f5c;
            background: rgba(45, 143, 92, 0.06);
            box-shadow: 0 4px 20px rgba(45, 143, 92, 0.06);
        }

        .map-node.completed .node-circle:hover {
            transform: scale(1.05);
        }

        .map-node.current .node-circle {
            border-color: #d4a04a;
            background: rgba(212, 160, 74, 0.08);
            box-shadow: 0 0 0 4px rgba(212, 160, 74, 0.08), 0 8px 30px rgba(212, 160, 74, 0.10);
            animation: pulse-node 1.8s ease-in-out infinite;
        }

        @keyframes pulse-node {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(212, 160, 74, 0.08), 0 8px 30px rgba(212, 160, 74, 0.10);
            }

            50% {
                transform: scale(1.06);
                box-shadow: 0 0 0 8px rgba(212, 160, 74, 0.02), 0 8px 40px rgba(212, 160, 74, 0.15);
            }
        }

        .map-node .node-label {
            color: #4a4038;
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
            line-height: 1.3;
        }

        .map-node .node-keys {
            font-size: 0.6rem;
            color: #8a7a6a;
            margin-top: 3px;
        }

        .map-node .node-keys .gold {
            color: #b8731a;
            font-weight: 700;
        }

        .map-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: rgba(44, 42, 46, 0.08);
            flex-shrink: 0;
            padding: 0 5px;
            min-width: 30px;
            transition: all 0.5s ease;
        }

        .map-arrow.active {
            color: #b8731a;
        }

        .map-arrow.completed {
            color: #2d8f5c;
        }

        /* ====== نافذة المحاضرة ====== */
        .lecture-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 46, 0.20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.4s ease;
        }

        .lecture-modal.active {
            display: flex;
        }

        .lecture-modal .modal-content {
            background: rgba(255, 252, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            animation: modal-slide 0.4s ease;
            transition: all 0.4s ease;
        }

        .modal-content::-webkit-scrollbar {
            display: none;
        }

        @keyframes modal-slide {
            from {
                transform: translateY(30px) scale(0.97);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .lecture-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header h2 {
            color: #2c2a2e;
            font-size: 1.3rem;
            font-weight: 700;
            flex: 1;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-header .header-actions button {
            background: rgba(44, 42, 46, 0.04);
            border: 1px solid rgba(44, 42, 46, 0.04);
            color: #6b5f55;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .lecture-modal .modal-header .header-actions button:hover {
            background: rgba(184, 115, 26, 0.06);
            border-color: rgba(184, 115, 26, 0.15);
            color: #b8731a;
        }

        .lecture-modal .modal-header .header-actions .close-btn:hover {
            background: rgba(192, 57, 43, 0.06);
            border-color: rgba(192, 57, 43, 0.15);
            color: #c0392b;
        }

        .lecture-modal .modal-body {
            color: #3a3538;
            line-height: 1.8;
            font-size: 0.95rem;
            max-height: 400px;
            overflow-y: auto;
            padding-left: 5px;
            transition: all 0.4s ease;
        }

        .lecture-modal .modal-body::-webkit-scrollbar {
            width: 5px;
        }

        .lecture-modal .modal-body::-webkit-scrollbar-thumb {
            background: #b8731a;
            border-radius: 10px;
        }

        .lecture-modal .modal-body::-webkit-scrollbar-track {
            background: rgba(184, 115, 26, 0.04);
            border-radius: 10px;
        }

        .lecture-modal .modal-body h3 {
            color: #b8731a;
            margin: 20px 0 10px 0;
            font-weight: 700;
        }

        .lecture-modal .modal-body h4 {
            color: #8a6a3a;
            margin: 15px 0 8px 0;
            font-weight: 600;
        }

        .lecture-modal .modal-body p {
            color: #3a3538;
        }

        .lecture-modal .modal-body ul {
            padding-right: 25px;
            margin: 8px 0;
        }

        .lecture-modal .modal-body ul li {
            margin: 4px 0;
            color: #3a3538;
        }

        /* ====== المفاتيح ====== */
        .keys-section-modal {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(184, 115, 26, 0.06);
            transition: all 0.4s ease;
        }

        .keys-section-modal .keys-title {
            color: #4a4038;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .keys-section-modal .keys-title .count {
            color: #b8731a;
            font-weight: 700;
        }

        .keys-grid-modal {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            max-width: 500px;
        }

        .key-item-modal {
            aspect-ratio: 1/1;
            border-radius: 12px;
            border: 2px solid rgba(44, 42, 46, 0.04);
            background: rgba(255, 252, 250, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: #8a7a6a;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .key-item-modal.unlocked {
            background: rgba(45, 143, 92, 0.06);
            border-color: #2d8f5c;
            color: #2d8f5c;
            cursor: default;
        }

        .key-item-modal.locked-key {
            cursor: pointer;
            color: #4a4038;
        }

        .key-item-modal.locked-key:hover {
            background: rgba(184, 115, 26, 0.06);
            border-color: #b8731a;
            transform: scale(1.05);
        }

        /* ================================================================
           وضع ملء الشاشة النقي 100% - إخفاء كل شيء
           ================================================================ */

        /* إخفاء نافذة المحاضرة بالكامل ونظهر فقط المحتوى */
        body.fullscreen-pure-mode .lecture-modal {
            background: #fcf9f7 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            padding: 0 !important;
            margin: 0 !important;
            z-index: 9999 !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-content {
            max-width: 100% !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            padding: 40px 60px !important;
            background: #fcf9f7 !important;
            animation: none !important;
            border: none !important;
            box-shadow: none !important;
            max-height: 100vh !important;
            overflow-y: auto !important;
            margin: 0 !important;
        }

        /* إخفاء الهيدر والمفاتيح */
        body.fullscreen-pure-mode .lecture-modal .modal-header {
            display: none !important;
        }

        body.fullscreen-pure-mode .lecture-modal .keys-section-modal {
            display: none !important;
        }

        /* تكبير المحتوى وتحسين القراءة */
        body.fullscreen-pure-mode .lecture-modal .modal-body {
            max-height: 100vh !important;
            font-size: 1.2rem !important;
            line-height: 2.2 !important;
            padding: 0 !important;
            overflow-y: auto !important;
        }

        /* إخفاء شريط التمرير في المحتوى أثناء ملء الشاشة */
        body.fullscreen-pure-mode .lecture-modal .modal-body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body h3 {
            font-size: 1.8rem !important;
            color: #b8731a !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body h4 {
            font-size: 1.4rem !important;
            color: #8a6a3a !important;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body p {
            font-size: 1.15rem !important;
            color: #2c2a2e !important;
            font-weight: 500;
        }

        body.fullscreen-pure-mode .lecture-modal .modal-body ul li {
            font-size: 1.15rem !important;
            color: #2c2a2e !important;
            margin: 6px 0 !important;
        }

        /* ====== زر الخروج من ملء الشاشة (عائم) ====== */
        .exit-fullscreen-float {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999 !important;
            background: rgba(44, 42, 46, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .exit-fullscreen-float:hover {
            background: rgba(184, 115, 26, 0.95);
            transform: translateX(-50%) scale(1.05);
        }

        .exit-fullscreen-float.show {
            
            
        }

        @keyframes float-up {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ====== نافذة السؤال ====== */
        .question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 46, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .question-modal.active {
            display: flex;
        }

        .question-box {
            background: rgba(255, 252, 250, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(184, 115, 26, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            animation: modal-slide 0.3s ease;
        }

        .question-box .q-number {
            color: #b8731a;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .question-box .q-text {
            color: #2c2a2e;
            font-size: 1.1rem;
            margin: 15px 0 20px 0;
            line-height: 1.6;
            font-weight: 500;
        }

        .question-box .q-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .question-box .q-options button {
            background: rgba(255, 252, 250, 0.3);
            border: 1.5px solid rgba(44, 42, 46, 0.04);
            border-radius: 12px;
            padding: 12px 18px;
            color: #2c2a2e;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
            font-weight: 500;
        }

        .question-box .q-options button:hover:not(:disabled) {
            background: rgba(184, 115, 26, 0.06);
            border-color: #b8731a;
        }

        .question-box .q-options button.correct {
            background: rgba(45, 143, 92, 0.08);
            border-color: #2d8f5c;
            color: #2d8f5c;
        }

        .question-box .q-options button.wrong {
            background: rgba(192, 57, 43, 0.08);
            border-color: #c0392b;
            color: #c0392b;
        }

        .question-box .q-options button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

                    "content": "<h3>تمهيد</h3><p>يُعرّف المجتمع بأنه تآلف معقد يضم عناصر أساسية مثل الوطن، البيئة، السكان، التنظيم الاجتماعي، والمؤسسات. هذه العناصر تتفاعل فيما بينها ومع المجتمعات الأخرى عبر التاريخ. يُوصف المجتمع العربي بأنه مجتمع شديد التنوع والاختلاف والتناقض.</p><h3>أولاً: سمات المجتمع العربي</h3><p>يتصف المجتمع العربي بعدة صفات أبرزها:</p><h4>1. المجتمع العربي مجتمع متكامل (أمة)</h4><ul><li>يُنظر إلى المجتمع العربي ككل متكامل وليس كمجرد كيانات مستقلة، فهو يشكل \"مجتمع-أمة\".</li><li>ينقص هذا التكامل وجود نظام سياسي موحد وشامل.</li><li>يستخدم علم الاجتماع مصطلح \"مجتمع\" بمعنى نسبي مرن، فيمكن الحديث عن المجتمع المصري أو العراقي، وفي الوقت نفسه عن المجتمع العربي الأشمل الذي يضمها جميعاً.</li></ul><h4>2. المجتمع العربي مجتمع متنوع في تكامله</h4><ul><li>يتميز المجتمع العربي بتنوع هائل حسب البيئة، الإقليم، التنظيم الاجتماعي، الوضع الاقتصادي، أسلوب المعيشة، الانتماء الطبقي والطائفي والإثني، ومستوى التخلف والمعيشة.</li><li>مفهوم الوحدة: الوحدة لا تقوم بالضرورة على التشابه، بل على التنوع المتكامل.</li><li>تحليل التنوع العربي: يتم التحليل بالاعتماد على بعدين:<ul><li>البعد الأول: درجة التنوع والانسجام: يمكن تصنيف المجتمعات الإنسانية على متدرج بين قطبين:<ul><li>المجتمع المتجانس: مثل مصر، تونس، ليبيا.</li><li>المجتمع الفسيفسائي: مثل لبنان.</li><li>المجتمع التعددي: يتوسط القطبين، مثل المغرب، الجزائر، سورية، العراق، البحرين.</li></ul></li><li>البعد الثاني: درجة انصهار الجماعات: تصنف العلاقات بين الجماعات وفق سياقات مجتمعية هي: النزاع، التعايش، والانصهار.</li></ul></li><li>الربط بين البعدين:<ul><li>المجتمع المتجانس: تسود فيه عملية الانصهار. يتكون من جماعة واحدة منصهرة اجتماعياً وثقافياً، تتوحد فيه الهوية الخاصة والعامة، ويسهل الوصول إلى إجماع حول القضايا الأساسية، وينشأ فيه نظام سياسي مركزي. لا يوجد تجانس كلي مطلق، بل هو نمط مثالي تقترب منه المجتمعات.</li><li>المجتمع الفسيفسائي: يتألف من عدة جماعات تغلب هوياتها الخاصة على الهوية العامة. تتصف العلاقات بالتراوح بين التعايش والنزاع وعدم القدرة على الاتفاق حول الأسس. يترسخ الانقسام بسبب فروقات في الحقوق السياسية والاقتصادية والمدنية والمكانة الاجتماعية. لبنان أقرب مثال، حيث النظام السياسي الطائفي يعزز الواقع الطائفي والتمايز، ويتميز بعدم الاتفاق على الأسس (كالهُوية اللبنانية)، وعدم فصل الدين عن الدولة، والتفاوت الطبقي الحاد.</li><li>المجتمع التعددي: يتكون من عدة جماعات تحتفظ بهوياتها الخاصة، لكنها تمكنت من إيجاد صيغة تآلف بين الهوية الخاصة والعامة، وإقامة دولة مركزية، والتفاهم حول بعض الأسس، واعتماد نظام تربوي موحد. تتمثل في سوريا، العراق، الجزائر، والمغرب. قد تعاني من أزمات بسبب تدخلات خارجية أو تسلط الأكثرية أو بعض الأقليات.</li></ul></li><li>خلاصة التصنيف: مصر، تونس، وليبيا أقرب للتجانس. سوريا، الجزائر، العراق، واليمن أقرب للتعددية. لبنان أقرب للفسيفسائية. وبذلك فالمجتمع العربي متنوع، وهو أقرب إلى النمط الفسيفسائي منه إلى التعددي.</li></ul><h4>3. المجتمع العربي مجتمع انتقالي</h4><p>يشهد صراعاً متأزماً بين قوى متعددة متناقضة:</p><ul><li>السلفية والحداثة.</li><li>قوى التجزئة وقوى الوحدة.</li><li>الطبقات الحاكمة والمحكومة.</li><li>الوطنية والتبعية.</li><li>التقدمية والرجعية.</li></ul><p>يعيش المجتمع العربي منذ قرن ونصف على الأقل \"ولادة عسيرة\" وحقبة نهوض بعد نوم عميق لعدة قرون مظلمة.</p><h4>4. المجتمع العربي مجتمع متخلف (جزء من العالم الثالث)</h4><p>يكافح للتحرر من الاستعمار بأشكاله وتنمية موارده. من أهم ظواهر التخلف:</p><ul><li>ظاهرة التبعية: عدم سيطرة المجتمع على موارده ومصيره، ووجود فجوة حضارية تفصله عن المجتمعات المتقدمة التي مارست ضده جميع أنواع الاستغلال والقهر.</li><li>ظاهرة الفقر: وجود فجوة عميقة بين الطبقات الميسورة والطبقات المحرومة، في ظل بنية طبقية هرمية. يعاني الشعب من تبعية مزدوجة (خارجية من الاستعمار، وداخلية من الطبقات الحاكمة المدعومة منه).</li><li>ظاهرة سلطوية الأنظمة: الأنظمة والبنى السائدة لا تشرك الشعب في صنع مصيره، وتعتدي على حقوقه، وتحوله إلى كائن عاجز يعيش على هامش الوجود، محتلةً الأشياء والسلع والاهتمامات السطحية روحه وفكره.</li></ul><h4>5. المجتمع العربي يعاني من حالة اغتراب عن ذاته</h4><p>كشفت الانهزامات المتتالية (حرب 1967، حصار بيروت 1982) وعجز المجتمع عن مجابهة التحديات، وفشل الحركات القومية والاشتراكية، عن اغتراب المجتمع العربي عن ذاته، وتجلى ذلك في:</p><ul><li>عدم سيطرة المجتمع على موارده ومصيره: فالثروات تعمل لصالح فئات قليلة في الداخل ودول أجنبية، وتنفق العائدات على الاستهلاك لا الإنتاج.</li><li>تداعي المجتمع من الداخل: فقد المجتمع محوره وصميمه، ولم يعد يمتلك إرادة وهدف وخطة. فشلت الأنظمة في تحقيق الوحدة أو حتى مجرد التنسيق والتضامن.</li><li>سيطرة المؤسسات على المجتمع: بدلاً من أن يسيطر المجتمع عليها، تتحكم المؤسسات السياسية وتستغل المؤسسات العامة لصالح الطبقات الحاكمة، وتهيمن على المؤسسات الثقافية والتربوية.</li></ul><p>المجتمع المغترب عن ذاته معرض للانهيار ما لم يستعد سيطرته على موارده ومؤسساته ويكوّن له محوراً وإرادة.</p><h4>6. المجتمع العربي تسوده العلاقات الاجتماعية الوثيقة (الشخصانية)</h4><ul><li>العلاقات الاجتماعية في غالبيتها (حتى في المدن) هي علاقات أولية، شخصانية، وثيقة، لا رسمية، تعاونية. يستمد منها الفرد الاكتفاء والدفء والاطمئنان، ويلتزم من خلالها التزاماً كلياً بالأقرباء والمقربين.</li><li>تتعارض هذه العلاقات مع العلاقات الثانوية السائدة في المجتمعات الصناعية، وهي علاقات لا شخصانية، رسمية، تعاقدية، تنافسية، يستمد الفرد اكتفاءه من إنجازاته ومكانته لا من علاقاته.</li><li>فروق نوعية العلاقات بين المجتمعات العربية والغربية:<ul><li>العرب يشكون من شدة الاندماج العائلي، بينما الغربيون يشكون من فقدان الحياة العائلية.</li><li>العرب يشكون من ضرورات الالتزام بالآخرين وغياب الحياة الخاصة والخوف من \"كلام الناس\"، بينما الغربيون يشكون من الوحدة والفردية.</li><li>تحتل الجماعات الوسيطة (القبيلة، الطائفة، القرية، الحي) مركزاً مرموقاً في حياة العرب، بينما في المجتمعات الغربية تقيم الدولة علاقات مباشرة مع الأفراد وتتوسط التنظيمات الحديثة (النقابات، الأحزاب). من هنا يأتي نظام \"الواسطة\".</li></ul></li></ul><h4>7. المجتمع العربي مجتمع تعبيري</h4><ul><li>يعبر الأفراد والجماعات عن مشاعرهم (حب، بغض، رضى، غضب) بشكل عفوي دون تدقيق منهجي في النتائج.</li><li>في المقابل، يسود ميل نحو النزعة المحاسبية في المجتمعات الصناعية الرأسمالية.</li><li>العرب يعبرون عن مشاعرهم وأفكارهم دون تحفظ (باستثناء السياسية)، بينما الغربيون يتحفظون ولا يعبرون إلا عما يخدم غايات محددة.</li><li>العرب ينزعون نحو العاطفة أكثر من العقلانية في التعامل مع الأحداث، وهذه النزعة تضعف بانتشار العلم والتصنيع.</li></ul>",

                    "content": "<h3>أولاً: الإعلام في المجتمع العربي المعاصر</h3><p>يتسم الإعلام العربي بعدة صفات:</p><h4>1. تضاؤل المادة الإعلامية الجادة</h4><ul><li>تهيمن المادة الترفيهية المستوردة التي تتسم بالعقم الثقافي، ولا تعبر عن ثقافة البلد المصدر أو المستورد، ويغلب عليها الابتذال والسطحية والنمطية وغياب الإبداع.</li><li>هذا يبقي الإنسان العربي بعيداً عن واقعه الحقيقي ويتجاهل وعيه بمعاناته الوجودية.</li><li>يتم ذلك عبر تكريس نزعة استهلاكية لا تتلاءم مع إمكانات الغالبية العظمى، مما يدفع للسعي اللاهث وراء الإشباع الآني، ويؤدي إلى تراجع الإقبال على الجهد طويل النفس، وانعدام السيطرة على المستقبل، وتصاعد مشاعر الإحباط والحرمان.</li><li>حتى المادة الإعلامية الجادة تقدم العلم والفلسفة والفن بصورتها النهائية المستوردة، مما يجعل الإنسان العربي عاجزاً عن إدراك ماهيتها، ويكرس الشعور بالنقص تجاه الآخر الغربي، والإحساس بانعدام الجدوى من الإبداع.</li><li>كل هذا يشكل تحدياً مستمراً يضع الفرد في سلسلة من ردود الفعل، لدرجة يصبح فيها الفعل العربي الأصيل شبه معدوم.</li></ul><h4>2. الإعلام العربي كركيزة للقوة الناعمة</h4><ul><li>يعتبر الإعلام العربي أحد أهم ركائز \"القوة الناعمة\" التي تقوم على الاستفادة من الحوادث الرمزية الإنسانية للتحكم السياسي بدفة الأحداث.</li><li>استراتيجية القوة الناعمة تقوم على:<ul><li>القدرة على تشكيل تصورات الآخرين.</li><li>القدرة على تشكيل جدول الأعمال السياسي للأعداء والمنافسين.</li><li>جاذبية النموذج والقيم والسياسات ومصداقيتها.</li><li>القدرة على فرض الاستراتيجيات وأنماط الاتصال.</li><li>القدرة على سرد الوقائع.</li></ul></li><li>توظف القوة الناعمة أدوات ثورة المعلومات وتقنيات الاتصالات (كالرموز البصرية، الأفلام، المسلسلات، الإعلانات، الإنترنت) للتأثير.</li><li>مثال: المسلسلات التركية التي غزت الشاشات العربية هي مثال على استراتيجية القوة الناعمة لجذب العالمين العربي والإسلامي نحو قيم غربية، حيث تم اختيار النموذج التركي لما يتمتع به من واجهة ديمقراطية ممزوجة بحداثة غربية ونجاح اقتصادي ومسحة إسلامية.</li><li>يلعب الإعلام دوراً أساسياً وواسعاً يبدأ من توجيه وعي الأفراد اليومي وينتهي بتشكيل الرأي العام حول شرعية نظام سياسي من عدمه.</li><li>نظراً لهذا الدور البارز في خلق وعي فردي وجماعي مستلب، لا بد من البحث عن بديل قادر على تمكين الوعي وترك مسافة بينه وبين حالة الاستلاب.</li></ul><h3>ثانياً: الثقافة العربية</h3><p>تشتمل الثقافة عامة على ثلاث مكونات:</p><ul><li>القيم والرموز والأخلاق والمعتقدات والمفاهيم والأمثال والمعايير والتقاليد والعادات والوسائل والمهارات التي يستعملها الإنسان في تعامله مع بيئته.</li><li>الإبداعات التعبيرية الفنية من أدب وموسيقى ورسم ورقص وغيرها.</li><li>الفكر من علوم وفلسفة ومذاهب وعقائد ونظريات.</li></ul><p>تضم الثقافة العربية المعاصرة ثلاث ثقافات متصارعة:</p><ul><li>الثقافة السائدة: ثقافة النظام العام والمؤسسات والطبقات والعائلات الحاكمة، وهي الأكثر انتشاراً.</li><li>الثقافة المضادة: تتناقض مع الثقافة السائدة وتدخل في صراع حاد معها.</li><li>الثقافة الفرعية: ثقافة خاصة ضمن الثقافة العامة.</li></ul><h4>الاتجاهات القيمية السائدة</h4><p>القيم هي المقياس الموجه لسلوك الإنسان. ويمكن حصر أهم الاتجاهات القيمية في الثقافة العربية المعاصرة بالثنائيات التالية:</p><ul><li>القيم القدرية وقيم الإرادة الإنسانية الحرة.</li><li>القيم السلفية والقيم المستقبلية.</li><li>قيم الإبداع وقيم الإتباع.</li><li>قيم العقل وقيم القلب.</li><li>قيم الشكل وقيم المضمون.</li><li>القيم التي تولد شعوراً بالذنب والقيم التي تولد شعوراً بالعار.</li><li>قيم الانغلاق وقيم الانفتاح.</li><li>القيم الجمعية والقيم الفردية.</li><li>قيم الطاعة والتمرد.</li><li>قيم العدالة وقيم الإحسان والرحمة.</li></ul><p>رغم أن الثقافة السائدة ترتكز على القيم القدرية والسلفية والعمودية والإتباع والشكل والانغلاق والعار والإحسان، فإن كل شق من الثنائيات المذكورة ما زال يعيش صراعاً مع الشق الثاني. الأهم: ما تتسم به الثقافة العربية المعاصرة ليس أياً من تلك الاتجاهات بحد ذاتها، بل هو حالة الصراع ذاتها التي تشكل هوية العرب الثقافية.</p><h3>ثالثاً: الشخصية العربية</h3><p>يتم إنتاج الشخصية العربية عبر عملية التنشئة الاجتماعية التي تلعب فيها العائلة الدور الأهم. تتشكل السمات العامة للشخصية العربية من الآليات الدفاعية التي يتخذها الإنسان العربي للتكيف مع واقع مؤسسات المجتمع، كرد فعل للحفاظ على التوازن. أهم هذه الآليات:</p><h4>1. الانشطار الذاتي</h4><ul><li>يلجأ الإنسان العربي لتعويض ما يعانيه من هدر كياني إلى العيش في زمان ومكان آخرين وأحاسيس وتفاعلات أخرى، متخذاً قناعاً خارجياً اجتماعياً يتستر به على ذاته أمام الآخرين، حتى يصل إلى التستر على ذاته أمام ذاته.</li><li>يفقد التكامل الذاتي بين السلوك والحاجات والرغبات، مما يؤدي إلى التناقض بين القول والفعل، الفكر والممارسة.</li><li>ينشط لمصلحة صورة ذاته أكثر مما يعيش لمصلحة ذاته الداخلية الفعلية، وبدلاً من تحقيق ذاته يحقق صورته، فاقداً القدرة على ضبطها وتوجيهها.</li><li>يعيش وجوده في حالة من \"البيرانية\" (الاغتراب) عن الذات، مما يعيد إنتاج هدر مضاعف من الداخل.</li></ul><h4>2. الازدواجية</h4><ul><li>تظهر كمفارقة صارخة بين \"التحديث الاستهلاكي المظهري والتخلف الإنتاجي، بين التحديث الأداتي والتخلف الفكري، بين التحديث في المظهر والقبلية والعشائرية في الجوهر\".</li></ul><h4>3. الفردية</h4><ul><li>تظهر على شكل فوضى ذاتية موسومة بنقص في الروح الاجتماعية.</li><li>يهتم الفرد بقضايا المجتمع بأسلوبين: اهتمام \"مباشر\" مرتبط بالكلام، واهتمام \"فعلي\" مرتبط بالمصلحة المادية، بينما يبلغ الالتزام العملي اتجاه قضايا المجتمع حده الأدنى.</li><li>سبب ذلك هو شعوره بالعجز الكلي عن التأثير في مجريات الأحداث، فيقف عند حد المشاركة الكلامية اللافاعلة، مما يوسع هوة التناقض بين القول والفعل، بل ويصبح التلفظ بالأقوال هو الفعل ذاته.</li></ul><h4>4. اللامبالاة</h4><ul><li>حالة من الفتور والسلبية والاتكالية تجاه قضايا المجتمع، تتخذ قناعاً من الاستقلالية المزعومة.</li><li>يكرس هذا النمط الشخصية التبعية التي يسودها الشعور بالعجز والنزوع للتهرب والانسحاب من ميدان الفعل والمسؤولية.</li><li>تساهم في تكريسها سلسلة الإحباطات (الإحباط العاطفي، إحباط التعبير عن الذات، الإحباط الوجودي العام).</li></ul><h4>5. حب البروز</h4><ul><li>ينزع الإنسان العربي إلى إبراز الأنا والتأكيد على احترام الناس له، والتشديد على منزلته والدفاع عن سمعته وفرض نفسه على الآخرين وتحقيرهم.</li><li>مظهر الثقة هذا هو أمر ظاهري مكتسب اجتماعياً، ويتم بصورة عفوية أو على شكل نماذج مهيأة سلفاً.</li><li>لا يعبر عن شخصية فردية بقدر ما يعبر عن شخصية جماعية تتبلور تبعاً لمكانة أصحابها في النظام الاجتماعي.</li></ul><h4>6. التجاذب الوجداني</h4><ul><li>يبلغ أقصى حالاته في وضعية المرأة العربية، التي تعد أكثر العناصر تعرضاً للتبخيس في قيمتها (الجنس، الجسد، الفكر، الإنتاج، المكانة).</li><li>يقابل هذا التبخيس \"مثْلَنَة\" مفرطة من قبل الرجل والمجتمع الذي يرى فيها مركز الشرف الذاتي ورمز الصفاء (الأمومة).</li><li>تذبذب الموقف منها: فهي تابعة لا حرية لها ولا إرادة ولا كيان، ملكية اجتماعية، وعلى العكس منها صورة المرأة \"المرجِع\" التي يقف منها الزوج والأبناء موقفاً اتكالياً.</li></ul><h4>7. الاختزال</h4><ul><li>أحد أهم الآليات الدفاعية للتكيف مع الوضع الاجتماعي، ويظهر بوضوح في وضعية المرأة التي يتم اختزال كيانها إلى إحدى صفاتها أو وظائفها (الإثارة، الإنجاب، الخدمة).</li><li>يتم التوحيد بين هذا الجانب الجزئي وكيانها الكلي، فتسجن في صورة محددة لا يسمح لها بتعديها.</li><li>تفقد المرأة القدرة على استخدام طاقاتها الذهنية والعاطفية، مما يخلق لديها حالة من الارتداد إلى الداخل على شكل فوران انفعالي مفرط (كالدس والحقد والحسد والكيد)، فضلاً عن استفحال الخرافة والعاطفة الزائدة وسيطرة الانفعالات.</li></ul>",

                    "content": "<h3>مفهوم العولمة</h3><ul><li>مصطلح مستحدث في اللغة العربية، ويقصد به:<ul><li>جعل الشيء عالمياً بحيث يصبح العالم وكأنه منظومة واحدة متكاملة.</li><li>تعميم الشيء وتوسيع دائرته ليشمل العالم كله.</li><li>التشارك والتبادل والتفاعل بين المجتمعات مما يؤدي إلى انكماش العالم وتجاوز الحد الزماني والمكاني ليصبح مجتمعاً واحداً بلا حدود.</li></ul></li><li>تتضمن العولمة الجانب الاقتصادي والاجتماعي والثقافي والسياسي حيث يتصارع الناس للحفاظ على هوياتهم.</li><li>يعتبرها آخرون تعميماً لنموذج الحضارة الغربية بأنماطها الفكرية والسياسية والاقتصادية والثقافية على العالم كله، وإجبار الشعوب على الاندماج فيها وتبنيها.</li><li>تهدف إلى نزع الخصوصية الفردية والقضاء على الهوية الذاتية للمجتمعات من خلال فرض الثقافة الرأسمالية، وسلب سيطرة الدول على مجالاتها، ونشر ثقافة العولمة التي هي السلاح الآخر لامتصاص ثروات الشعوب.</li></ul><h3>العولمة الثقافية</h3><ul><li>تقوم على أن يفرض مجتمع ما أفكاره وثقافته على المجتمعات الأخرى، فينتقل اهتمام الفرد من ثقافته المحلية إلى الثقافة العالمية.</li><li>التصور بوجود خصائص ثقافية عالمية صالحة لكل المجتمعات هو تصور خاطئ، فالعولمة تسعى لفرض هيمنة الثقافة الغربية عبر استحواذها على وسائل الإعلام وقولبتها في قالب واحد.</li><li>يعد هذا \"اغتصاباً ثقافياً رمزياً\" و\"اختراقاً تقنياً\" يستخدم وسائل الاتصال والإعلام لهدر سيادة الثقافات الأخرى.</li><li>تعريف: هي قدرة الثقافات الأقوى تكنولوجياً على السيطرة على الثقافات الأضعف، ومحاولة مجتمع ما تعميم نموذجه الثقافي من خلال التأثير في المفاهيم الحضارية والقيمية والأنماط السلوكية.</li><li>هدفها: إقصاء الثقافات الأخرى عن العالمية بحجة تعارضها مع توجهات الثقافة الغربية المادية، وفي الوقت ذاته خنق الثقافة العربية الإسلامية لكونها (كما يدعون) الخطر الزاحف نحو الغرب.</li><li>حل مفهوم \"العولمة الثقافية\" محل مفهوم \"الغزو الفكري والتقاني\". وهي الأخطر لاهتمامها بإشاعة قيم ثقافة واحدة وإحلالها محل الثقافات الأخرى، مما يعني تلاشي القيم والثقافات القومية لصالح ثقافة البلد الأكثر تقدماً (أمريكا وأوروبا).</li><li>العولمة تصنع الثقافة، وهي وليدة تراكمات ثقافية تنتقل بطرق مختلفة، وتصدر منتجاتها الثقافية كما تصدر السلع.</li><li>الهدف الاستراتيجي من نشر العولمة الثقافية هو إلغاء كل مقاومة محتملة من المجتمعات المستغلة، بالتركيز على الأطراف المحورية فيها (المرأة، الأسرة، الشباب) لأنهم يحملون قوة التغيير الحقيقي، وذلك لزعزعة بنية المجتمعات وإضعاف قوتها بطمس الهوية الثقافية بأبعادها الزمنية والمكانية والحضارية.</li><li>تأثيرها على الشباب: تهدد أمنهم الثقافي، وتدعو لإيجاد ثقافة كونية أوروبية تفرض على الثقافات الأخرى، مما يؤدي إلى الانقسام والتفكك وإحداث شروخ في الأبنية الثقافية، وطمس معالم الهوية الثقافية.</li><li>التقدم الهائل في وسائل نقل المعلومات وتكنولوجيا الاتصالات كان له دور كبير في انتشار العولمة الثقافية والانسلاخ الثقافي، حيث يتبنى الشباب العربي الرؤى الغربية دون وعي بحجة الموضة ومواكبة العصر.</li><li>تحولت هذه الثقافة الاستهلاكية إلى آلة لتشويه البنى التقليدية وتغريب الإنسان وعزله عن قضاياه، لكونها تدعو لاعتناق قيم سلبية (الأنانية، المنفعة الشخصية، حب الذات، اللامبالاة)، مما أدى إلى اختلال النسق القيمي والتشكيك في القناعات الثقافية والوطنية والدينية.</li><li>المشكلة ليست في الانفتاح الثقافي، بل في طمس معالم الهوية الثقافية التي تعد كنزاً اجتماعياً يحتاج إلى الحماية.</li></ul><h3>العولمة الثقافية والهوية الثقافية</h3><ul><li>تعريف الهوية الثقافية: مجموعة نتاجات من عوامل دينية ولغوية وتاريخية وسياسية، يوجد بينها تفاعل مستمر. أسسها ومكوناتها هي العوامل التي تؤثر في تكوين الأمة وتحديد ملامحها وطابعها القومي.</li><li>قبل العولمة، كانت الهوية الثقافية هي التي تميز شعباً عن آخر وتحدد خصائصه، وهي الحصن المنيع ضد أي غزو أو أفكار دخيلة.</li><li>اليوم، فقدت العديد من البلدان العربية شيئاً من هويتها الثقافية بسبب العولمة وآثارها المتمثلة في سيطرة الإعلام على ثقافات الشعوب، وإفراغ الهوية من محتواها بالاستسلام للتبعية الحضارية، مما ينتج عنه فقدان الشعور بالانتماء للوطن والأمة.</li><li>ليس هنالك ثقافة عالمية واحدة، بل ثقافات. ولا تكتمل الهوية الثقافية إلا إذا كانت مرجعيتها جماعة الوطن والأمة والدولة. العولمة نظام يعمل على إفراغ الهوية الجماعية من كل محتوى، ويدفع إلى التفتيت، ليربط الناس بعالم \"اللاوطن واللاأمة\".</li></ul><h3>العولمة الثقافية واللغة</h3><ul><li>تعتبر اللغة الإنجليزية هي اللغة الأولى عالمياً من حيث الاتصال والتواصل، وهي المسيطرة على بقية اللغات، وتكمن سيطرتها في إضعاف اللغات الأخرى خاصة القوية منها مثل العربية.</li><li>هي اللغة الأكثر دراسة كلغة أجنبية، والجامعات تعطي أهمية لنشر المقالات العلمية بها، وكذلك المواقع الإلكترونية.</li><li>هي عامل جذب لطلبة الجامعات وعامل أساسي للدراسة في البلدان العربية، وشرط للالتحاق بوظائف مهمة.</li><li>أصبح التدريس والعمل باللغة الإنجليزية من أهم نتائج العولمة الثقافية.</li></ul><h3>العولمة الثقافية ووسائل الإعلام</h3><ul><li>وسائل الإعلام وسيلة ثقافية بالغة التأثير في نشر وترويج الثقافات الأخرى. أدى التطور العلمي الهائل إلى سرعة تدفق الثقافات إلى المجتمع العربي.</li><li>يؤدي ذلك إلى تأثر الفكر العربي بالفكر المعولم، مما يشكل هوة كبيرة بين الثقافة الحالية للمجتمعات العربية وثقافاتها السابقة.</li><li>دور الدول العربية يكمن في كونها مستقبلاً لتلك الثقافات بدون تبصر، وقد يكون دورها في أحسن الأحوال تطوير تلك الثقافات.</li><li>ترتكز العولمة الثقافية على انتشار المعلومات وتدفقها، معتمدة على وسائل الاتصالات والقنوات الفضائية والأقمار الصناعية وشبكات الإنترنت.</li><li>الإنترنت أهم وسائل العولمة الإعلامية، ويشكل مجتمعاً متكاملاً له عاداته وتقاليده ولغته الخاصة، ويعتبره البعض التعبير الأمثل عن ثقافة ما بعد الحداثة.</li></ul><h3>الآثار التربوية للعولمة الثقافية في المجتمع العربي</h3><ol><li>شيوع الثقافة الاستهلاكية.</li><li>تشويه التقاليد والأعراف السائدة.</li><li>تغريب الإنسان وعزله عن قضاياه والتشكيك في قناعاته وهويته.</li><li>إشاعة أدب الجنس وثقافة العنف، وبروز الثقافة الغربية كنموذج.</li><li>عولمة التربية.</li><li>محاربة اللغة العربية وتشجيع اللغات الأخرى (كالفرنسية والإنجليزية).</li><li>خلق ثقافة اتكالية.</li><li>إكساب الأجيال اتجاهات وأعرافاً تتسم بالعنف والإجرام والغطرسة والعدوان، مما يفسد الشخصية العربية وينمي فيها الغربة والتبعية والعداء لتراثها.</li><li>تعزيز الفردية والتحرر من القيود الاجتماعية والتمحور حول الذات.</li><li>إضعاف الانتماء والارتباط بالمجتمع.</li><li>غرس قيم دخيلة (حرية غير مضبوطة، إشباع الغرائز) تنعكس على سلوك الأجيال.</li><li>تفكيك روابط الأسرة (مثال الحرية الجنسية المطلقة) مما يؤدي للتفكك الأسري والعنف.</li><li>شيوع الفوضى الفكرية، ظهور القيم النفعية، تغريب الوعي، تخريب الشخصية، ضياع الانتماء.</li><li>اتساع الفجوة المعرفية بين المجتمعات المتقدمة والمجتمع العربي، وهشاشة المتلقي للإعلام الغربي وانبهاره به.</li></ol><h3>مواجهة العولمة من المنظور الثقافي والتراثي والقومي</h3><ul><li>إنشاء مراكز متعددة الجوانب والتخصصات للبحث العلمي لصناعة التكنولوجيا والعلم وفق الإمكانات الذاتية.</li><li>إنشاء مراكز متخصصة للتعريب والترجمة العلمية في جميع فروع العلوم.</li><li>تبني استراتيجيات تربوية وإعلامية لنشر الوعي الثقافي والتفكير العلمي لدى الشباب.</li></ul><h3>مواجهة العولمة من المنظور التربوي والديني</h3><ul><li>تغيير المناهج وتطويرها بما يتماشى وقضايا العصر، خاصة التي تتناقض مع قيم المجتمع.</li><li>ترسيخ عقيدة الإيمان بالله والحرية والسلام.</li><li>غرس الخصوصية الثقافية وتعميقها.</li><li>مراجعة نقدية شاملة لمناهج التربية والتعليم لتطويرها وتحديثها.</li><li>حشد الطاقات لتعزيز التبادل العلمي والتقني بين الدول العربية.</li><li>تشجيع البحث العلمي والتعاون بين العلماء والمفكرين العرب.</li></ul><h3>مواجهة العولمة الثقافية في ظل الانفتاح الحضاري</h3><ul><li>الابتعاد عن التفكير التقليدي والجهل والتعصب، والإقرار بالتنوع الحضاري.</li><li>تكوين قادة جامعيين ترتكز كفاياتهم على التعدد الثقافي وحماية الهوية.</li><li>النهوض بالمجتمعات العربية، لأن العولمة تتغلغل في المجتمعات الفقيرة التي تفتقد القدرة على المقاومة.</li><li>تفعيل الوعي الإعلامي.</li><li>فتح الأبواب أمام المعلومات والأفكار بدلاً من إغلاقها، وإتاحة المجال لنقدها ومناقشتها والاعتراف بالآخر.</li><li>امتلاك مفاتيح المعرفة بما يتناسب وحاجات العصر.</li></ul><h3>الموقف الصحيح في مواجهة العولمة</h3><ul><li>هو \"التأثر والتأثير\" بالعولمة:<ul><li>التفاعل معها والأخذ بما هو مفيد منها.</li><li>المشاركة في تطويرها بعد احتوائها، والأخذ بمنافع التكنولوجيا.</li><li>العمل على نشر الرموز التاريخية والحضارية والدينية، والتأصيل الثقافي لدى الشباب، وتوعيتهم بمخاطر الفضائيات.</li></ul></li><li>يجب الاندماج والانخراط والانفتاح ومعرفة ما يجري في العالم، مع المحافظة على الهوية الثقافية وخصوصية المجتمعات.</li><li>أقوال                     "content": "<h3>التحولات المحلية والعالمية في ظل العولمة</h3><ul><li>التحولات المحلية والعالمية في ظل العولمة والانفتاح الإعلامي (كالثورة المعلوماتية والذكاء الاصطناعي والتقدم التكنولوجي) أثرت في المجتمعات العربية التي قاومت للحفاظ على خصوصيتها الثقافية ومواجهة تحديات العولمة التي أصبحت أكثر انتشاراً نظراً لتفاعل أفرادها (خاصة الشباب) مع الإنترنت وما يحتويه من أفكار وقيم وأساليب حياة مخالفة للمجتمع العربي.</li><li>وسائل الاتصال والإنترنت تلعب دوراً كبيراً في تشكيل قيم واتجاهات جديدة تؤثر على قواعد السلوك الاجتماعي، وهذا يشكل خطراً على الهوية الثقافية.</li><li>العلاقات الاجتماعية لم تعد إنسانية مباشرة بل أصبحت \"افتراضية\" قائمة على التفاعل عبر \"وسيط آلي\" بشكل غير مباشر.</li><li>المجتمع الرقمي الجديد أخرجنا إلى مجتمع إنساني-آلي تسوده علاقات افتراضية تحددها منظومة تكنو-اجتماعية.</li><li>أصبح الفرد يحمل خصائص التكنولوجيا الرقمية في عقله وسلوكه، مما أثر على مكونات هويته وانتمائه ومستقبل علاقاته الاجتماعية والأسرية، خاصة مع الإفراط في استخدام مواقع التواصل الذي يؤدي إلى الانقطاع عن المحيط الاجتماعي الحقيقي والدخول في خطر العزلة وتفكك العلاقات الأسرية (مثال: أفراد أسرة واحدة يتواصلون مع آخرين عبر الإنترنت متجاهلين بعضهم).</li><li>الإفراط في استخدام الأجهزة والإنترنت يزيد من خطر الوحدة والعزلة، ويؤدي إلى العيش من غير عائلة ولا قبيلة ولا هوية ولا وطن.</li><li>تؤثر وسائل الإعلام على فئة الشباب بشكل خاص باعتبارهم أكثر انفتاحاً على الثقافات الأخرى وأكثر ميلاً نحو قيم التغيير والتمرد.</li><li>الشباب العربي أكثر قابلية للتأثر بأفكار وثقافات جديدة نتيجة ضعف خبرتهم وقلة الفرص لتكوين التفكير النقدي لديهم.</li><li>التطورات التكنولوجية السريعة والمؤثرات المادية والنفعية تؤثر على الشباب فتجعلهم في حالة حيرة وتشتت بين الأهداف والغايات، مما يضعف قدرتهم على الاختيار بين القيم المتصارعة.</li><li>هذا الصراع يؤدي إلى اضطراب في الهوية وفقدان الإحساس بالانتماء، ويتحولون إلى أفراد غير مسؤولين وغير مبالين، لا ينفعون ذاتهم ولا مجتمعهم.</li><li>أصبح الشباب العربي بحاجة ماسة إلى تحصينه وتعزيز قيمه الإنسانية من خلال المحافظة على القيم، والجمع بين الأصالة والعصرنة، والحفاظ على الهوية الثقافية.</li><li>العولمة تسعى للوصول إلى إنسان لا يعرف حدوداً ولا هوية ولا يكترث للقيم الأخلاقية.</li><li>المطلوب هو حداثة جديدة تتبنى العلم والتكنولوجيا دون أن تلغي القيم الإنسانية، حداثة تحيي العقل ولا تميت القلب، وتهتم بالحاضر دون إنكار التراث.</li><li>هذا يدعو إلى التمعن في الثقافة المتدفقة للتصدي لها بحكمة ومضاعفة المسؤوليات، وليس الانعزال، وذلك عبر تعزيز الهوية وتربية الشباب على القيم الأصيلة وتزويدهم بالمهارات للتفاعل مع العالم دون أن يؤثر ذلك في هويتهم.</li><li>يجب على المجتمعات العربية أن تعود لتاريخها الحضاري وتتمسك بثقافتها وتعتمد على العلم والعقل لمواكبة التقدم، فالإسلام يشجع على الابتكار وإعمال العقل (مثال حديث معاذ بن جبل عندما أرسله النبي لليمن قاضياً: \"بما تقضي؟ قال: بكتاب الله. قال: فإن لم تجد؟ قال: فبسنة رسول الله. قال: فإن لم تجد؟ قال: اجتهد رأيي ولا آلو\").</li><li>لإحداث تغيير في أي مجتمع على مستوى الحياة الاجتماعية، يقتضي إحداث تغيير في العقول والذهنيات (البنية الثقافية ككل). أول ما تصاب به الأمم في أطوار تراجعها الفكري هي \"مفاهيمها\". من هذا المنطلق، يجب تناول مفهوم \"المسؤولية الاجتماعية\" الذي غاب عن سلوك وتفكير الشباب العربي وحل مكانه اللامبالاة.</li></ul><h3>المسؤولية الاجتماعية</h3><ul><li>تعريف مجمع اللغة العربية: حال أو صفة من يسأل عن أمر تقع عليه تبعاته. وتطلق أخلاقياً على التزام شخص بما يصدر عنه قولاً وفعلاً.</li><li>تعريفات أخرى:<ul><li>المقدرة على أن يلزم الإنسان نفسه أولاً والمقدرة على الوفاء بالتزامه ثانياً.</li><li>إقرار الفرد بما يصدر عنه من أفعال واستعداده لتحمل نتائجها.</li></ul></li><li>أنواع المسؤولية: تتنوع المسؤولية لاعتبارات شتى (شخصية، جماعية، اعتبارية)، وتتبعاً لنوع المساءلة (أخلاقية، شرعية، قانونية، اجتماعية).</li><li>الإنسان \"كائن اجتماعي\" بطبعه، يحمل اتجاه الآخرين مسؤوليات وواجبات ترتبط بأدواره الاجتماعية.</li><li>الفرد مؤهل للقيام بعدة أدوار اجتماعية وتحمل مسؤولياتها.</li></ul><h4>تعريف المسؤولية الاجتماعية</h4><ul><li>المسؤولية الفردية عن الجماعة، أي مسؤولية الفرد أمام ذاته عن الجماعة التي ينتمي إليها.</li><li>التزام الأفراد والمؤسسات بالمساهمة في تحقيق أهداف التنمية المستدامة من خلال ممارسات مسؤولة تعزز حقوق الإنسان وتحافظ على البيئة وتدعم المجتمعات.</li><li>نظرية أخلاقية تقترح أن أي كيان (منظمة أو فرد) يقع على عاتقه العمل لمصلحة المجتمع ككل.</li></ul><p>يرى \"سارتر\" أن الإنسان طالما أنه حر فهو يتحمل مسؤولية أفعاله مسؤولية كاملة، لأن بدون المسؤولية تصبح الحرية فوضى ودماراً على المجتمع.</p><h3>عناصر المسؤولية الاجتماعية</h3><h4>1. الاهتمام</h4><p>الارتباط العاطفي بالجماعة، اهتمام يحيطه الحرص على استمرارها وتقدمها. حدد \"سيد عثمان\" أربعة مستويات للاهتمام:</p><ul><li>الأول: الانفعال مع الجماعة: أبسط صورة للاهتمام، وهو ارتباط عضوي بالجماعة يتأثر فيه كل عضو بما يجري في الجماعة كلها دون اختيار أو قصد أو إدراك ذاتي.</li><li>الثاني: الانفعال بالجماعة: مستوى أرقى، وهو التعاطف مع الجماعة، والفرق أن الفرد هنا يدرك ذاته أثناء انفعاله بالجماعة، ولم تعد المسألة عضوية آلية.</li><li>الثالث: الاتحاد مع الجماعة: يشعر الفرد بأنه والجماعة شيء واحد، وأن خيرها خيره وما يقع عليها من ضرر واقع عليه.</li><li>الرابع: تعقل الجماعة: ويتضمن شقين:<ul><li>استبطان الجماعة: أن تصبح الجماعة داخل الفرد فكرياً، أي تتطبع في فكره وتصوره العقلي، ويستطيع إدراكها وجعلها موضع تأمل.</li><li>الاهتمام المتفكر المتزن الرزين: الاهتمام بمشكلات الجماعة ومصيرها ودرجة التناسق بين أنشطتها وأهدافها، يقوم على منهج موضوعي مخطط من التفكير، وهو أعلى مستويات الاهتمام.</li></ul></li></ul><h4>2. الفهم والإدراك</h4><p>يتحكم إدراك الفرد في مدى فهمه للمواقف واتخاذ القرارات. مستوى الإدراك يرتبط بالمستوى التعليمي والرصيد المعرفي والخبرة. بقدر ارتفاع وعي الفرد لواقعه الاجتماعي وتاريخه وثقافته، بقدر ما تزداد مسؤوليته الاجتماعية. يتضمن الفهم شقين:</p><ul><li>فهم الفرد للجماعة: فهم حالتها الحاضرة ومؤسساتها وقيمها وأيديولوجيتها، وفهم العوامل التي تؤثر في حاضرها، وفهم تاريخها الذي بدونه لا يتم فهم حاضرها ولا تصور مستقبلها.</li><li>فهم الفرد للمغزى الاجتماعي لسلوكه: أن يدرك الفرد أن كل فعل يصدر عنه ذو قيمة اجتماعية وأنه باقٍ ومؤثر في الجماعة مهما صغر. الفرد الواعي مسؤول عن أفعاله تجاه ضميره أولاً وتجاه المجتمع ثانياً.</li></ul><h4>3. المشاركة</h4><p>هي تعبير عن الاهتمام والفهم، فهي ترجمان الوجدان والفكر معاً. هي اشتراك الفرد مع الآخرين في عمل يساعد الجماعة في إشباع حاجاتها وحل مشكلاتها وتحقيق رفاهيتها. لها ثلاثة جوانب:</p><ul><li>تقبل الفرد للدور: تقبل الأدوار الاجتماعية وما يرتبط بها من سلوك وتبعات، مما يجعل الفرد يشارك في الجماعة (موحداً) وليس منفصماً.</li><li>المشاركة المنفذة: المشاركة في العمل الفعلي لإخراج فكرة أو خطوة إلى عالم الواقع، أو تنفيذ ما على الفرد أداؤه.</li><li>المشاركة المقومة: نوع من المشاركة الموجهة الناقدة.</li></ul><h4>4. الأخلاق</h4><p>المسؤولية الاجتماعية هي التزام أمام الضمير وأمام الله وأمام المجتمع، لذا فهي ترتبط بالمنظومة الأخلاقية التي تجعل الفرد ينظر إلى الجماعة والمجتمع على أنهما مسؤولية أخلاقية.</p><h4>5. التنشئة الاجتماعية</h4><p>المسؤولية نمط من أنماط التنشئة الاجتماعية التي تحول الفرد من مخلوق ضعيف إلى شخص قادر على تحمل مسؤولية أقواله وأفعاله.</p><ul><li>الأسرة: دورها أساسي في صقل الشخصية وغرس القيم وتنمية روح المسؤولية، وذلك باعتماد أساليب تربوية صحيحة بعيدة عن الدلال الزائد أو العنف والقسوة، فكلاهما يؤثر سلباً ويكسب شعوراً باللامبالاة وانعدام المسؤولية.</li><li>المدرسة: تنمي شعور المسؤولية وتعززه عبر مناهجها وبرامجها، وتجسده بمواقف وتصرفات واعية. تحمل المسؤولية لا يمكن تنميته إلا عن طريق الممارسة والخبرات التي تسهم في صقل شخصية الفرد وبناءها سوياً، فالسلوك الاجتماعي الإيجابي يزداد بزيادة قدرة الفرد على تحمل المسؤولية الذاتية والاجتماعية.</li><li>مراحل تنمية الشعور بالمسؤولية: يمر بعدة مراحل تبدأ بمرحلة المسؤولية تجاه الآخرين حيث تنمو قدرة الفرد على الاتحاد مع الآخرين وتعلم الوعي الجماعي، ويضع في اعتباره رغبات ومشاعر الآخرين، وهنا تكمن بداية تكوين المعنى الحقيقي للمسؤولية الاجتماعية. وفي المرحلة الأخيرة يصل الفرد إلى كمال المسؤولية الاجتماعية ويسعى لتحقيق قيم المجتمع بسلوكياته، ويصبح أكثر قدرة على إدراك تصرفاته والاهتمام بالتفكير المنطقي الناقد والاعتماد على النفس.</li><li>تقاعس الفرد عن تحمل المسؤولية يلحق الضرر به وبمجتمعه، لذلك تعد تنشئة الفرد على تحمل المسؤولية مسألة في غاية الأهمية.</li><li>من القيم التي تعزز المسؤولية: حرية التعبير عن الرأي والنقد الموضوعي، احترام أعراف المجتمع وقوانينه، احترام حريات الآخرين، التسامح والأمانة والثقة بالنفس.</li></ul><h3>علاقة المسؤولية الاجتماعية بالانتماء</h3><ul><li>لابد للفرد أن يشعر بالانتماء ليحقق المسؤولية الاجتماعية، ولابد أن يتمتع بالمسؤولية ليشعر بالانتماء.</li><li>الانتماء يتضمن الارتباط المعنوي بالجماعة والحرص على سلامتها، وبالتالي الشعور بالمسؤولية تجاهها.</li><li>اتسام الفرد بالمسؤولية يتضمن معرفة واجباته والالتزام بها، وبالتالي يتعزز شعوره بالانتماء والاعتزاز بمجتمعه وتاريخه وثقافته.</li></ul><h3>علاقة المسؤولية الاجتماعية بالدين</h3><ul><li>أولى الدين الإسلامي أهمية كبيرة للمسؤولية الاجتماعية، وحث الشباب على تولي مسؤولياتهم ومعرفة حقوقهم وواجباتهم.</li><li>المسؤولية الاجتماعية ذات طبيعة أخلاقية واجتماعية ودينية، ويعد إيمان الفرد من أهم دعائمها، إذ يغذي الضمير الأخلاقي ويعزز شعوره برقابة الله، فتصبح المسؤولية التزاماً أخلاقياً ودينياً نحو الجماعة، ومرجعها الأساسي تقوى الله.</li></ul>",

                    "content": "<h3>أولاً. مفهوم الانتماء</h3><ul><li>لغة: من معاني (نما) الارتفاع. \"انتمى إليه\" أي انتسب وارتفع إليه في النسب. الانتماء هو الانتساب والارتباط بعلاقة وثيقة والتمتع بالعلاقات الاجتماعية التي تتيح الاندماج في الجماعة.</li><li>اصطلاحاً: الإحساس تجاه أمر معين يبعث على الولاء له والفخر به والانتساب إليه. ويرى باحثون أنه الانتساب الحقيقي للدين والوطن فكراً وعملاً، وتقمص عضوية ما لمحبة الفرد لها واعتزازه بها.</li><li>يعد الانتماء من أهم الحاجات الإنسانية التي تشعر الفرد بالروابط المشتركة. أشار \"أبراهام ماسلو\" في \"نظرية سلم الحاجات\" إلى حاجة الانتماء في المرتبة الثالثة، بعد الحاجات الأساسية وحاجات الأمان، وقبل حاجات التقدير وتحقيق الذات.</li><li>في علم الاجتماع: ارتباط الفرد بجماعة يسعى أن تكون قوية، يتقمص شخصيتها ويوحد نفسه بها، وهو مرتبط بالولاء، ويستخدم للدلالة على العلاقات والعواطف التي تربط الفرد بالجماعة أو رموزها.</li><li>في علم النفس: نوع من الاتحاد بين الفرد والجماعة مع توفر الإحساس بالأمان والرضا والفخر بها، وهو اتجاه يستشعره الفرد من خلال اندماجه في جماعة وتوحده بها، وأنه صار جزءاً مقبولاً منها له مكانته.</li></ul><h3>ثانياً. مستويات الانتماء</h3><ul><li>التصنيف الأول:<ul><li>المستوى اللفظي: التعبير عن الانتماء بالألفاظ والمشاعر فقط دون تطبيق.</li><li>المستوى السلوكي: التعبير عن الانتماء بالسلوك والممارسة (بذل جهد أو وقت أو مال).</li></ul></li><li>التصنيف الثاني:<ul><li>مستوى الانتماء المادي: كون الفرد جزءاً من جماعة ما ويبرز لها الولاء.</li><li>مستوى الانتماء الأناني: لفظي فقط، يعبر الفرد عن انتمائه للحصول على حاجاته، وقد يتحول لجماعة أخرى إذا حققت له إشباعاً أكبر.</li><li>مستوى الإيثار: يظهر خلال مواقف تتطلب التضحية من أجل الجماعة.</li></ul></li><li>التصنيف الثالث:<ul><li>مستوى الانتماء الدائم: مثل الانتماء للأسرة، الدين، الوطن.</li><li>مستوى الانتماء الطويل: الانتماء إلى الأقارب، النقابات، الجيران.</li><li>مستوى الانتماء القصير: زملاء الدراسة.</li></ul></li><li>التصنيف الرابع:<ul><li>مستوى الانتماء المعلن: يعبر الفرد لفظياً عن انتمائه.</li><li>مستوى الانتماء السلوكي: يتخذ الفرد موقفاً سلوكياً يدل على الولاء.</li></ul></li></ul><h3>ثالثاً. أنواع الانتماء</h3><h4>1. الانتماء الأول: دائرة الإنسانية</h4><ul><li>هو الانتماء الذي يجمع كل أفراد النوع البشري ويضفي عليهم هوية، من خلال إبراز المشترك بين الذوات.</li><li>من أهم سماته التشارك في الموروث الوراثي (البنية الجسدية والدماغ البشري) بغض النظر عن الاختلافات العرقية.</li><li>الدماغ البشري مكن الإنسان من ممارسة وظائف مثل التفكير وإبداع اللغات، لذا يوصف الإنسان بالكائن الرمزي.</li><li>الإنسان هو الكائن الوحيد الذي يدرك ببعدي المكان والزمان، فيعيش ماضيه وحاضره ومستقبله، فالتفكير واللغة ووعي الزمن هي أهم السمات المميزة للإنسان.</li><li>سمحتا التفكير واللغة بتشكيل منظومة أفكار تشكل الوعي، الذي يصفه \"إدغار موران\" بأنه أروع انبثاق للذهن البشري، وهو منتج ونتاج للعقل الإنساني.</li><li>الوعي يضفي على الإنسان هوية تميزه عن غيره.</li><li>صفة الوعي تحيلنا إلى فكرة الاعتراف بالغير كمشارك للأن ا في الوعي والوجود، فكلاهما يتشارك في اكتساب الهوية والانتماء لدائرة الإنسانية، وفي الغايات والقيم العليا.</li><li>يقول \"سارتر\": الآخر موجود ضمنياً في الواقع، وهو جوهر مفكر لديه الماهية ذاتها التي لدي.</li><li>الإنسانية تتعدى العقل إلى المشاعر، فالإنسان كائن وجداني، والمشاعر الإنسانية هي حلقة ربط تجمع البشرية، وبدونها لا يكون للتعاطف والتضامن أي معنى.</li><li>الإنسان كائن اجتماعي، يرتقي في اجتماعه إلى مستوى التنظيم والتنظير الاجتماعيين، وتقسيم العمل، والرقي إلى درجة المدنية والمواطنة التي تضمن الحريات وتقتضي معرفة الحقوق والواجبات.</li><li>رغم الاشتراك في الهوية البشرية، تختلف الجماعات الإنسانية في نفس ما تتشارك فيه، فالبنى النفسية تخضع لعوامل خارجية، مما يجعلها متمايزة، والوعي بالاختلاف يصبح خاصة مميزة للإنسان.</li></ul><h4>2. الانتماء الفكري</h4><ul><li>هو محصلة جملة من الاختيارات الإرادية الواعية التي يتخذها الإنسان في شتى المجالات.</li><li>يكتسب أهمية بالغة لكونه عاملاً أساسياً مشكلاً للهوية الفردية، فهو يبلور نظرة الإنسان للوجود ويسهم في تشكل فلسفته الذاتية التي تصنع تفرّده، وهو الكفيل بجعل الذات تدرك موقعها في العالم.</li><li>معناه: الانتساب الطوعي الفكري إلى فئة من البشر تتبنى نسقاً فكرياً أو مذهباً عقلياً أو منهجاً في التفكير.</li><li>توافق الإنسان مع جماعة في بعض التوجهات لا يعني بالضرورة انتماءه لنسقهم الفكري، فالإنسان حر في تفكيره، وهذا طبيعي ويشكل خصوصيته الفكرية.</li><li>التصنيف القسري: في مقابل الانتساب الطوعي، يوجد مفهوم التصنيف القسري، وهو إلصاق فرد أو جماعة بتوجه أيديولوجي دون معرفة حقيقية بهم، وهو نتاج إسقاط أحكام الغير على الذات. يرتبط برؤية الغير المخالف، ويؤدي إلى أحكام تعسفية وتمييز سلبي. وهو انتماء فكري وهمي يحصل بطريقة قسرية لا إرادية، في مقابل الانتماء الفكري الحقيقي المرتبط بالحرية والإرادة.</li><li>مصدر النظرة السلبية للانتماء الفكري هو رفض الغير للاختلاف ونفي مشروعيته والتشبث برؤية أحادية للحقيقة، وهو بمثابة سجن للعقل وتقويض لحريته.</li><li>تزداد حدة المشكلة عندما يرتبط الأمر بالانتماء الديني، حيث تتعدد الطوائف والفرق الدينية، ويتجلى رفض الاختلاف من خلال نعت الغير بالضلال أو التكفير.</li></ul><h4>3. الانتماء الاجتماعي</h4><ul><li>يمثل أحد الأسس الهامة لتشكل الهوية الاجتماعية، وهو إجابة عن سؤال \"من نحن؟\".</li><li>هو جملة الروابط التي تشد الفرد إلى مجتمعه، ولا يتأتى إلا بواسطة الذهنية المتشكلة التي تحمل نسقاً من القيم والمنطلقات والرموز الثقافية والدين والتاريخ.</li><li>الذهنية الاجتماعية تتشكل نتيجة تفاعل العقول مع النسق الثقافي عبر التنشئة الاجتماعية التي تضمن التزام الأفراد بالقيم والقوانين.</li><li>اكتساب اللغة: عملية تلعب دوراً مهماً في الانتماء الاجتماعي والهوية، فاللغة \"ليست أداة تقنية للتخاطب فقط، وإنا هي بالأساس، الوعاء الحضاري للأمم، تحمل العادات والتقاليد والمعارف وأنماط الحياة، وبها يكون انتماء الإنسان إلى مجتمعه\".</li><li>كيف يتبلور مفهوم الانتماء:<ul><li>يبدأ الفرد بإدراك مفهوم الانتماء في مرحلة الطفولة المتوسطة، من خلال فهمه لأمرين: إدراك العلاقات الأسرية (روابط الدم) وموقعه فيها، وإدراكه لفكرة المشاركة الجماعية والفريق (شلة الرفاق، فريق كرة القدم).</li><li>مع احتكاكه مع أقرانه في أوساط مختلفة، يبدأ بتشكيل معنى الغير والتفاعل معه، ويتجلى ذلك في المقارنات (أنا أفضل، أنا أحسن)، ويتعلم الأخذ بوجهة نظر الغير وتقديرها، وهو ما سماه علماء النفس \"التعاطي مع وجهة نظر الآخر\".</li><li>يحصل الإنسان في طفولته على كل المفاهيم الأساسية المرتبطة بالانتماء الاجتماعي مثل الهوية والمشاركة ومعنى الغير.</li><li>كلما تقدم في العمر، كلما فهم أكثر بنية النسق الاجتماعي وتأصلت انتماءاته في بناه ومؤسساته.</li></ul></li><li>تعددية الانتماء: في ظل الحياة الاجتماعية المتعددة، يؤدي الإنسان أدواراً متنوعة أساسها تعددية الانتماء (طبقة، حزب، دين، رياضة)، وهذه التعددية تشكل هويته المتنوعة.</li><li>هل تعددية الانتماء مشكلة سياسية؟<ul><li>ليست كل المجتمعات تشكل فيها تعددية الانتماء مشكلة، ففي نموذج الدولة الحديثة القائمة على المواطنة والقانون، لا تشكل التعددية مشكلة بل ينظر إليها كتنوع هوياتي.</li><li>الأمر يختلف في المجتمعات ذات التراكيب الاجتماعية المعقدة مثل المجتمعات العربية القائمة على القبيلة أو الطائفة أو العشيرة، والتي تمارس سلطة على أفرادها عبر الأعراف المتوارثة.</li><li>الفرد هنا مزدوج الانتماء إلى القبيلة والدولة، وقد يجد نفسه مجبراً على الالتزام بقوانين متعارضة. ما الذي يحدث إذا تعارض قانون الدولة مع عرف القبيلة؟ هذه هي إحدى إشكاليات الانتماء غير متاحة الحلول في العالم العربي.</li><li>التمييز: يجب التمييز بين القبيلة (تكوين اجتماعي قائم على رابطة الدم) و\"القبلية\" (نزعة تعصبية)، وبين الطائفة (تكوين قائم على أساس ديني) و\"الطائفية\" (نزعة تعصبية). فجوهر المشكلة يكمن في الفكر القبلي أو الطائفي القائم على التعصب والمؤسس للولاء.</li><li>الولاء: حالة دمج بين الذات الفردية في ذات أوسع، وهو تغييب للخصوصية الفردية واختزال لإمكاناتها. كل محاولة للاستقلال عن سطوة الجماعة تجعل الإنسان عرضة لأحكام سلبية (خائن، متآمر، غير مسؤول).</li><li>تزيد المشكلة حدة عندما ترتبط القبلية والطائفية بالسياسة، فتكون خدمة القبيلة أو الطائفة هي الغاية الأساسية قبل الوطن.</li></ul></li></ul>",

                    "title": "📗 الانتماء الثقافي والوطني",
                    "content": "<h3>الانتماء الثقافي</h3><ul><li>الإنسان كائن منتج للثقافة، والثقافة تعني كل ما أبدعته يد الإنسان، وكل ما هو صناعي مقابل الطبيعي.</li><li>تتجاوز الثقافة الطبيعة البشرية لتشكل المظاهر التعبيرية عن الحياة الإنسانية. المشاعر الإنسانية مشتركة (حزن، فرح)، لكن كيفيات التعبير عنها (طقوس جنائزية، مراسيم فرح) هي ما يمثل الثقافة ويجعل البشر مختلفين.</li><li>ترتبط الثقافة بالإرادة الواعية الفاعلة التي تجعل من المظاهر الثقافية نظاماً متسقاً مشكلاً للمعنى.</li><li>الارتباط بين الهوية الثقافية والتنظيم الاجتماعي: التنظيم الاجتماعي (القوانين، الأعراف، العادات) هو جزء من الثقافة الإنسانية.</li></ul><h4>التنشئة الاجتماعية والتطبع الثقافي</h4><ul><li>يتشكل الانتماء الثقافي في الذات نتيجة التنشئة الاجتماعية، التي لا تقتصر مهمتها على تهذيب السلوك، بل تتعداها لتلقين الفرد الخصوصيات الثقافية للمجتمع (أسلوب الحياة، النظام القيمي، حدود المقدس، النظام الرمزي المرتبط باللغة والدين والتاريخ).</li><li>يمكن تعريف التنشئة بأنها: عملية تطبع الهوية الثقافية الجمعية في الهوية الثقافية الفردية.</li><li>أدرك الفكر اليوناني القديم أهمية التربية في تشكيل الهوية الثقافية الفردية، ووضع ثلاثة مفاهيم:<ul><li>\"فوسيس\" (Phusis): المادة أو الاستعدادات الطبيعية القابلة للتشكيل (الطبيعة البشرية).</li><li>\"البايديا\" (Paidea): العناية والتربية والتنشئة، أو الجهد المبذول في صقل الطبيعة البشرية، وهي تستثمر \"الفوسيس\" لتكوين فاعل وهاد.</li><li>\"الأيديا\" (Idea): الأنموذج التربوي أو المثال الذي تسير وفقه عملية التنشئة، ويرتكز على مفهوم التقليد والاحتذاء.</li></ul></li><li>آلية التقليد والاحتذاء تكرس مفهوم الالتزام، أي التزام الشخص بقواعد النظام الاجتماعي عبر مطابقة أفعاله للسلوك المحدد، حتى تتصف سلوكياته بـ\"العادية\" أو \"السوية\".</li><li>في مرحلته الأولى، يتعلم الفرد الالتزام الثقافي والاجتماعي عبر التمثل والخضوع للقواعد، ساعياً للانضباط حتى يحظى بالتقدير، ولا يحرص على التأمل النقدي للقواعد بقدر حرصه على تطبيقها والخضوع لها.</li></ul><h4>التفاعل الثقافي</h4><ul><li>قضية الانتماء الثقافي لا تقتصر على التنشئة فقط، بل ترتبط بالتفاعل الثقافي الذي يحدث نتيجة التقاء الهويات الثقافية المختلفة.</li><li>هذا الالتقاء يمكن الفرد من اتخاذ مواقف من مسألتين: الوافد الثقافي والموروث الثقافي.</li><li>في ظل العولمة كظرف حضاري راهن، تأثرت الهويات الثقافية في بنياتها وعلاقاتها، وخلقت وسطاً تفاعلياً لم يشهد من قبل بسبب الثورة التقنية التي جعلت الترابط العالمي ممكناً.</li><li>أحدثت التقنية ثورة تواصلية عالمية غيرت مفهوم الاتصال ذاته، فلم يعد مقترناً بضرورة الحضور الجسدي والتواجد المكاني.</li><li>التفاعل الثقافي -كعامل محدد للانتماء- لا يمكن أن يتاح إلا من خلال التواصل. التواصل إذا اتخذ شكل الحوار سيفتح باب النقد، وهذا قد يؤدي إلى قوة الهوية وصلابتها، أو إلى زعزعة الثوابت وإعادة ترتيب المرجعيات.</li><li>الهوية الثقافية في زمن العولمة أصبحت ترتبط بمفاهيم مثل: عدم اليقين، الليونة، التفتت.</li><li>ثقافة الصورة (الفيديولوجيا): أهم الأدوات التقنية للتفاعل الثقافي في زمن العولمة هي ثقافة الصورة التي تفوقت على الوسائل التقليدية.<ul><li>استبدلت العولمة الأيديولوجيا بـ\"الفيديولوجيا\" التي تدعي تصوير الواقع، لكنها تحمل رسائل مضمرة وتصور نماذج ثقافية نمطية.</li><li>أمثلة: الأفلام الهوليودية تحمل إشارات أيديولوجية كتصوير أمريكا كمنقذة للعالم، أو تصوير الإسلام على أنه أصل الإرهاب.</li><li>يقول \"عبد الغني عماد\" عن الفيديولوجيا: \"أكثر ضبابية وأقل ثقة من الأيديولوجيا السياسية التقليدية\".</li><li>خلق النماذج النمطية يؤدي إلى صراع ثقافي (مثل ربط الإسلام بالإرهاب وتصدير هذه الصورة).</li></ul></li><li>إذا كانت الصور الإعلامية تحمل رموزاً ثقافية تعكس هوية وانتماءً، فإن المشاهدة المستمرة لها تؤدي إلى تشكل منظومة رموز في ذهن المتلقي تعمل على هندسة الخيال وتشكل هوية رمزية قد تحدث الشعور بالانتماء إليها.</li><li>الانتماء الثقافي في زمن العولمة أزال \"الحدود الإقليمية\" كشرط من شروط الانتماء للهوية الثقافية، عبر فقدان العلاقة الطبيعية بين الثقافة والجغرافيا.</li></ul><h3>الانتماء الوطني</h3><ul><li>تعريفه: شعور الفرد بأنه جزء من وطن أو أمة ينتسب لها ويرتبط بها ويشاركها اجتماعياً وثقافياً واقتصادياً وسياسياً ويحميها من أي تهديد.</li></ul><h4>مؤسسات تعزز الانتماء الوطني</h4><ul><li>الأسرة: غرس العادات والتقاليد السليمة وبناء الشخصية وتأصيل القيم الدينية والوطنية.</li><li>المؤسسات التعليمية:<ul><li>المدرسة: بناء الاتجاهات الإيجابية (حب الوطن، حب الخير)، عبر ممارسات عديدة كطابور الصباح والنشيد الوطني، تدريس مواد التربية الوطنية والاجتماعية والدينية، القيام بمبادرات وأنشطة جماعية.</li><li>الجامعة: تعزيز الولاء عبر أنشطة رعاية الشباب، الندوات، المبادرات، المؤتمرات.</li></ul></li><li>المؤسسات الدينية: عبر الخطب والدروس الدينية والاسترشاد بالآيات والأحاديث التي تظهر قداسة الوطن، وتقديم القدوة من الصحابة والرموز الدينية.</li><li>وسائل الإعلام الجماهيرية: عبر البرامج والمقالات والمسلسلات والأغاني التي تتعلق بالتاريخ والوطن وإنجازاته.</li><li>الدولة: يقع على عاتقها مسؤوليات لبناء الانتماء مثل تحقيق المساواة والعدالة، توفير مستوى معيشي مناسب، توعية الأفراد بالإنجازات، إتاحة الفرص للمشاركة الشعبية، سيادة الديمقراطية، محاربة الفساد، عدم التمييز، توفير الأمن.</li></ul><h4>مظاهر الانتماء الوطني</h4><ul><li>حب الوطن والفخر به، الامتثال للقيم الوطنية، الاستعداد للتضحية، الحفاظ على الآداب والممتلكات العامة، احترام القوانين، الاهتمام بمشكلات الوطن، تأدية الخدمة العسكرية والعامة، المشاركة التطوعية، احترام العلم والنشيد، الاحتفال بالمناسبات، التمسك بالعادات، معرفة التاريخ.</li></ul><h4>مظاهر ضعف الانتماء الوطني</h4><ul><li>النقد اللاذع وغير الموضوعي، تشويه صورة الوطن ورموزه، تضخيم السلبيات، انتشار اللامبالاة والأنانية، التعدي على الممتلكات، فقدان الإحساس بالمسؤولية، محاولة تغيير اتجاهات أبناء الوطن.</li></ul><h4>أسباب ضعف الانتماء الوطني</h4><ul><li>عدم قيام الأسرة والمؤسسات التعليمية والدينية والإعلام بدورها.</li><li>التغيرات السريعة في المجتمعات العربية.</li><li>العولمة والغزو الثقافي وانتشار القيم الفردية.</li><li>غياب الوعي القومي.</li><li>عدم الشعور بالعدالة والمساواة.</li><li>عدم الحصول على الرعاية المطلوبة أو مستوى معيشي مناسب.</li><li>انتشار الفساد والشعور بالاغتراب.</li></ul><h4>أساليب بناء ودعم الانتماء الوطني</h4><ul><li>توعية الأفراد بأهمية الانتماء والحفاظ على الوطن.</li><li>توعية الأفراد بحقوقهم وواجباتهم.</li><li>تضمين موضوعات الانتماء في المناهج التعليمية.</li><li>القدوة الصالحة.</li><li>غرس واجبات المواطنة.</li><li>التأكيد على الهوية الوطنية.</li></ul><h3>مفاهيم مرتبطة بالانتماء الوطني</h3><h4>1. المواطنة</h4><ul><li>مفهوم متجدد ومتغير، والاختلاف بينها وبين الوطنية أن المواطنة هي الإطار الفكري والنظري للوطنية (عملية فكرية)، بينما الوطنية هي الممارسة. أما الانتماء فهو أساس المواطنة ويرتبط بها بعلاقة طردية.</li><li>ارتبط ظهورها بحدثين: دستور الولايات المتحدة 1788، وإعلان حقوق الإنسان والمواطن في فرنسا 1789. وهي مبنية على فكرة الشعب صاحب السيادة ووجود حقوق أساسية للفرد.</li><li>تعريفات:<ul><li>مكانة أو علاقة اجتماعية بين فرد طبيعي ومجتمع سياسي (دولة)، يقدم الفرد الولاء وتتولى الدولة الحماية.</li><li>شعور الفرد بالمواطنة محكوم بنوع العلاقة بينه وبين النظام الحاكم، فيقوى إذا مُكّن الفرد من حقوقه.</li><li>علاقة بين الفرد والدولة يحددها القانون، وتتضمن واجبات وحقوقاً متبادلة.</li><li>علاقة اجتماعية تفترض حقوقاً دستورية وواجبات قانونية تهدف لتحقيق مقاصد مشتركة بين الوطن والمواطن.</li></ul></li><li>أسباب بروز مفهوم المواطنة:<ul><li>أدركت الدول العربية خطورة التغيرات والأحداث على قيم مواطنيها، مما ولّد لديها الخوف والقلق، لا سيما مع الاتجاهات الدخيلة التي تتعارض مع قيمها، وعجز مؤسسات المجتمع الثقافية عن التصدي لها. ومن هذه التغيرات:<ul><li>تغيير موازين القوى وسيطرة القطب الأوحد.</li><li>ظهور التكتلات السياسية والاقتصادية.</li><li>تنامي البنى الاجتماعية الحاضنة للفكر الليبرالي.</li><li>عبور الحدود الجغرافية على جسور تكنولوجيا الاتصال.</li><li>الانفتاح الإعلامي.</li><li>قصور دور مؤسسات المجتمع في تشكيل الوعي الوطني.</li><li>غياب الدور الفاعل للمؤسسات التربوية في التشجيع على المشاركة التطوعية.</li></ul></li></ul></li><li>مكونات المواطنة:<ul><li>الانتماء: الانتساب الحقيقي للوطن فكراً وعملاً.</li><li>الحقوق: التي تكفل للمواطن حياة كريمة (حرية، مساواة، عدالة، رعاية صحية وتعليمية).</li><li>الواجبات: المترتبة على كل مواطن (احترام النظام، الدفاع عن الوطن، المساهمة في تنميته).</li><li>المشاركة المجتمعية: وتوحد الفكر، والمشاركة في الأعمال التطوعية.</li><li>الاشتراك في القيم العامة: من عادات وتقاليد ونظم وقوانين.</li><li>أساس تحقيق المواطنة هو أن يدين الفرد بالولاء للدولة، وأن تلتزم الدولة بتوفير الحماية والأمن، ويحدد العقد الاجتماعي الحقوق والواجبات.</li></ul></li></ul><h4>2. الهوية</h4><ul><li>تعريف عام: الإدراك الوجداني الذاتي للفرد.</li><li>أبعادها:<ul><li>الهوية الوطنية: مجموعة السمات المشتركة التي تميز أمة أو مجتمع عن غيره (مثال الجنسية).</li><li>الهوية الفردية: الصفات التي تميز الفرد عن الآخرين (الخبرات، المعتقدات، التجارب).</li><li>الهوية الجمعية: تعكس انتماء الفرد لجماعة، وتتشكل من القيم والعادات (مثال الانتماء الديني).</li><li>الهوية الثقافية الفردية: جزء من هوية الفرد تتشكل من تفاعله مع الثقافة المحيطة ومدى قبوله لها.</li><li>الهوية الثقافية الجمعية: تتمثل باللغة والعادات والتاريخ التي تشترك بها جماعة معينة (مثال الاحتفال بعيد النيروز).</li></ul></li></ul><h3>رابعاً. آثار تحقيق الانتماء وأهميته</h3><ul><li>آثار دينية: تحقيق التوحيد، قوة الاتصال بالدين، احترام العلماء، القيام بالواجبات بأمانة، تربية الأبناء على تقدير الوطن، تحصين المجتمع من الأفكار الضالة، وتحصين الشباب ضد النزعات الفكرية.</li><li>آثار فكرية: عدم التأثر بالأفكار المنحرفة، الاقتداء بالرموز الراسخة، الاعتراف بفضل الوطن، زيادة دافعية التعلم، التشبع بالحس الوطني، الحوار بدل العنف، استشعار قيمة الوطن، تأكيد الهوية الوطنية، الثقة بالآخرين والمشاركة، ودعم الهوية الثقافية.</li><li>آثار نفسية: الشعور بالاستقرار والأمان النفسي، إحساس الفرد بأهمية دوره، الغيرة على ممتلكات الوطن، زيادة الثقة بالنفس، الشعور بمحبة الآخرين، الشعور بأهمية الذات، وغلبة روح الانتماء للوطن على الروح القبلية.</li><li>آثار اجتماعية: ارتفاع التماسك الاجتماعي، سيادة المحبة والتعاون، شعور الفرد بكيانه، تعزيز العلاقات الأسرية، التخلي عن الأنانية، التعاون مع مؤسسات المجتمع، تعزيز المشاركة المجتمعية، قوة الأداء العام، تحقيق الأمن، تخفيف الأعباء عن الدولة، تحقيق التنمية المستدامة، وتحفيز الإبداع.</li></ul><h3>خامساً. تقاطع أنواع الانتماء وتشكل الهوية الفردية</h3><ul><li>تشكل الهوية الفردية هو نتاج تفاعل أنواع الانتماء، وهي عملية دينامية معقدة.</li><li>تفاعل الهوية الفردية مع الأنساق الفكرية والاجتماعية والثقافية يحدث عن طريق التنشئة الاجتماعية في المراحل العمرية الأولى، عبر آليتي التقليد والالتزام.</li><li>لكن التطبع لا يعني الانعكاس التام أو ذوبان الهوية الفردية في الجمعية، لأن الإنسان تفرّد يأبى الذوبان.</li><li>تمايز الفرد لا يتأتى إلا من خلال عملية تأمل فكري ونقد بناء في الأنساق الثقافية، وإعادة قراءة التاريخ الثقافي للجماعة (اللغة، الدين، تاريخ الجماعة).</li><li>تشكل الهوية الفردية هو عملية بناء غير منتهية، فالإنسان المفكر يعيش مشتغلاً بالمشكلات الفكرية المستجدة، ونتاج هذا الجهد يزيد ذاته صقلاً وهويته تمايزاً.</li><li>لا يمكن الجزم بأن كل الذوات تخوض تجربة التفكير العقلي الممنهج، فالكثير من العقول تأخذ الموروث الثقافي كمسلمات لا تقبل الشك، وفهمها للواقع الراهن سطحي.</li><li>الاستنتاج: هوية الفرد المتمايزة ليست معطى جاهزاً، بل هي نتاج جهد عقلي يتسم بالوعي والاستمرارية.</li></ul><h3>سادساً. الانتماء والتعصب</h3><ul><li>التعصب: التشدد، وعكسه التسامح. من العصبية، وهي أن يدعو الرجل لنصرة عصبته ظالمين كانوا أو مظلومين.</li><li>تعريفه: شعور داخلي يجعل الإنسان يتشدد فيرى نفسه على حق ويرى الآخر على باطل بلا حجة أو برهان، ويظهر بمواقف متزمتة تنطوي على احتقار الآخر وعدم الاعتراف بحقوقه.</li><li>هو اتجاه نفسي جامد مشحون انفعالياً، أو حكم مسبق ضد جماعة، لا يقوم على سند منطقي أو معرفة كافية، بل ربما يستند إلى أساطير وخرافات.</li><li>أنواعه: ديني أو طائفي، عرقي أو قومي أو قبلي، فكري، للنوع الاجتماعي، رياضي، طبقي.</li><li>الفرق بين الانتماء والتعصب:<ul><li>الانتماء: معتدل، إيجابي، موضوعي، لا يترتب عليه أضرار، يجمع الناس، يتقبل الآخر، منفتح، ويتطلب ذكاءً اجتماعياً وعاطفياً.</li><li>التعصب: متشدد، سلبي، غير موضوعي، يترتب عليه أضرار، يفرق الناس، لا يتقبل الآخر، منغلق على ذاته.</li></ul></li></ul>",

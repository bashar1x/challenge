                    "content": "<h3>أولاً. العنوسة</h3><h4>تعريف العنوسة</h4><ul><li>لغة: ورد في القاموس المحيط أن \"العانس هي البنت التي لم تتزوج والرجل الذي لم يتزوج\". وهذا يشير إلى أن اللفظ ينطبق على المرأة والرجل على حد سواء، وهي ملاحظة جديرة بالاهتمام، لكن المفهوم الشعبي يرى أن العانس هي المرأة لا الرجل.</li><li>اصطلاحاً: مصطلح اجتماعي مستوحى من التركيبة الثقافية لكل مجتمع. هو متغير اجتماعي يتغير بتغير الظروف والأوضاع الاجتماعية والاقتصادية والسياسية، ويشير إلى السن التي تصل إليها الفتاة دون زواج مقارنة بالسن المتعارف عليه في المجتمع. لكل مجتمع نظرته الخاصة للظاهرة وفقاً لسياقه الثقافي والعرفي. هي ظاهرة لها أسبابها الاجتماعية والاقتصادية والنفسية، لكنها بالدرجة الأولى ظاهرة سلبية من صنع البشر أنفسهم، ولا تختص بالنساء فقط بل تطلق على الرجال أيضاً.</li></ul><h4>أنواع العنوسة</h4><ul><li>عنوسة اختيارية: ترتبط بقرار شخصي من الشاب أو الفتاة بعدم الرغبة بالزواج، وغالباً تعتمد لدى الفتاة على الاستقلالية التي اكتسبتها من أسرتها أو قدرتها المادية.</li><li>عنوسة حتمية (قسرية): هي عدم الزواج نتيجة لظروف مفروضة، مثل تأخر السن دون تقدم أحد، أو عدم توفر الظروف اللازمة.<ul><li>يفسر أسباب ذلك نفسياً بالحديث عن عدة شخصيات:<ul><li>الشخصية التمامية: لا ترضى إلا بالكمال التام في الشريك، شخصية قلقة تبحث عن المثالية.</li><li>الشخصية النرجسية: المغرورة التي ترى أنه لا شريك يليق بها، تعشق ذاتها وتبحث عن خصوصية تشبع غرورها.</li><li>الشخصية الانطوائية: منغلقة وخجولة، متعتها في وحدتها، وتعتبر المشاركة الوجدانية ثانوية.</li><li>الشخصية المتقمصة: تتقمص الفتاة شخصية أمها، مما يؤدي إلى القلق والنفور من الزواج.</li></ul></li></ul></li></ul><h4>أسباب ظاهرة العنوسة</h4><ul><li>أسباب ذاتية: تتعلق بالفرد ذاته، وتختلف بين الرجل والمرأة، وترتبط بقرار شخصي:<ul><li>البحث عن شريك بمواصفات مثالية مستوحاة من القنوات الفضائية والإنترنت.</li><li>المبالغة في نفقات الزواج ومراسيمه.</li><li>الرغبة في شريك ليس لديه صداقات مع الجنس الآخر، في ظل تأثر المجتمعات بالقيم الغربية الوافدة (كالاختلاط في الأماكن العامة).</li><li>انشغال الفتاة بتحصيل العلم والسعي للشهادات.</li><li>سعي الفتاة للحصول على وظيفة لتأكيد شخصيتها واستقلالها المالي.</li><li>رواسب نفسية لدى الفتاة، وتصورات خاطئة عن الزواج وما قد ينتهي إليه من فشل أو طلاق.</li><li>عدم رغبة الشاب في تحمل مسؤولية الزواج وأعبائه.</li></ul></li><li>أسباب اقتصادية:<ul><li>الظروف الاقتصادية (البطالة، ضعف الدخل، عدم توفر السكن، الفقر) ساهمت في عزوف الشباب عن الزواج. قد يلجأ البعض للهجرة والزواج من أجنبية، أو للطرق المنحرفة، وعندما يقرر تكوين أسرة بعد الأربعين يختار فتاة عشرينية، ومصير من هن في الثلاثين والأربعين العنوسة.</li><li>ارتفاع المهور وتكاليف الزواج.</li><li>معارضة بعض الآباء تزويج بناتهم الموظفات طمعاً في أموالهن.</li></ul></li><li>أسباب اجتماعية:<ul><li>تراجع المفهوم الصحيح للزواج كوسيلة للاستقرار.</li><li>العادات والتقاليد البالية (إصرار الأهل على زواج الأخت الكبرى قبل الصغرى).</li><li>غياب دور الأسرة في التوعية وتحمل المسؤولية.</li><li>غياب دور المؤسسات الاجتماعية في إيجاد حلول عملية.</li><li>انتشار الزواج العرفي والعلاقات عبر الإنترنت كطرق بديلة وخاطئة.</li><li>زيادة عدد النساء مقارنة بالرجال، بسبب زيادة الولادات الإناث (4 بنات مقابل ذكر) والحروب التي يذهب ضحيتها الشباب.</li><li>عدم التشجيع على الزواج.</li><li>فساد المجتمع والاختلاط الفاسد والانحلال الأخلاقي، مما يدفع الشباب لعدم الثقة بالنساء.</li><li>تأثر الفتاة بما يبثه الإعلام من مفاهيم مغلوطة عن الأسرة والزواج.</li><li>اختلاف مستوى التعليم، حيث يميل الذكور للزواج ممن هن أدنى منهم تعليماً، بينما تميل الإناث للارتباط بذكور أعلى مستوى.</li></ul></li><li>أسباب صحية:<ul><li>مرض عضوي (كالقلب أو السكري) أو عيوب خلقية (كالحول أو الإعاقة) قد يمنع الشاب من التقدم خوفاً من الرفض.</li><li>مرض نفسي لدى الفتاة أو الشاب يشكل عقدة من الزواج.</li></ul></li><li>أسباب ثقافية:<ul><li>وسائل الإعلام مقصرة في تقديم برامج عن الثقافة الأسرية من جهة، ومن جهة أخرى تطرح موضوع العنوسة دون حلول، إلى جانب غياب دور المنظومة التربوية.</li><li>ساهم الإعلام في انسلاخ الفتاة عن جذورها الثقافية والذوبان في ثقافات أخرى عبر المسلسلات والأفلام التي تبث قصص الحب والعلاقات الرومانسية، مما جعل الفتاة تعيش في أحلام زائفة وتغير من معايير الزواج، فأصبحت ترى الحب شرطاً أساسياً للزواج قبل الزواج، مما ساهم في تأخر سن الزواج.</li></ul></li><li>أسباب دينية:<ul><li>غياب الوعي الديني عن أهمية الزواج، والتغافل عن حث الإسلام على الزواج وتيسير أموره.</li></ul></li></ul><p>الخلاصة: معظم أسباب العنوسة قابلة للعلاج عندما تقترن بالوعي الديني والإرادة والنظرة المتفائلة والتشجيع من الأسرة والمجتمع.</p><h4>آثار ظاهرة العنوسة</h4><ul><li>آثار نفسية:<ul><li>الشعور بالإحباط والحرمان.</li><li>العدوانية.</li><li>العزلة والانطوائية نتيجة ملاحقة الأنظار والكلام عن \"المكتوب والقسمة\"، مما يدفعها للهرب من مواجهة الناس.</li><li>فقدان التوازن النفسي.</li><li>الحزن والاكتئاب.</li></ul></li><li>آثار أخلاقية:<ul><li>الانحراف الأخلاقي: اللجوء لتلبية الحاجات الغريزية بعلاقات منحرفة عند غياب الوازع الديني.</li><li>التآمر والكيد: مشاعر الحقد والحسد قد تدفع العانس للتنكيد على السعداء، وقد تصل للسحر والشعوذة.</li><li>إقامة علاقات وهمية عبر الهاتف والإنترنت.</li><li>التسرع في الزواج والاختيار للخلاص من شبح العنوسة، مما قد يسبب الطلاق.</li></ul></li><li>آثار صحية:<ul><li>التوتر العصبي الدائم وما ينتج عنه من أمراض كضغط الدم والقولون.</li><li>اختلال وظائف الغدد نتيجة التوتر والاكتئاب.</li><li>كثرة الأورام الليفية.</li></ul></li><li>آثار اجتماعية:<ul><li>قلة النسل: فالإنجاب مقصد أساسي من مقاصد الزواج.</li><li>التفكك الأسري: بسبب تحميل كل طرف مسؤولية هذا الوضع.</li><li>ضعف الروابط الاجتماعية: فالزواج يحرم المجتمع من روابط المصاهرة والنسب.</li><li>انتشار الزواج العرفي: بسبب فقدان الأمل بالزواج الشرعي.</li><li>كثرة الطلاق: نتيجة الزواج غير المتكافئ الذي قد تلجأ إليه الفتاة للخلاص من واقعها.</li></ul></li><li>آثار اقتصادية:<ul><li>انخفاض الإنتاج.</li><li>البطالة: الفتاة العانس قد تضطر للعمل، مما قد يكون على حساب فرص الشباب.</li><li>زيادة التكاليف: من خلال معالجة الأمراض والانحرافات ودعم المؤسسات الصحية والإصلاحية.</li></ul></li></ul><h4>تداعيات العنوسة على الأسرة</h4><ul><li>لا تتوقف التداعيات على الفتاة، بل تمتد لأسرتها التي تعاني من ضغط اجتماعي وخجل وخوف.</li><li>الأب: قد يبحث عن عريس لابنته بين المحيطين به، وإذا فشل يلجأ لأساليب لا شعورية كادعاء رفض الكثيرين، وقد يتعايش مع هذا الكذب. وفي تعامله مع ابنته قد يكون إيمانه قوياً، أو قد يتشدد ويراقبها، أو يمنحها حرية مطلقة.</li><li>الأم: تعيش المشكلة بكامل طاقتها، وقد تنتابها حالات من الاكتئاب والقلق، وقد تلجأ للسحرة والدجالين أو للدلالات، أو تقوم بالتخفيف عن ابنتها وحثها على الرضا بقضاء الله إذا كان إيمانها قوياً.</li><li>الفتاة: تكون أكثر أفراد الأسرة معاناة.</li></ul><h4>بعض الحلول المقترحة للحد من ظاهرة العنوسة</h4><ul><li>نشر الوعي لدى الشباب حول المفاهيم المتعلقة بالزواج.</li><li>تغيير العادات البالية (كبر سن الزوج، مستوى التعليم، زواج الكبرى أولاً).</li><li>خلق فرص عمل للشباب.</li><li>تفعيل دور الإعلام ومؤسسات المجتمع في التوعية والتشجيع على الزواج.</li><li>تعزيز الوعي الديني حول أهمية الزواج.</li><li>إنشاء صندوق دعم الزواج، وهو ما قامت به الإمارات العربية المتحدة، وأهدافه:<ul><li>تشجيع الزواج المبكر للجنسين.</li><li>الحد من الزواج الخارجي (من الأجنبيات).</li><li>تشجيع الزواج الجماعي.</li><li>تشجيع تعدد الزوجات.</li></ul></li></ul><h3>ثانياً. الإدمان الرقمي</h3><h4>تعريف الإدمان الرقمي</h4><ul><li>هو الاستخدام المفرط للأجهزة الرقمية.</li><li>الإدمان لغة: المداومة على الشيء أو الاعتماد عليه.</li><li>الإدمان اصطلاحاً: المداومة على عادة تعاطي مواد معينة أو القيام بنشاط معين لمدة طويلة، بقصد الدخول في حالة من النشوة واستبعاد الحزن والاكتئاب.</li><li>محكات سلوك الإدمان: (حسب أحد الباحثين)<ul><li>السمة البارزة: يصبح السلوك أهم الأنشطة وأكثرها قيمة، ويسيطر على التفكير والمشاعر.</li><li>تغيير المزاج: خبرة ذاتية يشعر بها نتيجة للقيام بالسلوك، وقد تستخدم كاستراتيجية للمواجهة.</li><li>التحمل: الحاجة إلى زيادة كمية النشاط للحصول على نفس الأثر السابق.</li><li>الأعراض الانسحابية: مشاعر عدم الراحة والآثار الفيزيولوجية التي تحدث عند الانقطاع عن النشاط فجأة.</li><li>الصراع: بين المدمن والمحيطين به، أو بين هذا النشاط وغيره (العمل، الحياة الاجتماعية).</li><li>الانتكاس: الميل للعودة مرة أخرى لأنواع الأنشطة التي كان يدمنها.</li></ul></li><li>العامل البيولوجي: توصل العلماء إلى دور \"الدوبامين\" في هذه العملية، وهي مادة مرتبطة بالمتعة والابتهاج، يرتفع مستواها ليس فقط من المخدرات بل أيضاً من المديح والتسوق والمقامرة. عندما يؤدي شيء لرفع مستوى الدوبامين، يشعر الفرد برغبة طبيعية للحصول على المزيد.</li><li>موقف الجمعية الأمريكية للطب النفسي (APA): أقرت وضع الإدمان على الإنترنت ضمن عناصر الإدمان الأخرى، وعرّفته على أنه \"اضطراب يظهر حاجة سيكولوجية قسرية نتيجة عدم الإشباع من استخدام الإنترنت\".</li><li>هو حالة من الاستخدام المرضي وغير التوافقي للإنترنت يؤدي إلى اضطرابات في السلوك، ويستدل عليها بظواهر منها زيادة عدد الساعات أمام الإنترنت بشكل مطرد تتجاوز الفترات التي حددها الفرد لنفسه.</li><li>عرف أيضاً بأنه عملية تصحيحية وتعويضية لنقص الثقة بالنفس في مجالات الحياة المختلفة.</li></ul><h4>أسباب الإدمان على الإنترنت</h4><ul><li>الإنترنت أداة متطورة، لكنها أحدثت انقلاباً في المفاهيم والممارسات النفسية والاجتماعية، وتسمح بتكوين علاقات اجتماعية وتبادل الآراء، وتوفر المجتمعات الافتراضية وسيلة للهروب من الواقع.</li><li>أكدت الدراسات أن أكثر الناس قابلية للإدمان هم الشخصيات المكتئبة والقلقة، والتي تعاني من الفراغ والملل والوحدة، والذين يشفون من إدمان آخر.</li><li>العوامل المسببة:<ul><li>الافتقاد للسند العاطفي عند المراهقين، مما يجعلهم يلهثون وراء الإشباع الوهمي.</li><li>إطلاق الرغبات الدفينة والتعبير عنها عبر غرف الدردشة للتخلص من القيود المجتمعية.</li><li>توفر غرف الدردشة وسيلة للتفريغ الانفعالي وتفريغ شحنات الغضب والكبت، مما يؤدي إلى توهم المحبة.</li><li>محاولة الأفراد التخلص من القلق النفسي وضغوطات الحياة.</li><li>انتشار مقاهي الإنترنت وتوفر السيولة المالية للمراهقين.</li><li>التأثر بثقافات أخرى.</li><li>تأثير جماعة الأقران والأصدقاء المدمنين.</li><li>المفهوم السلبي للتحضر والقابلية للاستهواء.</li><li>الشغف وحب الاستطلاع واكتشاف الجديد لدى المراهقين.</li><li>الهروب من الواقع الحقيقي والضغوط والمسؤوليات.</li></ul></li></ul><h4>أعراض الإدمان الرقمي</h4><ul><li>عدم الإشباع من استخدام الإنترنت والرغبة في العودة إليها.</li><li>ظهور علامات القلق والتفكير والشعور بالحزن والاكتئاب.</li><li>اللجوء إلى نوم عميق بعد تصفح مجهد.</li><li>قدرة الاحتمال: الحاجة لزيادة وقت الاستخدام لتحقيق الرضا، وضعف واضح في المجهود أثناء الاستعمال.</li><li>حالة الفقد (الانسحاب): أعراض الانسحاب الرقمي عند التوقف أو التقليل، وتظهر علامتان أو أكثر بعد بضعة أيام إلى شهر مثل: حالة تهيج نفسي حركي، الشعور بالقلق عند الابتعاد عن الإنترنت، أفكار استحواذية وسواسية حول ما يحدث في الإنترنت، أحلام اليقظة، حركات إرادية ولا إرادية لتحريك الأصابع، حالة من التأزم الاجتماعي والمهني، استعمال الإنترنت لتجنب أعراض الانسحاب.</li><li>استعمال الإنترنت لمدة أطول مما خطط له.</li><li>ضعف الإرادة لضبط مدة الاستخدام والفشل في التقليل أو التوقف.</li><li>استغراق وقت طويل في نشاطات لها علاقة بالإنترنت (البحث عن إصدارات جديدة، التسوق، الريلزات).</li><li>إهمال الحياة الخاصة الاجتماعية والتعليمية والمهنية.</li><li>استخدام مستمر رغم معرفته بالأضرار.</li></ul><h4>ثلاث جوانب مهيمنة على المدمن</h4><ul><li>فكرة المجتمع: تجمع الأصدقاء على الخط أو الشبكة.</li><li>التخيلات: تخيلات غير أخلاقية أو اعتماد شخصيات جديدة.</li><li>السلطة أو القدرة على التحكم: للوصول الفوري إلى المعلومات وإلى الأشخاص.</li><li>الترفيه والتسلية: وعلى رأسهم المراهقين.</li></ul><h4>أكثر مواقع الإدمان الرقمي</h4><ul><li>حجرات الحوارات الحية أو غرف الدردشة: يفضل المراهق التعرف على أفراد جدد من الجنس الآخر، وقضاء وقت طويل في الحديث.</li><li>المواقع التي تعرض الصور الفاضحة: يقع المراهقون في هاوية الدخول إليها بدعوى الفضول.</li><li>الألعاب الإلكترونية: أكثر جاذبية للأطفال والمراهقين، توفر منافسة وتحدياً، وتعطي لذة في القتل والعنف، وأبرزها \"بابجي\"، والتخوف أن تتحول اللذة الخيالية إلى حقيقية.</li><li>نوادي النقاش أو المنتديات: تتبنى قضية أو هواية، مع حرية التعبير والتنفيس الانفعالي، وتتيح تقمص شخصيات دون كشف.</li><li>عمليات البحث والتصفح: تحتوي الإنترنت على كم هائل من المعلومات.</li><li>التسوق عبر الإنترنت والقمار.</li><li>مواقع التواصل الاجتماعي وإدمان مشاهدة الريلزات ومتابعة أخبار المشاهير.</li></ul><h4>تداعيات الإدمان الرقمي</h4><ul><li>مشكلات صحية: ضعف الجهاز المناعي، آلام في الظهر والعمود الفقري، ركود الدورة الدموية، جلطات دماغية وقلبية، التعب المتكرر، زيادة توتر القشرة المخية، قلة الانتباه ونقص التمييز، إصابة الأطفال بالصرع، ارتفاع ضغط الدم، التركيز المفرط بعالم الشاشات وعدم الانتباه للمؤثرات الخارجية، الاسترسال بأحلام اليقظة.</li><li>مشكلات أسرية واجتماعية:<ul><li>انخفاض الم ، وفقدان الهوية الغذائية المحلية، وتراجع الأطباق التراثية، مما يمثل خطراً على الموروث الثقافي الغذائي، وتأثيراً على الجانب الاجتماعي للأسرة لعزوف الشباب عن الوجبات المنزلية.</li><li>مراكز التسويق التجاري (المولات): جزء من الموروث الاقتصادي والثقافي، تحمل أسلوباً خاصاً من ممارسات الحياة اليومية. أصبح التسوق منها دلالة على التحضر، والاستمتاع بالتجول فيها أهم من عملية الشراء، مما يجعل التجول هوساً سيكولوجياً.</li><li>مدن الملاهي: أصبح الترفيه صناعة عالية النمو لها أثرها الثقافي، وتعتمد فن \"السيطرة على العقول\"، ففكرتها الأساسية ألا تتصل بالقضايا الجادة بل مجرد \"شغل الفراغ\". تعتمد شركات متعددة الجنسيات على \"الاقتصاد الترفيهي\" لتعزيز وجهات النظر وأنماط السلوك. الترفيه الشعبي هو دعاية تروج للوضع الراهن. الترفيه بحد ذاته ليس سلبياً، لكن طريقة الترفيه هي المشكلة لأنها تفرض الإسراف والتبذير وتجعل التفكير ينصب فقط على التسلية.</li><li>استطاعت آليات النظام الصناعي الجديد إيجاد وعي تجاري يقوم على الشراء المعنوي قبل المادي عبر الإعلانات التي تثير الغريزة الشرائية، لنشر النزعات الاستهلاكية وتعميقها، وأوجدت ثقافة للاستهلاك في البلدان النامية.</li><li>انتشار النزعات الاستهلاكية المفرطة في المجتمعات النامية مقترنة بالتخلف الاقتصادي كفيل بتحقيق أقصى درجات التخلف، فالشعوب التي ترضى بالاستهلاك دون المساهمة في الإنتاج تحكم على نفسها بالتقهقر والتبعية.</li><li>صورة المنتج تمنح المستهلك أسلوب حياة جديد وعلاقة جديدة مع نفسه ومع العالم، وتشمل سلعاً استهلاكية تتعارض مع خصوصيتنا الثقافية، وتهدف لنقل أنماط غربية لتبني أسلوب الحياة الغربية عبر إعادة تشكيل أذواق الأفراد. هذه هي \"ثقافة الاختراق\" التي تبث عبر المحطات الفضائية ومواقع التواصل، وأدت إلى إحلال الثقافات الأجنبية محل العربية.</li></ul><h4>العوامل المؤثرة في ثقافة الاستهلاك الترفي</h4><ul><li>العوامل الاجتماعية والثقافية: السلوك الاستهلاكي للفرد يتحدد بعوامل اجتماعية مثل العادات والقيم والتعليم والمكانة.</li><li>العوامل الاقتصادية: القدرة الشرائية للفرد ترسم مسارات الاستهلاك.</li><li>عوامل دينية: الدين يحث على الإنتاج والعمل والحد من الاستهلاك الترفي، وعندما يضعف الوازع الديني تكثر مظاهر التفاخر.</li><li>عوامل سياسية: الاستقرار السياسي يقود إلى الاستقرار الاجتماعي وبروز مظاهر الرفاهية.</li></ul><h4>مخاطر الاستهلاك التفاخري</h4><ul><li>له مخاطر على المستهلك، وفوائد على المؤسسات المنتجة ومؤسسات القروض.</li><li>زيادة النشاط التجاري والاستهلاك التفاخري تعتبر مؤشرات سلبية لأنها \"غير إنتاجية\"، أي مجرد استهلاك خارج منظومة الاكتفاء الذاتي.</li><li>زيادة الاستهلاك خارج الاحتياج تعني انخفاضاً في إنتاجية الفرد وتحمله أعباء مالية تفوق قدرته.</li><li>المعالجة: زيادة الوعي، تعزيز الثقة بالنفس، تربية الأطفال على القناعة، الحد من تأثير مواقع التواصل، ومشاركة المؤسسات المالية والاجتماعية والدينية والإعلامية في التصدي.</li></ul>",

لأسلوب التعاوني (المقيد): مزيج بين الأسلوبين الوالدي والذاتي. يسمح بتدخل الأسرة في الاختيار ولا يهمل رأي الأبناء، ويعطي الشاب حرية اختيار شريكته ويعطي الشابة حق إبداء الرأي بما يتوافق مع رغبة الأهل.</li></ul></li></ul><h4>معايير الاختيار الزواجي</h4><ul><li>تختلف من مجتمع لآخر ومن فرد لآخر، باختلاف القيم الثقافية والأعراف الاجتماعية.</li></ul><h5>أولاً: معايير مجتمعية</h5><ul><li>المعيار الاجتماعي: الحرص على تماثل المكانة الاجتماعية والانتماء الطبقي وتشابه القيم، وتكافؤ الأسر في المكانة والنسب والسمعة، بما يكفل الانسجام ويحقق الاستقرار.</li><li>المستوى الثقافي والتعليمي: الاهتمام به يتفاوت بين الذكور والإناث. بعض الرجال يفضلون التقارب التعليمي، بينما \"يميل كثير من الرجال إلى الزواج بمن هن أقل منهم تعليماً ودخلاً وذكاءً، مما يحقق لهم الهيمنة\"، بينما تفضل معظم النساء الارتباط بذكور بمستوى تعليمي يكافئ أو أعلى للشعور بالأمن والاستقرار.</li><li>معيار الدين: من المعايير الأساسية، خصوصاً مع تعدد الطوائف والمذاهب التي تميل إلى منع أبنائها من الزواج من غير طائفتهم، وقد يصل الأمر إلى النبذ والمقاطعة.</li><li>وجود مصدر دخل ثابت: من أهم المعايير لضمان تلبية احتياجات الأسرة وتوفير حياة كريمة.</li></ul><h5>ثانياً: معايير فردية</h5><ul><li>المظهر الخارجي: من معايير الجذب، ويتركز عليه الشباب أكثر، فالشاب يهتم أن تكون الفتاة رشيقة ذات مظهر حسن، بينما هذا المعيار ليس بالأهمية نفسها عند الغالبية من الفتيات، رغم حرصها على شريك ذي مظهر لائق.</li><li>تقارب العمر: بهدف تحقيق انسجام فكري ونفسي، وعادة ما يكون عمر الزوج أكبر من عمر الزوجة، وهو النمط الأكثر شيوعاً.</li></ul><p>على الفرد مراعاة تقبل الشخص نفسياً لشريكه، والإلمام بشخصيته بجوانبها الإيجابية والسلبية، وتقارباً فكرياً يساعدهما على الحوار ومعالجة المشكلات، وبخلاف ذلك يؤدي التباعد الفكري لفشل الزواج.</p><h4>النظريات المفسرة للاختيار الزواجي</h4><ul><li>تتعدد النظريات في اتجاهين: أحدهما يغلب عليه الطابع الاجتماعي الثقافي، والآخر يذهب إلى أثر العوامل النفسية (نظريات التحليل النفسي).</li><li>نظرية التجانس: الفرد يفضل الارتباط بمن يشبهه في الخصائص الاجتماعية والسمات الجسمية والنفسية (المستوى الاقتصادي والاجتماعي والدين والثقافة). هو ميل الناس شعورياً ولا شعورياً لاختيار شريك تتشابه خصائصه مع خصائصهم.</li><li>نظرية المعايير: ثقافة المجتمع تحدد للفرد معايير اختيار الشريك، فاختياره يبقى مرهوناً بما يقبله المجتمع أو يرفضه من معايير (السن، المستوى الاقتصادي، الدين، التعليم).</li><li>نظرية التقارب المكاني: يرغب الفرد بالارتباط بشريك من بيئته المكانية والجغرافية، وهذا يفسر الزواج من الأقارب والجيران.</li><li>نظرية تكامل الحاجات: الدافع الرئيسي للاختيار هو رغبة الفرد بإكمال الحاجات التي يفتقدها. يتم الاختيار على أساس الاختلاف في السمات والتكامل في الحاجات (الرجل المسيطر يفضل زوجة خنوعة، والفقيرة تفضل الغني).</li><li>نظرية الشريك المثالي: يكون الفرد صورة مبدئية مثالية لشريك الحياة تتأثر بحاجاته ومعايير المجتمع (فتى الأحلام وفتاة الأحلام).</li><li>نظرية الجاذبية الجسمية: الخصائص الجسدية (الطول، لون الشعر، البشرة) هي العامل الأساسي في الاختيار.</li><li>نظرية الحب: الانجذاب العاطفي هو العامل الأكثر تأثيراً في الاختيار، وقد أصبح هذا ملاحظاً في المجتمعات العربية نتيجة التطورات والعولمة.</li><li>نظريات التحليل النفسي: يرى فرويد أن الفرد يبحث عن شريك يشبهه أو شريك يحميه، وهناك الاختيار النرجسي والاختيار التكميلي. وهناك نظرية الصورة الوالدية التي ترى أن الفرد يتأثر بطبيعة العلاقة الزوجية بين والديه، فصورة الوالد والوالدة تلعب دوراً جوهرياً في عملية الاختيار.</li></ul><h3>ثانياً. الفجوة بين الأجيال</h3><ul><li>توجد فجوات متعددة: فجوة التكنولوجيا والمعرفة، فجوة الاتصالات، فجوة التعليم، فجوة الثقافة، فجوة الحريات، ولكل فجوة أبعاد، لكن المحرك الرئيسي لها هو \"فجوة تكنولوجيا المعلومات والاتصالات\".</li></ul><h4>مفهوم الفجوة المعلوماتية</h4><ul><li>الفجوة الحاصلة بين أولئك الذين يمتلكون الحصول على تكنولوجيا المعلومات والاتصالات ومهارات توظيفها وبين الذين لا يمتلكونها ضمن منطقة جغرافية أو مجتمع، فهي درجات التفاوت في مستوى التقدم في مجال الاتصالات وتكنولوجيا المعلومات.</li></ul><h4>مظاهر فجوة المعلوماتية</h4><ul><li>افتقاد الرؤى، الهبوط للأسفل، عدم حرية المعلومات والتبعية، غياب الإبداع وقتل المواهب، افتقاد التقييم التكنولوجي، نشوء نظم بطيئة وغير فعالة.</li></ul><h4>أسباب فجوة المعلوماتية</h4><ul><li>الظروف المالية والاقتصادية.</li><li>أسباب سياسية: تطورت التكنولوجيا في العالم الغربي وارتبطت برؤيته \"الاستعمارية\" التي اتخذت شكل \"العولمة\"، وتستخدم كأوراق ضغط لتحقيق المصالح والأهداف السياسية.</li><li>الظروف الاجتماعية.</li><li>اختلاف مستويات البحث العلمي والتقني: تفتقر معظم جامعات الدول العربية لجودة البحث العلمي وضعف الإنفاق عليه.</li></ul><h4>الفجوة بين الأجيال</h4><ul><li>تعريفها: الهوة الحادثة بين جيل وآخر مما يؤدي لاختلاف في القيم والعادات وفي طريقة ونمط أداء الأعمال، ويترتب عليه تباعد العلاقة وحدوث مشاكل وصراعات.</li><li>هي الهوة الفكرية والثقافية والمعيشية والرقمية الفاصلة بين جيل الآباء وجيل الأبناء، ويترتب على اتساعها صراع حاد بين الجيلين.</li><li>صراع الأجيال: أحد أنماط التفاعل الاجتماعي الناشئ نتيجة اختلاف الأفكار والقيم وتعارض المصالح.</li><li>توجد هوة داخل الأسرة بين جيل الآباء المتأثر بالموروث الثقافي، وجيل الأبناء المتلهف لاقتناء الإلكترونيات والمتمرد على أفكار الآباء.</li></ul><h4>مظاهر الفجوة بين الأجيال</h4><ul><li>فكرية: الجيل القديم يلتزم بالقيم ويرفض التكنولوجيا أحياناً، بينما الجيل الجديد يتمرد ويتحدى ويعتمد على التحولات الفكرية.</li><li>لغوية: الجيل القديم يلتزم باللغة العربية، بينما الجيل الجديد يلجأ إلى العامية والرموز.</li><li>سياسية: الجيل القديم يشعر بالأمان ويسأل \"ماذا سأقدم لوطني؟\"، بينما الجيل الجديد يشعر بالقلق ويسأل \"ماذا قدم لي وطني؟\".</li><li>اقتصادية: الجيل القديم يواظب وينجز ويوفر ويدخر، بينما الجيل الجديد يشعر بالكسل والإحباط ويميل للبذخ والاستهتار.</li><li>دينية: الجيل القديم يلتزم بالموروث الديني، بينما الجيل الجديد ينشغل بمطالب دنيوية.</li><li>تربوية: الجيل القديم يتبع أساليب تقليدية، بينما الجيل الجديد يتبع أساليب حديثة.</li><li>اجتماعية: الجيل القديم لديه نزعة أسرية ومودة وأنماط حياة بسيطة، بينما الجيل الجديد يميل للأنانية والفردية والعدوانية وأنماط حياة معقدة.</li><li>الجيل القديم متمسك بالتقاليد والأنظمة المحافظة، أما الجيل الجديد فيطمح للحرية والتغيير والتكنولوجيا والفردية.</li><li>اختلاف الآراء حول الحرية الشخصية: الجيل القديم يرى أنها تمرد، والجيل الجديد يراها حقاً مشروعاً.</li></ul><h4>أسباب الفجوة بين الأجيال</h4><ul><li>التطو                     "content": "<h3>أولاً. الذكاء العاطفي وبناء التفاهم الزوجي والأسري (نموذج بار-أون)</h3><ul><li>يقدم \"بار-أون\" نموذجه لفهم سبب قدرة بعض الأفراد على النجاح بشكل أفضل من البعض الآخر.</li><li>تعريف الذكاء العاطفي: مجموعة من القدرات العاطفية والشخصية والاجتماعية التي تؤثر في قدرة الفرد على التأقلم مع المتطلبات وضغوط البيئة.</li><li>الأفراد ذوو الذكاء العاطفي لديهم القدرة على التمييز والتعبير عن العواطف، وامتلاك احترام إيجابي للذات، وإبراز إمكانياتهم، وفهم مشاعر الآخرين، وتكوين علاقات إيجابية والحفاظ عليها دون أن يصبحوا اتكاليين. هم عادة متفائلون، مرنون، واقعيون، وناجحون في حل المشكلات دون فقدان السيطرة.</li></ul><h4>أبعاد نموذج بار-أون</h4><ul><li>البعد الشخصي الذاتي: ويتضمن: الوعي بالعواطف الذاتية، تأكيد الذات (التعبير عن المشاعر)، احترام الذات (التقييم الدقيق للذات)، تحقيق الذات (معرفة إمكانيات الذات)، الاستقلال (الفكري والعاطفي والسلوكي).</li><li>البعد الاجتماعي: ويتضمن: التعاطف (وعي وفهم مشاعر الآخرين)، المسؤولية الاجتماعية (إثبات الذات كعنصر فعال ومساهم)، العلاقات الاجتماعية (بدء علاقات متبادلة مرضية والحفاظ عليها).</li><li>بعد التكيف: ويتضمن: اختبار الواقع (إثبات مصداقية العواطف)، المرونة (تعديل العواطف والأفكار والسلوك)، حل المشكلات (تعريف المشكلة وتوليد أفضل الحلول).</li><li>بعد إدارة الضغوط: ويتضمن: تحمل الضغوط (مقاومة الأحداث المعاكسة)، ضبط الاندفاع (مقاومة وتأجيل الاندفاعات والتحكم بالعواطف).</li><li>بعد الانطباع الإيجابي: ويختص بالحالة المزاجية العامة، ويتضمن: التفاؤل (رؤية النواحي الإيجابية في الحياة)، السعادة (الشعور بالرضا عن الذات والاستمتاع بالحياة).</li></ul><p>يرى بار-أون نموذجه على أنه متصل بإمكانيات النجاح عوضاً عن النجاح بحد ذاته، ويشار له بنموذج \"الذكاء العاطفي الاجتماعي\" كمنظور أوسع، ويعرف على أنه تقاطع بين الكفاءات العاطفية والاجتماعية والمهارات التي تحدد كيف نفهم ونعبر عن ذواتنا ونفهم الآخرين ونتواصل معهم، ونتعامل مع المتطلبات اليومية.</p><h3>ثانياً. التنمر الإلكتروني</h3><ul><li>التنمر: أحد أسوأ السلوكيات السلبية المتكررة التي يقوم من خلالها المتنمر بإيذاء أو مضايقة شخص آخر أقل قوة منه.</li></ul><h4>تعريف التنمر الإلكتروني</h4><ul><li>قيام شخص ما بفعل سيء تجاه شخص آخر لأكثر من مرة بطريقة إلكترونية بقصد السخرية والإزعاج.</li><li>نوع من الإزعاج والتسلط عبر الإنترنت باستخدام الرسائل الفورية والبريد الإلكتروني وغرف الدردشة أو مواقع التواصل الاجتماعي بهدف مضايقة أو تهديد أو تخويف شخص ما.</li><li>شكل من أشكال العدوان، يعتمد على استخدام وسائل الاتصال الحديثة لنشر منشورات أو تعليقات، أو الترويج لإشاعات، أو إرسال رسائل بهدف إلحاق الضرر المعنوي والمادي بالآخرين.</li></ul><h4>أشكال التنمر الإلكتروني</h4><ul><li>الرسائل العدائية: معارك عبر الرسائل الإلكترونية، وتكون غامضة مثل رسائل التهديد من مجهول.</li><li>تشويه السمعة: تأليف قصص وشائعات ونشرها بهدف تشويه السمعة.</li><li>إفشاء الأسرار: الحصول على صور أو معلومات شخصية ونشرها، أو نشر أسرار محرجة.</li><li>المضايقة: الدخول على روابط تحتوي فيروسات، أو إرسال رسائل مسيئة.</li><li>انتحال الشخصية: التعامل على أنه شخص آخر لإيقاع الضحية في خطر.</li><li>الخداع.</li><li>الاستبعاد: إبعاد شخص ما قسراً.</li><li>التحرش.</li><li>الإهانة عبر إرسال ألفاظ نابية.</li><li>التصيد عبر تعليقات مزعجة وشتائم بشكل متعمد.</li></ul><h4>نوعا التنمر</h4><ul><li>مباشر: استخدام الإنترنت للتهديد أو الإهانة أو إرسال صور للابتزاز، وقد يكون وجهاً لوجه ويشمل أفعالاً جسدية أو لفظية.</li><li>غير مباشر: يحصل دون أن يلاحظ الضحية، كاختراق البريد الإلكتروني، أو نشر الإشاعات في الخفاء.</li></ul><h4>أسباب التنمر الإلكتروني</h4><ul><li>الإعلام والثورة التقنية:<ul><li>الألعاب الإلكترونية التي ترتكز على القوة وهزم الخصوم، فيدمنها المراهقون ويتصرفون كأن الحياة امتداد لها.</li><li>أفلام العنف: تتزايد مشاهد العنف والقتل، ويميل الأفراد للتقليد.</li></ul></li><li>الجهل بثقافة الاختلاف: رفض الاختلاف والتعامل معه كعيب.</li><li>غياب التنشئة الأسرية السليمة نتيجة الخلل في العلاقات والتفكك الأسري.</li><li>اضطراب العلاقات الاجتماعية لدى مسيئي استخدام الإنترنت، كمتابعي أفلام الرعب والعنف.</li><li>كسب الشهرة الإلكترونية عبر إثارة الجدل دون ضوابط أخلاقية.</li><li>السعي لإثبات الذات بغض النظر عن الأساليب والنتائج.</li><li>الرغبة بالتحكم وفرض السيطرة على الآخرين.</li><li>الغيرة من الناجحين ومحاولة تحطيمهم.</li><li>عدم الوعي حول أضرار التنمر الذي يمارسونه.</li><li>غياب دور المدرسة التربوي في نشر الوعي لدى الناشئة.</li></ul><h4>الفروق الأساسية بين التنمر العادي والتنمر الإلكتروني</h4><ul><li>التنمر التقليدي: صنف إلى أربعة أنماط:<ul><li>الانفعالي: التقليل من قيمة الضحية بالتجاهل والعزلة والسخرية والاحتقار.</li><li>البدني: إلحاق الأذى بالضحية عن طريق الدفع والضرب (شائع بين الذكور)، بينما تستخدم الإناث الكلام المستفز ونشر الشائعات.</li><li>الاجتماعي: عزل الضحية وانتقاد تصرفاتها ورفض صداقتها.</li><li>اللفظي: تهديد الضحية والاستهزاء بها واستعمال كلمات قاسية لإلحاق الأذى النفسي.</li></ul></li><li>التنمر الإلكتروني: يقوم على الأساليب التكنولوجية السريعة الانتشار، وتحول من البيئة الاجتماعية التقليدية إلى البيئة الافتراضية باستخدام أدوات التواصل الاجتماعي.</li></ul><h4>لماذا يعد التنمر الإلكتروني أكثر خطورة؟</h4><ul><li>يعتمد على الخبرة التكنولوجية والتخفي وانتحال الشخصية.</li><li>ضحيته تواجه صعوبة في الهروب منه، فخيار الاختباء غير موجود.</li><li>المتنمر قادر على البقاء مجهولاً، وتنفيذ التنمر لعدة أشخاص دون مجهود.</li><li>يسمح للمتنمر بمضايقة الضحية في أي وقت، ويقلل من مستوى المسؤولية والمحاسبة.</li><li>لا يتطلب المواجهة، ويستطيع المتنمر خفض المخاطر.</li><li>ينتشر في حياة الضحية بشكل أسرع ولا توجد قيود مكانية وزمانية.</li><li>في التنمر التقليدي ينتهي التنمر بانتهاء الفعل، بينما الإلكتروني مجهول وقت انتهائه لأن موضوع التنمر يبقى على الإنترنت.</li><li>يبقى التنمر التقليدي محصوراً بين قلة، بينما الإلكتروني ينتشر بسرعة ويصل لشريحة واسعة.</li></ul><h4>الآثار الناجمة عن التنمر الإلكتروني على المراهقين</h4><ul><li>صعوبة الثقة بالآخرين وصعوبة التواصل والتفاعل الاجتماعي السليم.</li><li>عدم الشعور بالأمان تجاه أي شخص.</li><li>تشتت الذهن وتراجع المستوى الدراسي وانعدام الرغبة بالذهاب إلى المدرسة.</li><li>ضعف الثقة بالنفس أمام الأقران وانعدام تقدير الذات.</li><li>الشعور بالخوف والقلق الدائم والحذر غير المبرر.</li><li>الشعور بالخجل وضعف التفاعل الاجتماعي.</li><li>اللجوء للسلوك العدواني (الدفاعي).</li><li>التعرض لأمراض نفسية وصحية، قد تؤدي إلى اكتئاب حاد والميل للعزلة، ويمكن أن تصل للانتحار.</li></ul><h4>التحديات التي يواجهها ضحايا التنمر الإلكتروني</h4><ul><li>التردد في الكشف عما يمرون به، خوفاً من أن تزيد حدة المشكلة.</li><li>بعض الآباء تكون ردات فعلهم سلبية لعدم معرفتهم بحقيقة التنمر، فيختارون طرقاً قد تزيد من حدة المشكلة.</li><li>خوف الأبناء من حرمانهم من أجهزتهم الإلكترونية.</li><li>الخوف الأكبر من نتائج معرفة أشخاص جدد بالأمر وانتشار الإساءة.</li><li>يعتقد الكثير من الأبناء أن الأهل عاجزون عن مساندتهم.</li><li>قد يفضل البعض بقاء الأهل بعيدين عما يمرون به.</li><li>النتيجة الأسوأ هي وصول الضحية لحالة صحية نفسية مأساوية.</li></ul><h4>بعض طرق الوقاية من التنمر</h4><ul><li>تعزيز الثقة بالنفس ونشر الوعي بمخاطره.</li><li>عدم نشر نقاط الضعف.</li><li>المحافظة على الخصوصية وعدم مشاركة تفاصيل الحياة.</li><li>التواصل مع الآخرين وتكوين علاقات جيدة حقيقية.</li><li>حماية الأجهزة الإلكترونية بكلمة مرور.</li><li>لا تكن متنمراً ولا تشارك فيه على أي شخص كان، ولو مرة واحدة، لأن الأمر سيعود عليك، وقد تسبب أضراراً نفسية وصحية ستكون مسؤولاً عنها.</li></ul>",

        // ================================================================
        // حالة اللعبة
        // ================================================================

        let gameState = {
            unlockedKeys: lecturesData.map(() => Array(10).fill(false)),
            completedLectures: lecturesData.map(() => false),
            currentLecture: 0,
        };

        let isFullscreen = false;

        // ================================================================
        // دوال مساعدة
        // ================================================================

        function isLectureUnlocked(lectureId) {
            if (lectureId === 0) return true;
            return gameState.completedLectures[lectureId - 1] === true;
        }

        function isLectureCompleted(lectureId) {
            return gameState.completedLectures[lectureId] === true;
        }

        function getKeysCount(lectureId) {
            return gameState.unlockedKeys[lectureId].filter(v => v === true).length;
        }

        function isLectureFullyCompleted(lectureId) {
            return getKeysCount(lectureId) === 10;
        }

        function updateCompletionStatus(lectureId) {
            if (isLectureFullyCompleted(lectureId)) {
                gameState.completedLectures[lectureId] = true;
                saveProgress();
            }
        }

        // ================================================================
        // حفظ وتحميل التقدم
        // ================================================================

        function saveProgress() {
            try {
                localStorage.setItem('arabicKnowledgeGame', JSON.stringify(gameState));
            } catch (e) { }
        }

        function loadProgress() {
            try {
                const saved = localStorage.getItem('arabicKnowledgeGame');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.unlockedKeys && parsed.unlockedKeys.length === lecturesData.length) {
                        gameState = parsed;
                        return true;
                    }
                }
            } catch (e) { }
            return false;
        }

        // ================================================================
        // رسم الخريطة
        // ================================================================

        function renderMap() {
            const mapGrid = document.getElementById('mapGrid');
            mapGrid.innerHTML = '';

            lecturesData.forEach((lecture, index) => {
                const unlocked = isLectureUnlocked(index);
                const completed = isLectureCompleted(index);
                const keysCount = getKeysCount(index);
                const isCurrent = (index === gameState.currentLecture);

                const node = document.createElement('div');
                node.className = 'map-node';

                if (!unlocked) {
                    node.classList.add('locked');
                } else if (completed) {
                    node.classList.add('completed');
                } else if (isCurrent) {
                    node.classList.add('current');
                } else {
                    node.classList.add('available');
                }

                const circle = document.createElement('div');
                circle.className = 'node-circle';

                const icon = completed ? '✓' : (unlocked ? '📖' : '🔒');
                circle.innerHTML = `
                    <span class="icon">${icon}</span>
                    <span class="number">${index + 1}</span>
                    ${!unlocked ? '<span class="lock-icon">🔒</span>' : ''}
                `;

                const label = document.createElement('div');
                label.className = 'node-label';
                const titleParts = lecture.title.split(':');
                label.textContent = titleParts.length > 1 ? titleParts[0].trim() : `محاضرة ${index + 1}`;

                const keysInfo = document.createElement('div');
                keysInfo.className = 'node-keys';
                keysInfo.innerHTML = `🔑 <span class="gold">${keysCount}</span>/10`;

                node.appendChild(circle);
                node.appendChild(label);
                node.appendChild(keysInfo);

                if (unlocked) {
                    node.addEventListener('click', () => {
                        openLectureModal(index);
                    });
                }

                mapGrid.appendChild(node);

                if (index < lecturesData.length - 1) {
                    const arrowWrapper = document.createElement('div');
                    arrowWrapper.style.cssText = 'display:flex;align-items:center;flex-shrink:0;';
                    const arrow = document.createElement('div');
                    arrow.className = 'map-arrow';
                    const nextUnlocked = isLectureUnlocked(index + 1);
                    const currentCompleted = isLectureCompleted(index);

                    

                    arrowWrapper.appendChild(arrow);
                    mapGrid.appendChild(arrowWrapper);
                }
            });

            updateGlobalProgress();
        }

        // ================================================================
        // تحديث التقدم الكلي
        // ================================================================

        function updateGlobalProgress() {
            const totalKeys = lecturesData.length * 10;
            let unlockedTotal = 0;
            gameState.unlockedKeys.forEach(arr => {
                unlockedTotal += arr.filter(v => v === true).length;
            });
            const percent = Math.round((unlockedTotal / totalKeys) * 100);
            document.getElementById('globalProgressFill').style.width = percent + '%';
            document.getElementById('globalProgressText').textContent = percent + '%';
        }

        // ================================================================
        // نافذة المحاضرة
        // ================================================================

        function openLectureModal(lectureId) {
            if (!isLectureUnlocked(lectureId)) return;

            gameState.currentLecture = lectureId;
            const lecture = lecturesData[lectureId];

            document.getElementById('modalTitle').textContent = lecture.title;
            document.getElementById('modalBody').innerHTML = lecture.content;

            renderModalKeys(lectureId);

            // إعادة تعيين حالة ملء الشاشة إذا كانت مفعلة
            if (isFullscreen) {
                toggleFullscreen();
            }

            document.getElementById('lectureModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function renderModalKeys(lectureId) {
            const grid = document.getElementById('modalKeysGrid');
            grid.innerHTML = '';
            const keys = gameState.unlockedKeys[lectureId];

            const count = keys.filter(v => v).length;
            document.getElementById('modalKeysCount').textContent = `${count} / 10`;

            for (let i = 0; i < 10; i++) {
                const key = document.createElement('div');
                key.className = 'key-item-modal';
                if (keys[i]) {
                    key.classList.add('unlocked');
                    key.textContent = '🔓';
                } else {
                    key.classList.add('locked-key');
                    key.textContent = `${i + 1}`;
                    key.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openQuestion(lectureId, i);
                    });
                }
                grid.appendChild(key);
            }
        }

        // ================================================================
        // وظيفة ملء الشاشة النقي 100%
        // ================================================================

        function toggleFullscreen() {
            const exitBtn = document.getElementById('exitFullscreenFloat');
            const fsText = document.getElementById('fsText');
            const fsIcon = document.querySelector('.fs-icon');
            const body = document.body;

            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                // إضافة كلاس ملء الشاشة للبدي - يخفي كل شيء
                body.classList.add('fullscreen-pure-mode');

                // إخفاء زر ملء الشاشة في الهيدر وإظهار الزر العائم
                document.getElementById('fullscreenBtn').style.display = 'none';
                exitBtn.classList.add('show');
                fsText.textContent = 'خروج من ملء الشاشة';
                fsIcon.textContent = '⛶';

                // محاولة استخدام Fullscreen API الحقيقي للمتصفح
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => { });
                    }
                } catch (e) { }

            } else {
                // إزالة كلاس ملء الشاشة
                body.classList.remove('fullscreen-pure-mode');

                document.getElementById('fullscreenBtn').style.display = 'flex';
                exitBtn.classList.remove('show');
                fsText.textContent = 'ملء الشاشة';
                fsIcon.textContent = '⛶';

                try {
                    if (document.exitFullscreen) {
                        document.exitFullscreen().catch(() => { });
                    }
                } catch (e) { }

                // إعادة التمرير للخلفية
                if (!document.getElementById('lectureModal').classList.contains('active')) {
                    document.body.style.overflow = '';
                }
            }
        }

        // زر ملء الشاشة
        document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        // زر الخروج العائم
        document.getElementById('exitFullscreenFloat').addEventListener('click', () => {
            toggleFullscreen();
        });

        // مراقبة تغيير ملء الشاشة من المتصفح (ESC)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isFullscreen) {
                // المستخدم خرج من ملء الشاشة عبر Esc
                isFullscreen = false;
                document.body.classList.remove('fullscreen-pure-mode');
                document.getElementById('fullscreenBtn').style.display = 'flex';
                document.getElementById('exitFullscreenFloat').classList.remove('show');
                document.getElementById('fsText').textContent = 'ملء الشاشة';
                document.querySelector('.fs-icon').textContent = '⛶';
                if (!document.getElementById('lectureModal').classList.contains('active')) {
                    document.body.style.overflow = '';
                }
            }
        });

        // ================================================================
        // إغلاق نافذة المحاضرة
        // ================================================================

        document.getElementById('closeLectureModal').addEventListener('click', () => {
            if (isFullscreen) {
                toggleFullscreen();
            }
            document.getElementById('lectureModal').classList.remove('active');
            document.body.style.overflow = '';
            renderMap();
        });

        document.getElementById('lectureModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                if (isFullscreen) {
                    toggleFullscreen();
                }
                document.getElementById('lectureModal').classList.remove('active');
                document.body.style.overflow = '';
                renderMap();
            }
        });

        // ================================================================
        // نظام الأسئلة
        // ================================================================

        let currentQuestionLecture = null;
        let currentQuestionIndex = null;
        let questionAnswered = false;

        function openQuestion(lectureId, questionIndex) {
            if (gameState.unlockedKeys[lectureId][questionIndex]) return;

            const lecture = lecturesData[lectureId];
            const q = lecture.questions[questionIndex];
            if (!q) return;

            currentQuestionLecture = lectureId;
            currentQuestionIndex = questionIndex;
            questionAnswered = false;

            const modal = document.getElementById('questionModal');
            document.getElementById('qNumber').textContent = `🔑 المفتاح ${questionIndex + 1} من 10`;
            document.getElementById('qText').textContent = q.q;

            const optionsContainer = document.getElementById('qOptions');
            optionsContainer.innerHTML = '';

            const feedback = document.getElementById('qFeedback');
            feedback.className = 'q-feedback';
            feedback.textContent = '';

            const closeBtn = document.getElementById('closeQuestionBtn');
            closeBtn.className = 'close-modal-btn';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => {
                    if (questionAnswered) return;
                    handleQuestionAnswer(lectureId, questionIndex, idx, btn);
                });
                optionsContainer.appendChild(btn);
            });

            modal.classList.add('active');
        }

        function handleQuestionAnswer(lectureId, questionIndex, selectedIdx, clickedBtn) {
            if (questionAnswered) return;
            const q = lecturesData[lectureId].questions[questionIndex];
            const isCorrect = (selectedIdx === q.correct);

            const allBtns = document.querySelectorAll('#qOptions button');
            allBtns.forEach(btn => btn.disabled = true);

            allBtns.forEach((btn, idx) => {
                if (idx === q.correct) btn.classList.add('correct');
                if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
            });

            const feedback = document.getElementById('qFeedback');
            if (isCorrect) {
                feedback.className = 'q-feedback show success';
                feedback.textContent = '✅ إجابة صحيحة! تم فتح المفتاح 🎉';
                gameState.unlockedKeys[lectureId][questionIndex] = true;
                renderModalKeys(lectureId);
                updateCompletionStatus(lectureId);
                saveProgress();
            } else {
                feedback.className = 'q-feedback show error';
                feedback.textContent = '❌ إجابة خاطئة. حاول مرة أخرى!';
                setTimeout(() => {
                    allBtns.forEach(btn => {
                        btn.disabled = false;
                        btn.classList.remove('correct', 'wrong');
                    });
                    feedback.className = 'q-feedback';
                    feedback.textContent = '';
                    questionAnswered = false;
                }, 1500);
                return;
            }

            questionAnswered = true;
            document.getElementById('closeQuestionBtn').className = 'close-modal-btn show';
        }

        document.getElementById('closeQuestionBtn').addEventListener('click', () => {
            document.getElementById('questionModal').classList.remove('active');
        });

        document.getElementById('questionModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('questionModal').classList.remove('active');
            }
        });

        // ================================================================
        // تهيئة اللعبة
        // ================================================================

        function initGame() {
            const hasSaved = loadProgress();
            if (!hasSaved) {
                gameState.completedLectures = lecturesData.map(() => false);
                gameState.unlockedKeys = lecturesData.map(() => Array(10).fill(false));
                gameState.currentLecture = 0;
                saveProgress();
            }

            renderMap();
        }

        document.addEventListener('DOMContentLoaded', initGame);

        console.log('☀️ رحلة المعرفة العربية - ملء شاشة نقي 100%');
        console.log(`📚 ${lecturesData.length} محاضرة · 🔑 10 مفاتيح لكل محاضرة`);
        console.log('📖 اضغط على ⛶ ملء الشاشة للقراءة المركزة');
        console.log('🔄 اضغط ESC للخروج من ملء الشاشة');
    </script>

</body>

</html>

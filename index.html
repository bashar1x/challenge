<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="تحديات حل الأسئلة والاختبارات في علم الاجتماع">
    <meta property="og:url" content="https://bashar1x.github.io/bash">
    <link rel="icon" type="image/jpeg" href="https://h.top4top.io/p_3881hfy4k1.jpg">
    <meta property="og:image" content="https://h.top4top.io/p_3881hfy4k1.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <title>اتحـداااك • baash.dev</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;;
        }

        body {
            background: linear-gradient(145deg, #0b0a1f 0%, #1b1a3e 50%, #2a2859 100%);
            height: 110vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;

            overflow: scroll;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: rgba(20, 18, 50, 0.75);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-radius: 36px;
            padding: 24px 20px;
            max-width: 780px;
            width: 100%;
            height: 95%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.05) inset;
            color: #f0f0f5;
            transition: padding 0.2s;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #f7971e 0%, #ffd700 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .subtitle {
            text-align: center;
            color: #a8a5c4;
            margin-bottom: 24px;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 18px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.25s ease;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: 500;
            color: #d5d2ea;
            font-size: 0.95rem;
        }

        label .optional {
            color: #8884b0;
            font-weight: 300;
            font-size: 0.8rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #f0f0f5;
            font-size: 1rem;
            transition: 0.25s;
            outline: none;
            caret-color: #ffd700;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15), 0 0 20px rgba(255, 215, 0, 0.05);
            background: rgba(0, 0, 0, 0.45);
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        select option {
            background: #1b1a3e;
            color: #f0f0f5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px 4px 4px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }

        .option-item span {
            color: #ffd700;
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 22px;
            text-align: center;
        }

        .option-item input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-color: rgba(255, 255, 255, 0.06);
            font-size: 0.95rem;
        }

        .option-item input:focus {
            border-color: #ffd700;
        }

        .btn {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0f0c29;
            border: none;
            padding: 14px 22px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            width: 100%;
            margin-top: 12px;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.07);
            color: #f0f0f5;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .btn-share-result {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
            border-color: rgba(0, 206, 201, 0.3);
        }

        .btn-share-result:hover {
            box-shadow: 0 8px 25px rgba(0, 206, 201, 0.35);
        }

        .challenge-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 5px;
            padding: 16px 18px;
            margin-top: 16px;
            border-right: 3px solid #ffd700;
            border-left: 1px solid rgba(255, 215, 0, 0.05);
        }

        .challenge-box .label {
            color: #a8a5c4;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .challenge-box .value {
            color: #f0f0f5;
            font-weight: 600;
            word-break: break-word;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 14px;
            border-radius: 5px;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .challenge-text {
            background: rgba(255, 215, 0, 0.06);
            border-right: 3px solid #ffd700;
            padding: 14px 16px;
            border-radius: 5px;
            margin: 10px 0 4px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #f5f0e0;
        }

        .challenge-text .mention {
            color: #ffd700;
            font-weight: 700;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .challenger-name {
            font-size: 1rem;
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 18px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            font-weight: 500;
            color: #ffd700;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.45);
            padding: 2px 20px;
            border-radius: 10px;

            min-width: 90px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.05);
        }

        .timer.warning {
            color: #ff6b6b;
            border-color: #ff6b6b;
            animation: blink 0.9s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .quiz-question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.6;
            padding: 0 4px;
            color: #f5f0f5;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0 12px;
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 1rem;
            color: #e8e5f5;
        }

        .quiz-option:hover {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.25);
            transform: translateX(-4px);
        }

        .quiz-option.selected {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
        }

        .quiz-option.correct {
            background: rgba(0, 255, 0, 0.12);
            border-color: #00ff88;
            color: #aaffaa;
        }

        .quiz-option.wrong {
            background: rgba(255, 0, 0, 0.12);
            border-color: #ff4757;
            color: #ffa8a8;
        }

        .quiz-option.disabled {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        .mt-10 {
            margin-top: 12px;
        }

        .mt-6 {
            margin-top: 8px;
        }

        .text-center {
            text-align: center;
        }

        .text-gold {
            color: #ffd700;
        }

        .text-sm {
            color: #a8a5c4;
            font-size: 0.85rem;
        }

        /* ===== RESULT POPUP (نافذة النتيجة) ===== */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-popup {
            background: rgba(20, 18, 50, 0.95);
            border-radius: 32px;
            padding: 32px 28px;
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .result-popup .result-icon {
            font-size: 4rem;
            margin-bottom: 8px;
        }

        .result-popup .result-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .result-popup .result-title.success {
            color: #00ff88;
        }

        .result-popup .result-title.fail {
            color: #ff4757;
        }

        .result-popup .result-sub {
            color: #b0accf;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .result-popup .result-answer {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 16px;
            margin: 14px 0 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #f0f0f5;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .result-popup .result-answer .q-label {
            color: #ffd700;
            font-weight: 600;
        }

        .result-popup .result-answer .a-label {
            color: #00ff88;
            font-weight: 600;
        }

        .result-popup .result-answer .wrong-label {
            color: #ff6b6b;
            font-weight: 600;
        }

        .result-popup .btn {
            margin-top: 10px;
        }

        .result-popup .btn-close-result {
            background: rgba(255, 255, 255, 0.08);
            color: #f0f0f5;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
            margin-top: 8px;
        }

        .result-popup .btn-close-result:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 18, 50, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px 28px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #f0f0f5;
            font-size: 1rem;
            font-weight: 500;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 999;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.4s ease;
            pointer-events: none;
        }

        .toast .highlight {
            color: #ffd700;
            font-weight: 700;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 680px) {
            .container {
                padding: 16px 12px;
                border-radius: 28px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .subtitle {
                font-size: 1rem;
                margin-bottom: 18px;
            }
            .section {
                padding: 14px 12px;
                border-radius: 20px;
            }
            .options-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .option-item {
                padding: 2px 6px 2px 4px;
            }
            .quiz-question {
                font-size: 1.1rem;
            }
            .timer {
                font-size: 1.2rem;
                min-width: 76px;
                padding: 0 14px;
            }
            .challenger-name {
                font-size: 0.85rem;
                padding: 4px 14px;
            }
            .btn {
                padding: 12px 16px;
                font-size: 0.95rem;
            }
            .quiz-option {
                padding: 12px 14px;
                font-size: 0.95rem;
            }
            .result-popup {
                padding: 24px 18px;
            }
            .result-popup .result-title {
                font-size: 1.3rem;
            }
            .result-popup .result-icon {
                font-size: 3rem;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 12px 8px;
                border-radius: 24px;
            }
            h1 {
                font-size: 2rem;
            }
            .section-title {
                font-size: 1rem;
            }
            input,
            textarea,
            select {
                padding: 10px 12px;
                font-size: 0.95rem;
            }
            .challenge-text {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
        }

        @media (hover: none) {
            .quiz-option:hover {
                transform: none;
                background: rgba(255, 255, 255, 0.04);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .btn:hover {
                transform: none;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }
        .divCareditLink {
            width: 100%;
            display: flex;
            justify-content: center;

            position: relative;
            top: -15px;
        }
        .credit-link {
            font-style: italic;
            font-size: 13px;
            color: #888;
            text-decoration-color: #76BCD5;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <a style="text-decoration: none;" href="/">
            <h1>اتحـداااك ✓</h1>
        </a>

        <p class="subtitle">
            أنشئ سؤالاً وتحدَّ أصدقاءك!
        </p>
        <div class="divCareditLink">
            <a href="https://www.instagram.com/baash.dev" target="_blank"
                rel="noopener noreferrer" class="credit-link">
                متابعة @baash.dev
            </a>
        </div>

        <!-- ========== CREATE ========== -->
        <div id="createSection" class="section">
            <div class="section-title">
                📝 إنشاء سؤال التحدي
            </div>

            <label>اسمك (المتحدي):</label>
            <input type="text" id="challengerName" placeholder="اكتب اسمك...">

            <label>منشن (اختياري) <span class="optional">—  اكتب اسم الشخص الذي تريد تحديه</span></label>
            <input type="text" id="mentionName" placeholder="مثلاً   'بشار'  'الكل'   او أتركه فارغاً" value="">

            <label>السؤال:</label>
            <textarea id="questionText" placeholder="اكتب سؤالاً صعباً"></textarea>

            <label>الخيارات (4):</label>
            <div class="options-grid">
                <div class="option-item">
                    <span>أ</span> <input type="text" id="opt1" placeholder="الخيار 1">
                </div>
                <div class="option-item">
                    <span>ب</span> <input type="text" id="opt2" placeholder="الخيار 2">
                </div>
                <div class="option-item">
                    <span>ج</span> <input type="text" id="opt3" placeholder="الخيار 3">
                </div>
                <div class="option-item">
                    <span>د</span> <input type="text" id="opt4" placeholder="الخيار 4">
                </div>
            </div>

            <label>اختر الإجابة الصحيحة:</label>
            <select id="correctAnswer">
                <option value="0">أ</option>
                <option value="1" selected>ب</option>
                <option value="2">ج</option>
                <option value="3">د</option>
            </select>

            <button class="btn" onclick="generateChallenge()">🚀 إنشاء التحدي</button>
        </div>

        <!-- ========== SHARE ========== -->
        <div id="shareSection" class="section hidden">
            <div class="section-title">
                تم إنشاء الاختبار
            </div>
            <div style="text-align:center; padding:10px 0 8px; font-size:1.1rem; color:#d5d2ea;">
                🎯 أرسله إلى صديقك
            </div>
            <div class="challenge-box">
                <div class="label">
                    📌 نص التحدي:
                </div>
                <div class="challenge-text" id="challengeTextDisplay">
                    أتحداك أن تقوم بحل هذا السؤال
                </div>
            </div>
            <div class="challenge-box mt-10">
                <div class="label">
                    👤 المتحدي:
                </div>
                <div class="value" id="displayChallenger">
                    أحمد
                </div>
                <div class="label mt-10">
                    ⏱ وقت الحل:
                </div>
                <div class="value" style="color: #ffd700; border-color: rgba(255,215,0,0.15);">
                    دقيقة فقط!
                </div>
            </div>
            <div style="margin-top:16px; text-align:center; color:#8884b0; font-size:0.9rem;">
                ⏳ جاري فتح نافذة المشاركة...
            </div>
        </div>

        <!-- ========== QUIZ ========== -->
        <div id="quizSection" class="section hidden">
            <div class="quiz-header">
                <span class="challenger-name" id="quizChallenger">👤 يتحداك: أحمد</span>
                <span class="timer" id="timerDisplay">01:00</span>
            </div>
            <div class="quiz-question" id="quizQuestion">
                ما هو أكبر كوكب في المجموعة الشمسية؟
            </div>
            <div class="quiz-options" id="quizOptions"></div>
        </div>
    </div>

    <!-- ====== RESULT POPUP (يتم إنشاؤه بواسطة JS) ====== -->
    <div id="resultPopupContainer"></div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================
        let currentChallenge = null;
        let resultData = null;
        let toastTimer = null;

        // ============================================================
        //  TOAST SYSTEM
        // ============================================================
        function showToast(message, duration = 4000) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            if (toastTimer) clearTimeout(toastTimer);

            const div = document.createElement('div');
            div.className = 'toast';
            div.innerHTML = message;
            document.body.appendChild(div);

            toastTimer = setTimeout(() => {
                if (div.parentNode) div.remove();
                toastTimer = null;
            },
                duration);
        }

        // ============================================================
        //  GENERATE CHALLENGE
        // ============================================================
        function generateChallenge() {
            const challenger = document.getElementById('challengerName').value.trim() || 'مجهول';
            const mention = document.getElementById('mentionName').value.trim();
            const question = document.getElementById('questionText').value.trim() || 'سؤال افتراضي؟';
            const opt1 = document.getElementById('opt1').value.trim() || 'خيار 1';
            const opt2 = document.getElementById('opt2').value.trim() || 'خيار 2';
            const opt3 = document.getElementById('opt3').value.trim() || 'خيار 3';
            const opt4 = document.getElementById('opt4').value.trim() || 'خيار 4';
            const correctIndex = parseInt(document.getElementById('correctAnswer').value);

            if (!question || !opt1 || !opt2 || !opt3 || !opt4) {
                alert('الرجاء ملء جميع الحقول!');
                return;
            }

            const options = [opt1,
                opt2,
                opt3,
                opt4];
            currentChallenge = {
                challenger,
                mention,
                question,
                options,
                correctIndex
            };

            let challengeText = `أتحداك أن تقوم بحل هذا السؤال`;
            if (mention) {
                challengeText += ` يا @${mention}`;
            }

            const data = {
                c: challenger,
                q: question,
                o: options,
                a: correctIndex
            };
            const json = JSON.stringify(data);
            const encoded = btoa(unescape(encodeURIComponent(json)));
            const url = new URL(window.location.href);
            url.searchParams.set('challenge', encoded);
            const link = url.toString();
            currentChallenge._link = link;
            currentChallenge._text = challengeText;

            document.getElementById('createSection').classList.add('hidden');
            document.getElementById('shareSection').classList.remove('hidden');
            document.getElementById('quizSection').classList.add('hidden');

            document.getElementById('challengeTextDisplay').textContent = challengeText;
            document.getElementById('displayChallenger').textContent = challenger;

            setTimeout(() => {
                autoShareChallenge();
            }, 1000);
        }

        // ============================================================
        //  AUTO SHARE
        // ============================================================
        function autoShareChallenge() {
            if (!currentChallenge) return;
            const link = currentChallenge._link;
            const text = currentChallenge._text;
            const shareText = `*🔥✓ اتحداااك 🔥*\n\n*رابط التحدي 🔗:*\n${link}\n\n👋🏻 ${text}`; if (navigator.share) {
                navigator.share({
                    title: 'تحدي',
                    text: shareText,
                }).catch(() => {
                    copyToClipboardWithToast(shareText, '📋 تم نسخ التحدي! أرسله إلى صديقك');
                });
            } else {
                copyToClipboardWithToast(shareText, '📋 تم نسخ التحدي إلى الحافظة! أرسله إلى صديقك');
            }
        }

        // ============================================================
        //  COPY TO CLIPBOARD
        // ============================================================
        function copyToClipboardWithToast(text, successMessage) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(successMessage);
                }).catch(() => {
                    fallbackCopy(text);
                    showToast(successMessage);
                });
            } else {
                fallbackCopy(text);
                showToast(successMessage);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
        }

        // ============================================================
        //  OPEN CHALLENGE FROM LINK
        // ============================================================
        function openChallengeFromLink() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('challenge');
            if (!encoded) {
                showToast('⚠️ لا يوجد تحدٍ في الرابط الحالي');
                return;
            }
            try {
                const json = decodeURIComponent(escape(atob(encoded)));
                const data = JSON.parse(json);
                currentChallenge = {
                    challenger: data.c || 'مجهول',
                    question: data.q || 'سؤال غير معروف',
                    options: data.o || ['خيار 1',
                        'خيار 2',
                        'خيار 3',
                        'خيار 4'],
                    correctIndex: data.a ?? 0,
                    _link: window.location.href
                };
                startQuiz();
            } catch (e) {
                showToast('⚠️ رابط التحدي غير صالح!');
            }
        }

        // ============================================================
        //  START QUIZ
        // ============================================================
        function startQuiz() {
            if (!currentChallenge) return;

            document.getElementById('createSection').classList.add('hidden');
            document.getElementById('shareSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');

            // إزالة أي نافذة نتيجة سابقة
            document.getElementById('resultPopupContainer').innerHTML = '';

            document.getElementById('quizChallenger').textContent = `👤 يتحداك: ${currentChallenge.challenger}`;
            document.getElementById('quizQuestion').textContent = currentChallenge.question;

            const container = document.getElementById('quizOptions');
            container.innerHTML = '';
            const labels = ['أ',
                'ب',
                'ج',
                'د'];
            currentChallenge.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'quiz-option';
                div.dataset.index = idx;
                div.textContent = `${labels[idx]}. ${opt}`;
                div.onclick = function() {
                    selectAnswer(idx);
                };
                container.appendChild(div);
            });

            startTimer(60);
        }

        // ============================================================
        //  TIMER
        // ============================================================
        let timerInterval = null;
        let timeLeft = 60;
        let isAnswered = false;

        function startTimer(seconds) {
            timeLeft = seconds;
            isAnswered = false;
            updateTimerDisplay();
            const timerEl = document.getElementById('timerDisplay');
            timerEl.classList.remove('warning');

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 10) {
                    timerEl.classList.add('warning');
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    if (!isAnswered) {
                        // انتهاء الوقت بدون إجابة
                        const correctAnswer = currentChallenge.options[currentChallenge.correctIndex];
                        resultData = {
                            success: false,
                            question: currentChallenge.question,
                            correctAnswer: correctAnswer,
                            challenger: currentChallenge.challenger,
                            selectedAnswer: 'لم يتم الاختيار',
                            timeout: true
                        };
                        disableOptions();
                        showResultPopup(false, '⏰ انتهى الوقت!');
                    }
                }
            },
                1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timerDisplay').textContent =
            `${String(mins).padStart(2,
                '0')}:${String(secs).padStart(2,
                '0')}`;
        }

        // ============================================================
        //  SELECT ANSWER
        // ============================================================
        function selectAnswer(idx) {
            if (isAnswered || timeLeft <= 0) return;
            isAnswered = true;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            const options = document.querySelectorAll('.quiz-option');
            options.forEach((el, i) => {
                el.style.cursor = 'default';
                if (i === currentChallenge.correctIndex) {
                    el.classList.add('correct');
                } else if (i === idx && i !== currentChallenge.correctIndex) {
                    el.classList.add('wrong');
                }
                if (i === idx) el.classList.add('selected');
                el.classList.add('disabled');
            });

            const success = (idx === currentChallenge.correctIndex);
            const correctAnswer = currentChallenge.options[currentChallenge.correctIndex];

            resultData = {
                success: success,
                question: currentChallenge.question,
                correctAnswer: correctAnswer,
                challenger: currentChallenge.challenger,
                selectedAnswer: currentChallenge.options[idx],
                timeout: false
            };

            // عرض النافذة المنبثقة
            if (success) {
                showResultPopup(true, '🎉 إجابة صحيحة!');
            } else {
                showResultPopup(false, '❌ إجابة خاطئة!');
            }
        }

        function disableOptions() {
            document.querySelectorAll('.quiz-option').forEach(el => {
                el.style.cursor = 'default';
                el.classList.add('disabled');
            });
        }

        // ============================================================
        //  RESULT POPUP
        // ============================================================
        function showResultPopup(success, title) {
            const container = document.getElementById('resultPopupContainer');

            const icon = success ? '🏆': '😅';
            const titleClass = success ? 'success': 'fail';
            const answerClass = success ? 'a-label': 'wrong-label';
            const answerText = success ? '✅ الإجابة الصحيحة': '❌ الإجابة الصحيحة هي';

            const popup = document.createElement('div');
            popup.className = 'result-overlay';
            popup.innerHTML = `
            <div class="result-popup">
            <div class="result-icon">${icon}</div>
            <div class="result-title ${titleClass}">${title}</div>
            <div class="result-sub">${success ? 'لقد استطعت حل سؤال': 'لم تستطع حل سؤال'} <strong style="color:#ffd700;">${resultData.challenger}</strong></div>
            <div class="result-answer">
            <div><span class="q-label">📝 السؤال:</span> ${resultData.question}</div>
            <div style="margin-top:6px;"><span class="${answerClass}">${answerText}:</span> ${resultData.correctAnswer}</div>
            ${!success && !resultData.timeout ? `<div style="margin-top:4px; color:#8884b0; font-size:0.85rem;">اخترت: ${resultData.selectedAnswer}</div>`: ''}
            ${resultData.timeout ? `<div style="margin-top:4px; color:#ff6b6b; font-size:0.85rem;">⏰ لم تقم بالإجابة في الوقت المحدد</div>`: ''}
            </div>
            <button class="btn btn-share-result" onclick="shareResultAndClose()">
            📤 أرسل نتيجتك إلى ${resultData.challenger}
            </button>
            <button class="btn btn-close-result" onclick="closeResultPopup()">
            ✖ إغلاق
            </button>
            </div>
            `;

            container.innerHTML = '';
            container.appendChild(popup);

            // بعد ثانية، فتح نافذة المشاركة تلقائياً
            setTimeout(() => {
                shareResultAndClose();
            }, 2000);
        }

        // ============================================================
        //  SHARE RESULT + CLOSE POPUP
        // ============================================================
        function shareResultAndClose() {
            if (!resultData) return;

            const emoji = resultData.success ? '✅': '❌';
            const statusText = resultData.success ? 'استطعت حل': 'لم استطع حل';

            let text = `${emoji} *${statusText} سؤال ${resultData.challenger}*\n\n`;
            text += `📝 *السؤال:* ${resultData.question}\n`;
            text += `✅ *الإجابة الصحيحة:* ${resultData.correctAnswer}\n\n`;
            if (resultData.success) {
                text += `🏆 متفوق`;
            } else {
                text += `من يستطيع حله 💤`;
            }

            // إغلاق النافذة المنبثقة
            //  closeResultPopup();

            // مشاركة
            if (navigator.share) {
                navigator.share({
                    title: 'نتيجة التحدي',
                    text: text
                }).catch(() => {
                    copyToClipboardWithToast(text, '📋 تم نسخ النتيجة! أرسلها إلى صديقك');
                });
            } else {
                copyToClipboardWithToast(text, '📋 تم نسخ النتيجة! أرسلها إلى صديقك');
            }
        }

        function closeResultPopup() {
            const container = document.getElementById('resultPopupContainer');
            container.innerHTML = '';
        }

        // ============================================================
        //  RESET
        // ============================================================
        function resetToCreate() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('createSection').classList.remove('hidden');
            document.getElementById('shareSection').classList.add('hidden');
            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('resultPopupContainer').innerHTML = '';

            const url = new URL(window.location.href);
            url.searchParams.delete('challenge');
            window.history.replaceState({}, '', url.toString());
            resultData = null;
        }

        // ============================================================
        //  AUTO LOAD
        // ============================================================
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('challenge')) {
                setTimeout(() => {
                    openChallengeFromLink();
                }, 300);
            }
        };
    </script>
</body>
</html>

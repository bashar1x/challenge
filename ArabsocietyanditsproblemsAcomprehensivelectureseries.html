                (function() {

                const HELP_LIMIT = 5;

                const SAVE_INDICATOR_DURATION = 2000;
                const DEBOUNCE_DELAY = 300;

                const totalQuestions = quizData.length;

                answerStatus: new Array(totalQuestions).fill(false),
                questionLocked: new Array(totalQuestions).fill(false),
                isTransitioning: false,

                };

                // ===== DOM Elements =====

                resetBtn: document.getElementById('resetBtn'),

                shareResultBtn: document.getElementById('shareResultBtn'),
                shareCurrentQuestionBtn: document.getElementById('shareCurrentQuestionBtn'),
                completionStudentName: document.getElementById('completionStudentName'),
                scoreGrade: document.getElementById('scoreGrade'),
                finalScoreNumber: document.getElementById('finalScoreNumber'),
                correctCount: document.getElementById('correctCount'),
                wrongCount: document.getElementById('wrongCount'),
                accuracyRate: document.getElementById('accuracyRate'),
                shareButtonsContainer: document.getElementById('shareButtonsContainer'),
                actionButtonsContainer: document.getElementById('actionButtonsContainer'),
                confettiContainer: document.getElementById('confettiContainer')
                };

                // ===== Utility Functions =====
                const escapeHTML = (str) => {
                const div = document.createElement('div');
                div.textContent = str ?? '';
                return div.innerHTML;
                };

                const calculateScore = () => {
                const correctCount = state.answerStatus.filter(s => s === true).length;
                return Math.round((correctCount / totalQuestions) * 1000) / 10;
                };

                const getCorrectCount = () => {
                return state.answerStatus.filter(s => s === true).length;
                };

                const getWrongCount = () => {
                return state.answerStatus.filter(s => s === false).length;
                };

                const correct = getCorrectCount();
                return Math.round((correct / totalQuestions) * 100);
                };

                const isQuizComplete = () => {
                return state.questionLocked.every(locked => locked === true);

                const clearTimeoutSafe = (timeoutId) => {
                if (timeoutId) {
                clearTimeout(timeoutId);
                return null;
                }
                return timeoutId;
                };

                const debounce = (fn, delay) => {
                let timer;
                return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
                };
                };

                const getGrade = (score) => {

                const createConfetti = () => {

                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -10 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 5 + 'px';
                confetti.style.height = Math.random() * 8 + 5 + 'px';
                confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%': '0';
                confettiContainer.appendChild(confetti);

                setTimeout(() => {
                confetti.remove();
                }, 4000);
                }
                };

                // ===== Storage Functions =====
                const saveProgress = () => {
                try {
                const progressData = {
                currentIndex: state.currentIndex,
                userAnswers: state.userAnswers,
                answerStatus: state.answerStatus,
                questionLocked: state.questionLocked,
                helpRemaining: state.helpRemaining,
                usedHelpOn: Array.from(state.usedHelpOn),
                studentName: state.studentName,
                isStarted: state.isStarted
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
                if (state.studentName) {
                localStorage.setItem(STUDENT_NAME_KEY, state.studentName);
                }
                showSaveIndicator();
                } catch (e) {
                console.warn('تعذر الحفظ في localStorage:', e);
                }
                };

                const loadProgress = () => {
                try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return false;

                const data = JSON.parse(saved);

                if (!data ||
                typeof data.currentIndex !== 'number' ||
                !Array.isArray(data.userAnswers) ||
                !Array.isArray(data.answerStatus) ||
                !Array.isArray(data.questionLocked) ||
                data.userAnswers.length !== totalQuestions ||
                data.answerStatus.length !== totalQuestions ||
                data.questionLocked.length !== totalQuestions) {
                return false;
                }

                state.currentIndex = Math.min(data.currentIndex, totalQuestions - 1);
                state.userAnswers = data.userAnswers;
                state.answerStatus = data.answerStatus;
                state.questionLocked = data.questionLocked;
                state.helpRemaining = data.helpRemaining ?? HELP_LIMIT;
                state.usedHelpOn = new Set(data.usedHelpOn || []);
                state.studentName = data.studentName || '';
                state.isStarted = data.isStarted || false;

                if (state.questionLocked[state.currentIndex]) {
                let foundUnlocked = false;
                for (let i = state.currentIndex + 1; i < totalQuestions; i++) {
                if (!state.questionLocked[i]) {
                state.currentIndex = i;
                foundUnlocked = true;
                break;
                }
                }
                if (!foundUnlocked && state.currentIndex === totalQuestions - 1 && state.questionLocked[state
                .currentIndex]) {
                state.currentIndex = totalQuestions - 1;
                }
                }

                return true;
                } catch (e) {
                console.warn('تعذر استرجاع البيانات من localStorage:', e);
                return false;
                }
                };

                const loadStudentName = () => {
                try {
                const name = localStorage.getItem(STUDENT_NAME_KEY);
                if (name) {
                state.studentName = name;
                return true;
                }
                return false;
                } catch (e) {
                return false;
                }
                };

                const clearProgress = () => {
                try {
                localStorage.removeItem(STORAGE_KEY);
                } catch (e) {
                console.warn('تعذر حذف البيانات من localStorage:', e);
                }
                };

                const showSaveIndicator = () => {
                dom.saveIndicator.style.display = 'inline-flex';
                dom.saveIndicator.textContent = '💾';

                state.saveIndicatorTimeoutId = clearTimeoutSafe(state.saveIndicatorTimeoutId);
                state.saveIndicatorTimeoutId = setTimeout(() => {
                dom.saveIndicator.style.display = 'none';
                }, SAVE_INDICATOR_DURATION);
                };

                // ===== Share Functions =====
                const shareImage = async (element, filename, elementsToHide = []) => {
                try {
                const originalStyles = elementsToHide
                .filter(el => el && el.style)
                .map(el => ({
                element: el,
                display: el.style.display,
                visibility: el.style.visibility
                }));

                originalStyles.forEach(({
                element
                }) => {
                element.style.display = 'none';
                });

                await new Promise(resolve => setTimeout(resolve, 100));

                const captureElement = dom.appContainer;

                const canvas = await html2canvas(captureElement, {
                scale: 2,
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: true,
                allowTaint: true,
                borderRadius: '2rem',
                windowWidth: captureElement.scrollWidth,
                windowHeight: captureElement.scrollHeight,
                x: 0,
                y: 0,
                onclone: (clonedDoc) => {
                const clonedContainer = clonedDoc.getElementById('appContainer');
                if (clonedContainer) {
                clonedContainer.style.animation = 'none';
                clonedContainer.style.transition = 'none';
                clonedContainer.style.opacity = '1';
                clonedContainer.style.background = '#ffffff';
                clonedContainer.style.backgroundColor = '#ffffff';

                const allElements = clonedContainer.querySelectorAll('*');
                allElements.forEach(el => {
                el.style.animation = 'none';
                el.style.transition = 'none';
                el.style.opacity = '1';
                el.style.boxShadow = 'none';
                el.style.textShadow = 'none';

                if (el.classList.contains('progress-area')) {
                el.style.background = '#f5efe5';
                el.style.backgroundColor = '#f5efe5';
                }
                if (el.classList.contains('quiz-card')) {
                el.style.background = '#ffffff';
                el.style.backgroundColor = '#ffffff';
                }
                if (el.classList.contains('completion-area')) {
                el.style.background = '#fdf8f0';
                el.style.backgroundColor = '#fdf8f0';
                }
                if (el.classList.contains('score-circle')) {
                el.style.background = '#6b4c3b';
                el.style.backgroundColor = '#6b4c3b';
                }
                if (el.classList.contains('btn-primary')) {
                el.style.background = '#6b4c3b';
                el.style.backgroundColor = '#6b4c3b';
                }
                if (el.classList.contains('btn-share')) {
                el.style.background = '#25D366';
                el.style.backgroundColor = '#25D366';
                }
                if (el.classList.contains('btn-share-question')) {
                el.style.background = '#e67e22';
                el.style.backgroundColor = '#e67e22';
                }
                if (el.classList.contains('btn-help-inline')) {
                el.style.background = '#d4a853';
                el.style.backgroundColor = '#d4a853';
                }
                if (el.classList.contains('option-letter')) {
                el.style.background = '#e8d7bc';
                el.style.backgroundColor = '#e8d7bc';
                }
                if (el.classList.contains('progress-bar-fill')) {
                el.style.background = '#d4a853';
                el.style.backgroundColor = '#d4a853';
                }
                if (el.classList.contains('question-counter')) {
                el.style.background = '#6b4c3b';
                el.style.backgroundColor = '#6b4c3b';
                }
                if (el.classList.contains('score-badge')) {
                el.style.background = '#ffffff';
                el.style.backgroundColor = '#ffffff';
                }
                if (el.classList.contains('stat-box')) {
                el.style.background = '#ffffff';
                el.style.backgroundColor = '#ffffff';
                }
                if (el.classList.contains('student-name-display')) {
                el.style.background = '#ffffff';
                el.style.backgroundColor = '#ffffff';
                }
                if (el.classList.contains('review-toggle-btn')) {
                el.style.background = '#ffffff';
                el.style.backgroundColor = '#ffffff';
                }
                if (el.classList.contains('review-item')) {
                el.style.background = '#fdfbf7';
                el.style.backgroundColor = '#fdfbf7';
                }
                if (el.classList.contains('option-item')) {
                el.style.background = '#fdfbf7';
                el.style.backgroundColor = '#fdfbf7';
                }
                });
                }
                }
                });

                originalStyles.forEach(({
                element,
                display,
                visibility
                }) => {
                element.style.display = display;
                element.style.visibility = visibility;
                });

                if (navigator.share) {
                canvas.toBlob(async (blob) => {
                const file = new File([blob], filename, {
                type: 'image/png'
                });
                try {
                await navigator.share({
                title: 'اختبار علم الاجتماع',
                files: [file]
                });
                } catch (shareError) {
                if (shareError.name !== 'AbortError') {
                downloadImage(canvas, filename);
                }
                }
                });
                } else {
                downloadImage(canvas, filename);
                }
                } catch (error) {
                console.error('خطأ في المشاركة:', error);
                originalStyles.forEach(({
                element, display, visibility
                }) => {
                element.style.display = display;
                element.style.visibility = visibility;
                });
                alert('حدث خطأ أثناء محاولة المشاركة. يرجى المحاولة مرة أخرى.');
                }
                };

                const downloadImage = (canvas, filename) => {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
                };

                // ===== Share Result =====
                const shareResult = () => {
                const elementsToHide = [];

                if (dom.shareButtonsContainer) {
                elementsToHide.push(dom.shareButtonsContainer);
                }
                if (dom.actionButtonsContainer) {
                elementsToHide.push(dom.actionButtonsContainer);
                }
                if (dom.reviewSection) {
                elementsToHide.push(dom.reviewSection);
                }

                shareImage(dom.appContainer, `نتيجة_${state.studentName || 'طالب'}.png`, elementsToHide);
                };

                // ===== Share Current Question =====
                const shareCurrentQuestion = () => {
                const elementsToHide = [];

                if (dom.shareCurrentQuestionBtn) {
                elementsToHide.push(dom.shareCurrentQuestionBtn);
                }
                if (dom.helpBtn) {
                elementsToHide.push(dom.helpBtn);
                }

                shareImage(dom.appContainer, `سؤال_${state.currentIndex + 1}_${state.studentName || 'طالب'}.png`,
                elementsToHide);
                };

                // ===== UI Update Functions =====
                const updateProgressBar = () => {
                const answered = state.questionLocked.filter(l => l === true).length;
                const percentage = (answered / totalQuestions) * 100;
                dom.progressBarFill.style.width = `${percentage}%`;
                };

                const updateScoreUI = () => {
                const score = calculateScore();
                dom.scoreText.textContent = `${score} / 100`;
                return score;
                };

                const updateHelpUI = () => {
                dom.helpCount.textContent = state.helpRemaining;
                const currentLocked = state.questionLocked[state.currentIndex];
                const usedOnCurrent = state.usedHelpOn.has(state.currentIndex);
                dom.helpBtn.disabled = state.helpRemaining <= 0 || currentLocked || usedOnCurrent;
                };

                const clearOptionHighlights = () => {
                dom.optionsContainer.querySelectorAll('.option-item').forEach(opt => {
                opt.classList.remove('selected-option', 'correct-answer', 'wrong-answer', 'eliminated-option');
                });
                };

                const applyOptionHighlights = () => {
                const {
                currentIndex,
                userAnswers,
                questionLocked
                } = state;
                const selected = userAnswers[currentIndex];
                const locked = questionLocked[currentIndex];
                const correct = quizData[currentIndex].correct;
                const options = dom.optionsContainer.querySelectorAll('.option-item');
                const usedHelp = state.usedHelpOn.has(currentIndex);

                options.forEach(opt => {
                const optText = opt.dataset.option;

                opt.classList.remove('selected-option', 'correct-answer', 'wrong-answer', 'eliminated-option');

                if (!locked) {
                if (optText === selected) opt.classList.add('selected-option');
                if (usedHelp && optText !== correct) {
                const wrongOptions = quizData[currentIndex].options.filter(o => o !== correct);
                if (wrongOptions.length >= 2) {
                const eliminateSet = new Set(wrongOptions.slice(0, 2));
                if (eliminateSet.has(optText)) {
                opt.classList.add('eliminated-option');
                }
                } else {
                if (optText !== correct) {
                opt.classList.add('eliminated-option');
                }
                }
                }
                return;
                }

                if (optText === correct) {
                opt.classList.add('correct-answer');
                } else if (optText === selected && selected !== correct) {
                opt.classList.add('wrong-answer');
                }

                opt.classList.add('disabled-option');
                });
                };

                // ===== Build Review List =====
                const buildReviewList = () => {
                const correctCount = getCorrectCount();
                const wrongCount = getWrongCount();

                let statsHtml = `
                <div class="review-stats">
                <span class="stat-correct">✅ صحيح: ${correctCount}</span>
                <span class="stat-wrong">❌ خاطئ: ${wrongCount}</span>
                </div>
                `;

                let itemsHtml = '';
                quizData.forEach((q, index) => {
                const isCorrect = state.answerStatus[index];
                const userAnswer = state.userAnswers[index];
                const correctAnswer = q.correct;
                const isAnswered = state.questionLocked[index];

                const statusClass = isCorrect ? 'correct-review': 'wrong-review';
                const statusIcon = isCorrect ? '✅': '❌';
                const statusText = isCorrect ? 'صحيحة': 'خاطئة';

                itemsHtml += `
                <div class="review-item ${statusClass}">
                <div class="review-question">
                <span class="review-icon">${statusIcon}</span>
                السؤال ${index + 1}: ${escapeHTML(q.quiz)}
                <span style="font-size:0.8rem;color:#999;font-weight:400;display:block;margin-top:0.2rem;">
                الحالة: <strong>${statusText}</strong>
                </span>
                </div>
                <div class="review-detail">
                <div>
                <span class="label">📝 إجابتك:</span>
                <span class="${isCorrect ? 'correct-text': 'wrong-text'}">
                ${isAnswered ? escapeHTML(userAnswer || 'لم يجب'): 'لم يجب بعد'}
                </span>
                </div>
                <div>
                <span class="label">✅ الإجابة الصحيحة:</span>
                <span class="correct-text">${escapeHTML(correctAnswer)}</span>
                </div>
                ${!isCorrect && isAnswered ? `
                <div style="margin-top:0.3rem;padding:0.3rem 0.6rem;background:#f0ece6;border-radius:0.5rem;font-size:0.8rem;color:#666;">
                💡 تذكر: الإجابة الصحيحة هي "${escapeHTML(correctAnswer)}"
                </div>
                `: ''}
                </div>
                </div>
                `;
                });

                dom.reviewList.innerHTML = statsHtml + itemsHtml;
                };

                // ===== Navigation Functions =====
                const showCompletionScreen = () => {
                state.nextQuestionTimeoutId = clearTimeoutSafe(state.nextQuestionTimeoutId);

                dom.quizCard.style.display = 'none';
                dom.progressArea.style.display = 'none';
                dom.completionArea.style.display = 'block';

                const score = calculateScore();
                const correct = getCorrectCount();
                const wrong = getWrongCount();
                const accuracy = getAccuracy();

                dom.finalScoreNumber.textContent = score;
                dom.completionStudentName.textContent = state.studentName ? `${state.studentName}`: '';
                dom.scoreGrade.textContent = getGrade(score);
                dom.correctCount.textContent = correct;
                dom.wrongCount.textContent = wrong;
                dom.accuracyRate.textContent = accuracy + '%';

                buildReviewList();
                dom.reviewList.classList.remove('open');
                dom.reviewToggleBtn.classList.remove('open');

                dom.completionArea.style.animation = 'none';
                dom.completionArea.offsetHeight;
                dom.completionArea.style.animation = 'slideUpSoft 0.5s ease';

                if (score >= 75) {
                createConfetti();
                }

                clearProgress();
                updateProgressBar();
                };

                const hideCompletionScreen = () => {
                dom.quizCard.style.display = 'block';
                dom.progressArea.style.display = 'flex';
                dom.completionArea.style.display = 'none';
                dom.progressBarFill.style.display = 'block';
                };

                const animateCardOut = (callback) => {
                if (state.isTransitioning) return;
                state.isTransitioning = true;
                state.nextQuestionTimeoutId = clearTimeoutSafe(state.nextQuestionTimeoutId);

                dom.quizCard.classList.add('fade-out');

                setTimeout(() => {
                callback();
                dom.quizCard.classList.remove('fade-out');
                state.isTransitioning = false;
                }, TRANSITION_DURATION);
                };

                const goToNextQuestion = () => {
                if (isQuizComplete()) {
                showCompletionScreen();
                return;
                }

                if (state.currentIndex < totalQuestions - 1) {
                animateCardOut(() => {
                state.currentIndex++;
                saveProgress();
                renderQuestion();
                });
                } else if (state.questionLocked[state.currentIndex]) {
                animateCardOut(() => {
                showCompletionScreen();
                });
                }
                };

                const scheduleNextQuestion = () => {
                state.nextQuestionTimeoutId = clearTimeoutSafe(state.nextQuestionTimeoutId);
                state.nextQuestionTimeoutId = setTimeout(() => {
                state.nextQuestionTimeoutId = null;
                goToNextQuestion();
                }, AUTO_ADVANCE_DELAY);
                };

                // ===== Question Rendering =====
                const renderQuestion = () => {
                if (isQuizComplete()) {
                showCompletionScreen();
                return;
                }

                hideCompletionScreen();

                const q = quizData[state.currentIndex];
                dom.questionText.innerHTML = q.quiz;
                dom.questionIndicator.textContent = `📌 السؤال ${state.currentIndex + 1}`;
                dom.questionDisplay.textContent = `السؤال ${state.currentIndex + 1} / ${totalQuestions}`;

                let html = '';
                q.options.forEach((opt, idx) => {
                html += `
                <div class="option-item" data-option="${escapeHTML(opt)}">
                <span class="option-letter">${ARABIC_LETTERS[idx]}</span>
                <span>${escapeHTML(opt)}</span>
                </div>
                `;
                });
                dom.optionsContainer.innerHTML = html;

                dom.optionsContainer.querySelectorAll('.option-item').forEach(item => {
                item.addEventListener('click', optionClickHandler);
                });

                clearOptionHighlights();
                applyOptionHighlights();
                updateScoreUI();
                updateHelpUI();
                updateProgressBar();
                };

                // ===== Event Handlers =====
                const optionClickHandler = (e) => {
                if (state.questionLocked[state.currentIndex] || state.isTransitioning) return;

                const optionDiv = e.currentTarget;
                if (optionDiv.classList.contains('eliminated-option')) return;

                const selectedAnswer = optionDiv.dataset.option;

                state.userAnswers[state.currentIndex] = selectedAnswer;

                dom.optionsContainer.querySelectorAll('.option-item')
                .forEach(opt => opt.classList.remove('selected-option'));
                optionDiv.classList.add('selected-option');

                lockCurrentQuestion(selectedAnswer);
                };

                const lockCurrentQuestion = (selectedAnswer) => {
                if (state.questionLocked[state.currentIndex]) return;

                const correctAns = quizData[state.currentIndex].correct;
                const isCorrect = (selectedAnswer === correctAns);

                state.answerStatus[state.currentIndex] = isCorrect;
                state.questionLocked[state.currentIndex] = true;

                clearOptionHighlights();
                applyOptionHighlights();
                updateScoreUI();
                updateHelpUI();

                saveProgress();

                dom.quizCard.classList.add('pulse');
                setTimeout(() => dom.quizCard.classList.remove('pulse'), 160);

                scheduleNextQuestion();
                updateProgressBar();
                };

                // ===== Help Function =====
                const useHelp = () => {
                if (state.helpRemaining <= 0) return;
                if (state.questionLocked[state.currentIndex]) return;
                if (state.usedHelpOn.has(state.currentIndex)) return;

                const q = quizData[state.currentIndex];
                const correct = q.correct;
                const wrongOptions = q.options.filter(o => o !== correct);
                const toEliminate = wrongOptions.slice(0, Math.min(2, wrongOptions.length));

                state.helpRemaining--;
                state.usedHelpOn.add(state.currentIndex);

                dom.optionsContainer.querySelectorAll('.option-item').forEach(opt => {
                const optText = opt.dataset.option;
                if (toEliminate.includes(optText)) {
                opt.classList.add('eliminated-option');
                }
                });

                updateHelpUI();
                saveProgress();
                };

                // ===== Reset Function =====
                const resetQuiz = () => {
                state.nextQuestionTimeoutId = clearTimeoutSafe(state.nextQuestionTimeoutId);
                state.saveIndicatorTimeoutId = clearTimeoutSafe(state.saveIndicatorTimeoutId);

                state.currentIndex = 0;
                state.userAnswers = new Array(totalQuestions).fill(null);
                state.answerStatus = new Array(totalQuestions).fill(false);
                state.questionLocked = new Array(totalQuestions).fill(false);
                state.isTransitioning = false;
                state.helpRemaining = HELP_LIMIT;
                state.usedHelpOn = new Set();

                clearProgress();

                hideCompletionScreen();
                renderQuestion();
                updateScoreUI();
                updateHelpUI();
                updateProgressBar();

                dom.appContainer.style.animation = 'none';
                dom.appContainer.offsetHeight;
                dom.appContainer.style.animation = 'containerEntry 0.6s cubic-bezier(0.22, 0.61, 0.36, 1)';
                };

                const debouncedReset = debounce(resetQuiz,
                DEBOUNCE_DELAY);

                // ===== Start Screen Functions =====
                const startQuiz = () => {
                const name = dom.studentNameInput.value.trim();
                if (!name) {
                dom.nameError.textContent = '⚠️ الرجاء إدخال اسمك';
                return;
                }
                if (name.length < 2) {
                dom.nameError.textContent = '⚠️ الاسم يجب أن يكون حرفين على الأقل';
                return;
                }

                state.studentName = name;
                state.isStarted = true;
                localStorage.setItem(STUDENT_NAME_KEY, name);

                dom.startScreen.style.display = 'none';
                dom.quizContent.style.display = 'block';

                const hasSaved = loadProgress();
                if (hasSaved && state.isStarted) {
                if (isQuizComplete()) {
                showCompletionScreen();
                } else {
                renderQuestion();
                updateScoreUI();
                updateHelpUI();
                updateProgressBar();
                }
                } else {
                state.currentIndex = 0;
                state.userAnswers = new Array(totalQuestions).fill(null);
                state.answerStatus = new Array(totalQuestions).fill(false);
                state.questionLocked = new Array(totalQuestions).fill(false);
                state.helpRemaining = HELP_LIMIT;
                state.usedHelpOn = new Set();
                renderQuestion();
                updateScoreUI();
                updateHelpUI();
                updateProgressBar();
                }
                };

                const toggleReviewList = () => {
                const isOpen = dom.reviewList.classList.contains('open');
                if (isOpen) {
                dom.reviewList.classList.remove('open');
                dom.reviewToggleBtn.classList.remove('open');
                } else {
                dom.reviewList.classList.add('open');
                dom.reviewToggleBtn.classList.add('open');
                }
                };

                const debouncedToggleReview = debounce(toggleReviewList, DEBOUNCE_DELAY);

                // ===== Event Listeners =====
                dom.startBtn.addEventListener('click', startQuiz);
                dom.studentNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startQuiz();
                });
                dom.studentNameInput.addEventListener('input',
                () => {
                dom.nameError.textContent = '';
                });

                dom.resetBtn.addEventListener('click',
                debouncedReset);
                dom.reviewToggleBtn.addEventListener('click',
                debouncedToggleReview);
                dom.helpBtn.addEventListener('click',
                useHelp);
                dom.shareResultBtn.addEventListener('click',
                shareResult);
                dom.shareCurrentQuestionBtn.addEventListener('click',
                shareCurrentQuestion);

                // ===== Initialization =====
                const initApp = () => {
                const hasName = loadStudentName();
                const hasProgress = loadProgress();

                if (hasName && hasProgress && state.isStarted) {
                dom.studentNameInput.value = state.studentName;
                dom.startScreen.style.display = 'none';
                dom.quizContent.style.display = 'block';

                if (isQuizComplete()) {
                showCompletionScreen();
                } else {
                renderQuestion();
                updateScoreUI();
                updateHelpUI();
                updateProgressBar();
                }
                } else if (hasName) {
                dom.studentNameInput.value = state.studentName;
                }
                };

                initApp();
                })();
                </script>
                </body>

                </html>
